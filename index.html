  const dist=(k)=>{const m=new Map(); IM.rows.forEach(r=>{const v=imVal(r.cells,k); if(v&&!m.has(nrm(v))) m.set(nrm(v),v);}); return [...m];};
  const sts=dist("status"), rsp=dist("resp");
  sts.forEach(([k,raw])=>{ if(!(k in IM.statusMap)) IM.statusMap[k]=defStatus(raw); }); rsp.forEach(([k,raw])=>{ if(!(k in IM.respMap)) IM.respMap[k]=defResp(raw); });
  $("im_cfg").innerHTML=`<div class="card wide"><h3>1. Colunas</h3><div class="grid2">${FIELDS.map(([k,l])=>`<label>${l}<select data-cm="${k}">${colOpts(IM.colmap[k])}</select></label>`).join("")}</div></div>
    <div class="card wide tbl"><h3>2. Seções encontradas (${IM.sections.length})</h3><table class="mt" style="min-width:0"><thead><tr><th>Título na planilha</th><th>Linhas</th><th>Grupo</th><th>Categoria</th><th>Instituição</th></tr></thead><tbody>${IM.sections.map((s,i)=>`<tr><td>${esc(s.title)}</td><td>${IM.rows.filter(r=>r.sec===i).length}</td>
      <td><select data-sf="${i}:kind">${Object.entries(KIND_L).map(([k,v])=>`<option value="${k}"${s.cfg.kind===k?" selected":""}>${v}</option>`).join("")}</select></td>
      <td><input data-sf="${i}:category" value="${esc(s.cfg.category)}" maxlength="100"></td><td><input data-sf="${i}:institution" value="${esc(s.cfg.institution)}" maxlength="100"${hasInst(s.cfg.kind)?"":" disabled"}></td></tr>`).join("")}</tbody></table></div>
    <div class="grid2"><div class="card wide tbl"><h3>3. Situações</h3>${sts.length?`<table class="mt" style="min-width:0"><tbody>${sts.map(([k,raw])=>`<tr><td>${esc(raw)}</td><td><select data-st="${esc(k)}"><option value="">(sem correspondência)</option>${Object.entries(ST).map(([s,v])=>`<option value="${s}"${IM.statusMap[k]===s?" selected":""}>${v[0]}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table>`:'<span style="color:var(--mut)">Sem coluna de situação: tudo entra como Pendente.</span>'}</div>
    <div class="card wide tbl"><h3>4. Responsáveis</h3>${rsp.length?`<table class="mt" style="min-width:0"><tbody>${rsp.map(([k,raw])=>`<tr><td>${esc(raw)}</td><td><select data-rs="${esc(k)}"><option value="">(nenhum)</option>${IM.people.map(p=>`<option value="${esc(p.id)}"${IM.respMap[k]===p.id?" selected":""}>${esc(p.full_name||p.email)}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table>`:'<span style="color:var(--mut)">Sem coluna de responsável.</span>'}</div></div>
    <p style="color:var(--mut);font-size:13px">Linhas reconhecidas e ignoradas: ${IM.counts.header} cabeçalho(s), ${IM.counts.total} total(is), ${IM.counts.blank} em branco.</p><button class="btn" id="im_val">Validar e visualizar</button>`;
  $("im_val").onclick=imValidate;
}
function imCfgChange(e){
  const t=e.target;
  if(t.dataset.cm){ IM.colmap[t.dataset.cm]=t.value===""?null:Number(t.value); imCfg(); }
  else if(t.dataset.sf){ const [i,f]=t.dataset.sf.split(":"); IM.sections[i].cfg[f]=t.value; if(f==="kind"){ IM.sections[i].cfg.category=({bank:"Contas Correntes / Aplicações",cash:"Caixas",card:"Cartões",payroll:"Folha - CLT",fiscal:"Fiscal",appropriation:"Apropriação",third_party:"Fornecedores"})[t.value]; imCfg(); } }
  else if(t.dataset.st!==undefined) IM.statusMap[t.dataset.st]=t.value; else if(t.dataset.rs!==undefined) IM.respMap[t.dataset.rs]=t.value;
}
async function imValidate(){
  if(IM.colmap.description==null){ toast("Informe a coluna de Descrição."); return; }
  $("im_out").textContent="Validando…";
  const [acc,per]=await Promise.all([sb.from("monitored_accounts").select("id,description,account_number,account_categories!inner(kind)").eq("company_id",IM.cid),
    sb.from("monthly_periods").select("id,status").eq("company_id",IM.cid).eq("year",IM.y).eq("month",IM.m).maybeSingle()]);
  if(acc.error||per.error){ $("im_out").textContent="Erro ao consultar o banco: "+(acc.error||per.error).message; return; }
  if(per.data?.status==="encerrada"){ $("im_out").innerHTML='<div class="card wide">A competência está encerrada. Peça a um administrador para reabri-la antes de importar.</div>'; return; }
  let recs=[]; if(per.data){ const r=await sb.from("monthly_account_records").select("account_id,status,final_balance").eq("period_id",per.data.id); recs=r.data||[]; }
  const key=(k,d,n)=>k+"|"+String(d).trim().toLowerCase()+"|"+String(n||"").trim();
  const am=new Map(acc.data.map(a=>[key(a.account_categories.kind,a.description,a.account_number),a])), rm=new Map(recs.map(r=>[r.account_id,r])), seen=new Map();
  IM.valid=IM.rows.map(r=>{
    const s=IM.sections[r.sec], cfg=s.cfg, c=r.cells, d=imVal(c,"description"), num=imVal(c,"number"), code=imVal(c,"code"), stRaw=imVal(c,"status"), rsRaw=imVal(c,"resp"), bal=parseMoney(imVal(c,"balance"));
    const o={line:r.line,sec:s.title,kind:cfg.kind,category:(cfg.category||"").trim()||KIND_L[cfg.kind],institution:hasInst(cfg.kind)?(cfg.institution||"").trim():"",description:d,account_number:num,accounting_code:code,
      status:stRaw?IM.statusMap[nrm(stRaw)]:"pendente",stRaw,responsible_id:rsRaw?(IM.respMap[nrm(rsRaw)]||""):"",bal:bal.v,state:"",msg:""};
    const err=!d?"Descrição vazia":bal.err?"Saldo: "+bal.err:!o.status?"Situação sem correspondência: "+stRaw:"";
    const k=key(cfg.kind,d,num); if(err){ o.state="erro"; o.msg=err; }
    else if(seen.has(k)){ o.state="erro"; o.msg="Duplicada na planilha (linha "+seen.get(k)+")"; }
    else { seen.set(k,r.line); const a=am.get(k); if(!a) o.state="nova"; else { const rec=rm.get(a.id); o.state=(!rec||(rec.final_balance==null&&rec.status==="pendente"))?"preenche":"conflito"; } }
    return o; });
  imPreview();
}
const IMS={nova:["Nova conta","ok"],preenche:["Preenche registro","ok"],conflito:["Já tem dados","warn"],erro:["Rejeitada","err"]};
function imPreview(){
  const v=IM.valid, n=(s)=>v.filter(x=>x.state===s).length, okN=v.length-n("erro");
  $("im_out").innerHTML=`<div class="card wide tbl"><h3>5. Pré-visualização</h3><div class="pills"><span>Linhas <b>${v.length}</b></span><span>Novas contas <b>${n("nova")}</b></span><span>Preenchem registro <b>${n("preenche")}</b></span><span>Já têm dados <b>${n("conflito")}</b></span><span>Rejeitadas <b>${n("erro")}</b></span></div>
    ${n("conflito")?`<div class="card" style="border-left:4px solid var(--warn);max-width:none"><b>${n("conflito")} registro(s) desta competência já têm dados.</b> Nada é sobrescrito sem a sua escolha:
      <label style="display:flex;gap:8px;margin-top:6px"><input type="radio" name="im_mode" value="skip" ${IM.mode==="skip"?"checked":""}> Manter os dados existentes e ignorar essas linhas</label>
      <label style="display:flex;gap:8px"><input type="radio" name="im_mode" value="overwrite" ${IM.mode==="overwrite"?"checked":""}> Sobrescrever com os valores da planilha (a alteração fica na auditoria)</label></div>`:""}
    <table class="mt"><thead><tr><th>Linha</th><th>Seção</th><th>Descrição</th><th>Nº conta</th><th>C. contábil</th><th>Situação</th><th class="r">Saldo final</th><th>Resultado</th></tr></thead><tbody>${v.slice(0,300).map(o=>`<tr><td>${o.line}</td><td>${esc(o.sec)}</td><td>${esc(o.description)}</td><td>${esc(o.account_number)}</td><td>${esc(o.accounting_code)}</td><td>${o.status?ST[o.status][0]:esc(o.stRaw)}</td><td class="r">${o.bal==null?"—":brl(o.bal)}</td>
      <td><span class="tag ${IMS[o.state][1]}">${IMS[o.state][0]}</span>${o.msg?" "+esc(o.msg):""}</td></tr>`).join("")}</tbody></table>${v.length>300?"<p>Mostrando as primeiras 300 linhas.</p>":""}
    <div class="bar" style="margin-top:12px"><button class="btn" id="im_go" ${okN?"":"disabled"}>Confirmar importação de ${okN} linha(s)</button><span style="color:var(--mut);align-self:center">${n("erro")?n("erro")+" rejeitada(s) não serão importadas. Corrija a planilha e envie de novo para incluí-las.":""}</span></div></div>`;
  document.querySelectorAll('input[name="im_mode"]').forEach(r=>r.onchange=()=>{ IM.mode=r.value; });
  $("im_go").onclick=imConfirm;
}
async function imConfirm(){
  const rows=IM.valid.filter(o=>o.state!=="erro").map(o=>({kind:o.kind,category:o.category,institution:o.institution,description:o.description,account_number:o.account_number,accounting_code:o.accounting_code,status:o.status,responsible_id:o.responsible_id,final_balance:o.bal}));
  const ow=IM.mode==="overwrite"; if(!confirm(`Importar ${rows.length} linha(s) para ${MESES[IM.m-1]}/${IM.y}?${ow?" Os registros que já têm dados serão SOBRESCRITOS.":""} Se algo falhar, nada será gravado.`)) return;
  $("im_go").disabled=true;
  const {data,error}=await sb.rpc("import_period_rows",{p_company:IM.cid,p_year:IM.y,p_month:IM.m,p_rows:rows,p_overwrite:ow});
  if(error){ $("im_go").disabled=false; toast("A importação não foi feita: "+error.message); return; }
  const rej=IM.valid.filter(o=>o.state==="erro").length;
  $("im_out").innerHTML=`<div class="card wide"><h3>Importação concluída</h3><table><tbody><tr><td>Contas novas criadas</td><td><b>${data.accounts_created}</b></td></tr><tr><td>Registros preenchidos</td><td><b>${data.records_filled}</b></td></tr>
    <tr><td>Registros sobrescritos</td><td><b>${data.records_overwritten}</b></td></tr><tr><td>Registros mantidos (já tinham dados)</td><td><b>${data.records_kept}</b></td></tr>
    <tr><td>Linhas ignoradas (cabeçalhos, totais e em branco)</td><td><b>${IM.counts.header+IM.counts.total+IM.counts.blank}</b></td></tr><tr><td>Linhas rejeitadas</td><td><b>${rej}</b></td></tr></tbody></table>
    <p><button class="btn" id="im_done">Ir para o acompanhamento mensal</button></p></div>`;
  $("im_cfg").innerHTML=""; $("im_done").onclick=()=>renderMensal();
}

/* ============ REFINAMENTOS DO ACOMPANHAMENTO MENSAL (Etapa 6.1) ============ */

});
function bindSearch(){

    document.querySelectorAll("#mbody tr[data-q]").forEach(tr=>tr.classList.toggle("hidden",!!q&&!tr.dataset.q.includes(q)));
    $("mbody").classList.toggle("searching",!!q);
    document.querySelectorAll("#mbody .mblock").forEach(c=>c.classList.toggle("hidden",!!q&&!c.querySelector("tr[data-q]:not(.hidden)"))); };

async function createPanel(cid,y,m){
  const {data:cats,error}=await sb.from("account_categories").select("id,name,kind").eq("company_id",cid).eq("active",true).order("kind").order("sort_order");
  if(error){ toast("Erro ao carregar as categorias: "+error.message); return; }
  if(!cats.length){ toast("Cadastre as categorias e contas da empresa antes de abrir uma competência."); return; }
  $("mbody").innerHTML=`<div class="card"><h3>Criar competência de ${MESES[m-1]}/${y}</h3>
    <p style="margin:0 0 8px">Serão copiadas as contas ativas das categorias marcadas. Saldo final fica vazio, a situação volta para Pendente e o saldo anterior vem do mês anterior, se existir.</p>
    ${cats.map(c=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" class="cc" value="${esc(c.id)}" checked> ${esc(c.name)} <span style="color:var(--mut)">(${KIND_L[c.kind]})</span></label>`).join("")}
    <div class="msg" id="cpmsg" role="alert"></div>
    <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" id="cpgo">Confirmar criação</button><button class="btn sec" id="cpcancel">Cancelar</button></div></div>`;
  $("cpcancel").onclick=()=>renderMensal();
  $("cpgo").onclick=async()=>{
    const ids=[...document.querySelectorAll(".cc:checked")].map(x=>x.value);
    if(!ids.length){ $("cpmsg").textContent="Marque ao menos uma categoria."; return; }
    $("cpgo").disabled=true;
    const {error:e}=await sb.rpc("create_period",{p_company:cid,p_year:y,p_month:m,p_categories:ids});
    if(e){ $("cpgo").disabled=false; $("cpmsg").textContent=e.code==="23505"?"Esta competência já existe.":"Não foi possível criar: "+e.message; return; }
    toast("Competência criada."); renderMensal();
  };
}

/* ============ ORDENAÇÃO POR COLUNA (Etapa 6.2) ============ */
const SORTKEYS={
  revenue_code:(r)=>r.monitored_accounts.revenue_code, description:(r)=>r.monitored_accounts.description, institution:(r)=>r.monitored_accounts.institution, account_number:(r)=>r.monitored_accounts.account_number,
  accounting_code:(r)=>r.monitored_accounts.accounting_code, previous_balance:(r)=>r.previous_balance, final_balance:(r)=>r.final_balance,
  status:(r)=>ST[r.status][0], responsible:(r)=>{const p=MM.people.find(x=>x.id===r.responsible_id); return p?(p.full_name||p.email):"";}, updated_at:(r)=>r.updated_at
};
function sortMensal(th){
  const key=th.dataset.sort, f=SORTKEYS[key]; if(!f) return;
  MM.sort={key,dir:MM.sort&&MM.sort.key===key?-MM.sort.dir:1};
  const col=new Intl.Collator("pt-BR",{numeric:true,sensitivity:"base"}), num=key==="previous_balance"||key==="final_balance", byId=new Map(MM.rows.map(r=>[r.id,r]));
  document.querySelectorAll("#mbody table.mt").forEach(tb=>{
    const body=tb.tBodies[0]; if(!body||!body.querySelector("tr[data-rid]")) return;
    const groups=[]; let cur={head:null,rows:[]}; groups.push(cur);
    [...body.rows].forEach(tr=>{ if(tr.classList.contains("catrow")){ cur={head:tr,rows:[]}; groups.push(cur); } else if(cur) cur.rows.push(tr); });
    groups.forEach(g=>g.rows.sort((a,b)=>{
      const va=f(byId.get(a.dataset.rid)), vb=f(byId.get(b.dataset.rid)), ea=va==null||va==="", eb=vb==null||vb==="";
      if(ea||eb) return ea&&eb?0:ea?1:-1;                       // vazios sempre por último
      return MM.sort.dir*(num?Number(va)-Number(vb):col.compare(String(va),String(vb))); }));
    groups.forEach(g=>{ if(g.head) body.appendChild(g.head); g.rows.forEach(tr=>body.appendChild(tr)); });
    tb.querySelectorAll("th[data-sort]").forEach(h=>{ const on=h.dataset.sort===key; h.textContent=h.dataset.l+(on?(MM.sort.dir===1?" ▲":" ▼"):"");
      h.setAttribute("aria-sort",on?(MM.sort.dir===1?"ascending":"descending"):"none"); });
  });
}
function bindSort(){ $("mbody").onkeydown=(e)=>{ if(e.key==="Enter"&&e.target.matches("th[data-sort]")) e.target.click(); }; }

let CT={rows:[],people:[],edit:null};
async function renderCartoes(){

  $("view").innerHTML=`<h2>Cartões</h2><p style="margin:-8px 0 12px;color:var(--mut)">${MESES[m-1]} de ${y} · ${esc(co?(co.trade_name||co.legal_name):"todas as empresas")}</p>

     <label>Código receita<input id="k_rev" maxlength="60"></label><label>Código contábil<input id="k_code" maxlength="60"></label>
     <label>Final do cartão (somente os 4 últimos dígitos, opcional)<input id="k_num" maxlength="4" inputmode="numeric" placeholder="0000"></label>

    const [rs,pf]=await Promise.all([fetchAll(()=>{ let q=sb.from("monthly_account_records").select("id,status,responsible_id,monitored_accounts!inner(id,company_id,description,institution,account_number,accounting_code,revenue_code,active,sort_order,account_categories!inner(kind)),monthly_periods!inner(year,month,company_id,status)").eq("monthly_periods.year",y).eq("monthly_periods.month",m).order("id"); if(cid) q=q.eq("monthly_periods.company_id",cid); return q; }),

  }catch(e){ $("ct_list").textContent="Erro ao carregar: "+(e.message||e); return; }
  $("ct_q").oninput=drawCartoes; $("ct_s").onchange=drawCartoes; $("ct_list").onchange=onCardChange; $("ct_list").onclick=onCardClick; $("k_cancel").onclick=()=>$("ct_dlg").close(); $("k_save").onclick=saveCard;

async function onCardChange(e){
  const el=e.target.closest("[data-f]"); if(!el) return;
  const r=CT.rows.find(x=>x.id===el.dataset.id), f=el.dataset.f, v=el.value||null;
  const {error}=await sb.from("monthly_account_records").update({[f]:v}).eq("id",r.id);
  if(error){ toast("Não foi possível salvar: "+error.message); el.value=r[f]??""; return; }

async function saveCard(){

function cpfValido(v){ const d=cpfDigits(v); if(d.length!==11||/^(\d)\1{10}$/.test(d)) return false;

async function dfFlush(){ clearTimeout(DF.timer); if(DF.dirty) await dfSave(); else if(DF.saving) await DF.saving; }

async function loadDecl(){
  const ms=dfMonths(DF.start.y,DF.start.m), first=ms[0], last=ms[11];
  $("df_range").textContent=`Período: ${mmyy(first.y,first.m)} a ${mmyy(last.y,last.m)}`;
  $("df_body").textContent="Carregando…"; DF.dirty=false; DF.status=""; dfLS.set("df_last",{cid:DF.cid,start:DF.start});
  const yrs=[...new Set(ms.map(x=>x.y))];
  try{
    const [cats,recs,st,vals,lg]=await Promise.all([
      sb.from("account_categories").select("id,name,kind,active").eq("company_id",DF.cid).order("kind").order("sort_order").order("name"),
      fetchAll(()=>sb.from("monthly_account_records").select("id,final_balance,status,monitored_accounts!inner(category_id),monthly_periods!inner(year,month,company_id)").eq("monthly_periods.company_id",DF.cid).in("monthly_periods.year",yrs).order("id")),
      sb.from("billing_settings").select("*").eq("company_id",DF.cid).maybeSingle(),
      sb.from("billing_month_values").select("year,month,amount").eq("company_id",DF.cid).in("year",yrs),
      sb.from("billing_logos").select("id,name,data").order("created_at")]);
    DF.logosMissing=!!lg.error; DF.logos=lg.error?[]:(lg.data||[]);
    if(cats.error) throw cats.error;
    DF.missing=!!(st.error||vals.error);
    if(DF.missing&&!/billing_/.test((st.error||vals.error).message)) throw (st.error||vals.error);
    DF.cats=cats.data||[]; DF.recs=recs;
    const co=state.companies.find(c=>c.id===DF.cid);
    const row=(!DF.missing&&st.data)||null;
    DF.notesMissing=!!(row&&!("notes" in row));
    DF.set=Object.assign({accountant_name:"",accountant_role:"Contador",accountant_crc:"",rep_name:"",rep_role:"Presidente",rep_cpf:"",place:"Campina Grande/PB",logo_id:null,revenue_category_ids:[],notes:"",notes_history:[]},row||{});
    if(!Array.isArray(DF.set.notes_history)) DF.set.notes_history=[];
    DF.saved={}; (DF.missing?[]:vals.data||[]).forEach(v=>{ DF.saved[v.year+"-"+v.month]=Number(v.amount); });
    // Rascunho deste navegador: é o armazenamento de quem não grava no banco, e cobre alterações que não chegaram ao banco (ex.: página fechada antes de salvar)
    const dr=dfLS.get(dfDraftKey()), useDr=dr&&(!dfDB()||(dr.pending&&(!row||!row.updated_at||dr.ts>Date.parse(row.updated_at))));
    if(useDr){ DF_FIELDS.forEach(k=>{ if(k in (dr.set||{})) DF.set[k]=dr.set[k]; }); Object.assign(DF.saved,dr.vals||{}); }
    else if(dr&&DF.notesMissing&&dr.set){ DF.set.notes=dr.set.notes||""; DF.set.notes_history=Array.isArray(dr.set.notes_history)?dr.set.notes_history:[]; }
    if(!row&&!(useDr&&dr.set&&dr.set.revenue_category_ids)) DF.set.revenue_category_ids=DF.cats.filter(c=>/receita|faturamento/i.test(c.name)).map(c=>c.id);
    DF.rows=ms.map(x=>({...x,auto:null,cur:null}));
    dfAuto(true);
    if(useDr&&dfDB()&&dr.pending){ DF.dirty=true; setTimeout(()=>dfSave(),50); }
    drawDecl(co);
  }catch(e){ $("df_body").textContent="Erro ao carregar: "+(e.message||e); }
}
/* Soma, por mês, o saldo final dos itens do Acompanhamento mensal nas categorias marcadas como receita. */
function dfAuto(init){
  const sel=new Set(DF.set.revenue_category_ids||[]);
  DF.rows.forEach(r=>{
    const rs=DF.recs.filter(x=>x.monthly_periods.year===r.y&&x.monthly_periods.month===r.m&&sel.has(x.monitored_accounts.category_id)&&x.status!=="nao_aplicavel"&&x.final_balance!=null);
    r.auto=rs.length?rs.reduce((s,x)=>s+cents(x.final_balance),0)/100:null;
    if(init){ const k=r.y+"-"+r.m; r.cur=k in DF.saved?DF.saved[k]:r.auto; }
  });
}

async function dfLogoAdd(files){
  if(!files.length) return; dfReadForm(); let last=null;
  for(const file of files){
    if(!/^image\/(png|jpeg)$/.test(file.type)){ toast(`"${file.name}": use PNG ou JPEG.`); continue; }
    if(file.size>8e6){ toast(`"${file.name}" é muito grande (máximo 8 MB).`); continue; }
    let bmp; try{ bmp=await createImageBitmap(file); }catch(e){ toast(`Não foi possível ler "${file.name}".`); continue; }
    const k=Math.min(1,900/bmp.width,300/bmp.height), c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    let url=c.toDataURL("image/png"); if(url.length>550000) url=c.toDataURL("image/jpeg",.9);
    if(url.length>550000){ toast(`"${file.name}" continua grande demais. Use uma imagem menor.`); continue; }
    const name=file.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim().slice(0,120)||"Logotipo";
    const {data,error}=await sb.from("billing_logos").insert({name,data:url}).select("id,name,data").single();

async function dfSave(){
  if(DF.saving){ await DF.saving; if(!DF.dirty) return; }
  clearTimeout(DF.timer);
  const run=(async()=>{
    const err=dfCheck(false); if(err){ dfStatus("Não salvo: "+err,true); return; }
    const S=DF.set, cid=DF.cid, hh=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    DF.dirty=false;
    if(!dfDB()){ dfDraftWrite(false); dfStatus("Guardado neste navegador às "+hh()+"."); return; }
    dfDraftWrite(true);
    try{
      const base={company_id:cid,accountant_name:S.accountant_name||null,accountant_role:S.accountant_role||"Contador",accountant_crc:S.accountant_crc||null,
        rep_name:S.rep_name||null,rep_role:S.rep_role||"Presidente",rep_cpf:S.rep_cpf||null,place:S.place||"Campina Grande/PB",revenue_category_ids:S.revenue_category_ids,...(DF.logosMissing?{}:{logo_id:S.logo_id||null})};
      let {error:e1}=await sb.from("billing_settings").upsert(DF.notesMissing?base:{...base,notes:S.notes||null,notes_history:S.notes_history||[]});
      if(e1&&/notes/.test(e1.message)){ DF.notesMissing=true; ({error:e1}=await sb.from("billing_settings").upsert(base)); }
      if(e1) throw e1;
      const up=[], del=[];
      DF.rows.forEach(r=>{ const k=r.y+"-"+r.m, manual=r.cur!=null&&(r.auto==null||cents(r.cur)!==cents(r.auto));
        if(manual) up.push({company_id:cid,year:r.y,month:r.m,amount:r.cur}); else if(k in DF.saved) del.push(r); });
      if(up.length){ const {error}=await sb.from("billing_month_values").upsert(up); if(error) throw error; }
      for(const r of del){ const {error}=await sb.from("billing_month_values").delete().eq("company_id",cid).eq("year",r.y).eq("month",r.m); if(error) throw error; delete DF.saved[r.y+"-"+r.m]; }
      up.forEach(u=>{ DF.saved[u.year+"-"+u.month]=u.amount; });
      if(DF.notesMissing) dfDraftWrite(false); else if(!DF.dirty) dfLS.del("df_draft_"+cid);
      if(cid===DF.cid) dfStatus("Salvo automaticamente às "+hh()+".");
    }catch(e){ DF.dirty=true; dfStatus("Não foi possível salvar agora ("+(e.message||e)+"). Suas alterações estão guardadas neste navegador e serão enviadas na próxima alteração.",true); }
  })();
  DF.saving=run; try{ await run; }finally{ if(DF.saving===run) DF.saving=null; }
}

const imgSize=(src)=>new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight}); i.onerror=()=>rej(new Error("logotipo inválido")); i.src=src; });

/* Monta o PDF no modelo oficial (A4, 1 página). */
async function buildDeclPdf(d){
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"}), S=d.set, L=25.5, R=184.5, W=R-L;
  doc.setTextColor(0,0,0); doc.setDrawColor(0,0,0);
  // Logotipo centralizado
  let y=24;
  const LG=d.logo; if(LG){ try{ const sz=await imgSize(LG), k=Math.min(92/sz.w,30/sz.h), w=sz.w*k, h=sz.h*k;
    doc.addImage(LG,/^data:image\/png/.test(LG)?"PNG":"JPEG",105-w/2,y+(30-h)/2,w,h); }catch(e){} }
  // Parágrafo justificado com a razão social em negrito e recuo na primeira linha
  const fs=12, lh=5.55; doc.setFontSize(fs);
  const words=[]; const add=(t,bold)=>t.split(/\s+/).filter(Boolean).forEach(w=>words.push({w,bold}));
  add("A",false); add(d.legal,true);
  add(`, inscrita no CNPJ sob o número ${d.cnpj}, situada na ${d.address||"(endereço não cadastrado)"}, obteve um faturamento nos últimos doze meses, no montante de:`,false);
  for(let i=1;i<words.length;i++) if(/^[,.;:]/.test(words[i].w)&&!words[i].bold){ words[i-1].tail=(words[i-1].tail||"")+words[i].w; words[i].drop=true; }
  const toks=words.filter(t=>!t.drop);
  const wid=(t)=>{ doc.setFont("helvetica",t.bold?"bold":"normal"); let x=doc.getTextWidth(t.w); if(t.tail){ doc.setFont("helvetica","normal"); x+=doc.getTextWidth(t.tail); } return x; };
  doc.setFont("helvetica","normal"); const sp=doc.getTextWidth(" "), indent=25;
  const lines=[]; let cur=[], cw=0, avail=W-indent;
  toks.forEach(t=>{ const w=wid(t); if(cur.length&&cw+sp+w>avail){ lines.push({t:cur,w:cw,avail}); cur=[]; cw=0; avail=W; } cw+=(cur.length?sp:0)+w; cur.push(t); });
  if(cur.length) lines.push({t:cur,w:cw,avail,last:true});
  y=72;
  lines.forEach((ln,li)=>{ let x=L+(li===0?indent:0); const gap=ln.last||ln.t.length<2?sp:sp+(ln.avail-ln.w)/(ln.t.length-1);
    ln.t.forEach(t=>{ doc.setFont("helvetica",t.bold?"bold":"normal"); doc.text(t.w,x,y); let x2=x+doc.getTextWidth(t.w);
      if(t.tail){ doc.setFont("helvetica","normal"); doc.text(t.tail,x2,y); x2+=doc.getTextWidth(t.tail); } x=x2+gap; }); y+=lh; });
  // Tabela centralizada
  const tx=59.5, cw1=46.5, cw2=48.5, rh=6.05; let ty=Math.max(105,y+12);
  const cell=(x,yy,w,txt,bold,thick)=>{ doc.setLineWidth(thick?0.5:0.25); doc.rect(x,yy,w,rh); doc.setFont("helvetica",bold?"bold":"normal"); doc.text(txt,x+w/2,yy+rh/2+1.35,{align:"center"}); };
  doc.setFontSize(11);
  cell(tx,ty,cw1,"MÊS",true); cell(tx+cw1,ty,cw2,"RECEITA",true);
  doc.setLineWidth(0.25); [["MÊS",tx,cw1],["RECEITA",tx+cw1,cw2]].forEach(([t,x,w])=>{ const tw=doc.getTextWidth(t); doc.line(x+w/2-tw/2,ty+rh/2+1.9,x+w/2+tw/2,ty+rh/2+1.9); });
  ty+=rh; let tot=0;
  d.rows.forEach(r=>{ tot+=cents(r.value); cell(tx,ty,cw1,r.label,false); cell(tx+cw1,ty,cw2,brlPdf(r.value),false); ty+=rh; });
  doc.setFontSize(11.5); cell(tx,ty,cw1,"TOTAL",true,true); cell(tx+cw1,ty,cw2,brlPdf(tot/100),true,true); ty+=rh;
  // Data e local
  const dt=d.date; doc.setFont("helvetica","normal"); doc.setFontSize(12);
  doc.text(`${S.place||"Campina Grande/PB"}, ${dt.getDate()} de ${MES_CAP(dt.getMonth())} de ${dt.getFullYear()}.`,L,Math.max(225,ty+20));
  // Assinaturas lado a lado
  const sy=258, sig=(cx,lines)=>{ doc.setLineWidth(0.25); doc.line(cx-30,sy,cx+30,sy); doc.setFontSize(11);
    lines.forEach((t,i)=>{ doc.setFont("helvetica","normal"); doc.text(doc.splitTextToSize(t,70)[0]||"",cx,sy+7+i*5,{align:"center"}); }); };
  sig(62,[S.accountant_name||"",S.accountant_role||"Contador",S.accountant_crc?(/^crc/i.test(S.accountant_crc)?S.accountant_crc:"CRC: "+S.accountant_crc):""]);
  sig(152,[S.rep_name||"",S.rep_role||"",S.rep_cpf?"CPF: "+fmtCpf(S.rep_cpf):""]);
  return doc;
}

function ffGroup(rows,kind){

function ffDraftCell(col){

function ffTiles(mods){

function drawFF(){

function ffSummary(){

async function onFFChange(e){
  const el=e.target.closest("[data-f]"), tr=e.target.closest("tr[data-id]"); if(!el||!tr) return;

async function onFFClick(e){
  const go=e.target.closest("[data-go]"); if(go){ $("ffm-"+go.dataset.go)?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const b=e.target.closest("button[data-a]"); if(!b) return; const a=b.dataset.a, tr=b.closest("tr");
  if(a==="cancel"){ document.querySelector(".draft")?.remove(); return; }
  if(a==="add"){
    document.querySelector(".draft")?.remove(); const i=b.dataset.m;
    $("ffb-"+i).insertAdjacentHTML("beforeend",`<tr class="draft" data-m="${i}">${FF_COLS[FF.kind].map(ffDraftCell).join("")}<td class="nw"><button class="lnk" data-a="save">Salvar</button> <button class="lnk" data-a="cancel">Cancelar</button></td></tr>`);
    $("dr_desc").focus(); return;
  }
  if(a==="save") return saveFF();
  const r=tr&&FF.rows.find(x=>x.id===tr.dataset.id); if(!r) return;
  if(a==="edit"){ tr.outerHTML=rowFF(r,"",true); document.querySelector('tr[data-id="'+r.id+'"] [data-e="description"]')?.focus(); return; }
  if(a==="ecancel"){ tr.outerHTML=rowFF(r,"",false); return; }

    const g=(k)=>tr.querySelector(`[data-e="${k}"]`), ac=r.monitored_accounts, d=g("description").value.trim(), c=g("code").value.trim(), num=g("number")?g("number").value.trim():(ac.account_number||"");

    if(error){ toast(error.message); return; }
    ac.description=d; ac.accounting_code=c||null; ac.account_number=num||null; tr.outerHTML=rowFF(r,"",false); toast("Salvo."); return;
  }
  if(a==="del"){
    if(!confirm(`Remover "${r.monitored_accounts.description}"? Ele deixa de entrar nos próximos meses.`)) return;
    const {data,error}=await sb.rpc("remove_ff_item",{p_record:r.id});
    if(error){ toast("Não foi possível remover: "+error.message); return; }
    toast(data==="removed"?"Item removido.":"O item já tem dados: continua neste mês, mas não entra nos próximos."); renderFF(FF.kind);
  }
}
async function saveFF(){
  const dr=document.querySelector(".draft"); if(!dr) return;

function uiCur(){ const r=document.documentElement; return {layout:r.dataset.layout==="2"?"2":"1",theme:r.dataset.theme==="dark"?"dark":"light"}; }
function uiBoot(p){
  const prefs=p&&p.ui_prefs; if(prefs&&typeof prefs==="object"){
    const r=document.documentElement; r.dataset.layout=prefs.layout==="2"?"2":"1"; r.dataset.theme=prefs.theme==="dark"?"dark":"light";

function uiMark(){

  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===c.theme)));

async function avatarPick(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("Escolha um arquivo de imagem."); return; }
  if(file.size>10e6){ toast("A imagem é muito grande (máximo 10 MB)."); return; }
  let bmp; try{ bmp=await createImageBitmap(file,{imageOrientation:"from-image"}); }catch(e){ toast("Não foi possível ler essa imagem."); return; }
  const c=document.createElement("canvas"); c.width=c.height=256; const x=c.getContext("2d"), s=Math.min(bmp.width,bmp.height);
  x.fillStyle="#fff"; x.fillRect(0,0,256,256); x.drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,256,256);
  let q=.85, url=c.toDataURL("image/jpeg",q); while(url.length>150000&&q>.4){ q-=.1; url=c.toDataURL("image/jpeg",q); }
  await avatarSave(url);
}

const GCAL_SCOPE="https://www.googleapis.com/auth/calendar.readonly";
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const ymd=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
let CAL={y:0,m:0,sel:"",events:[],upcoming:[],token:null,exp:0,status:"off",msg:"",tc:null};
function calInit(){
  const n=new Date(); CAL.y=n.getFullYear(); CAL.m=n.getMonth(); CAL.sel=ymd(n);
  const nm=($("whoName").textContent||"").trim(); setAvatar();
  try{ if(localStorage.getItem("agenda_hidden")==="1") document.body.classList.add("noright"); }catch(e){}
  calRender();
}
function gcalForget(){ CAL.token=null; CAL.events=[]; CAL.upcoming=[]; CAL.status="off"; CAL.msg=""; }
function evDays(ev){
  const out=[];
  if(ev.start&&ev.start.date){ const s=new Date(ev.start.date+"T00:00:00"), e=new Date((ev.end&&ev.end.date||ev.start.date)+"T00:00:00");
    for(let d=new Date(s);d<e&&out.length<62;d.setDate(d.getDate()+1)) out.push(ymd(d)); if(!out.length) out.push(ev.start.date); }
  else if(ev.start&&ev.start.dateTime) out.push(ymd(new Date(ev.start.dateTime)));
  return out;
}
function calDayMap(){ const m=new Map(); CAL.events.forEach(ev=>evDays(ev).forEach(d=>{ if(!m.has(d)) m.set(d,[]); m.get(d).push(ev); })); return m; }
function evTime(ev){
  if(ev.start&&ev.start.dateTime){ const t=(s)=>new Date(s).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); return t(ev.start.dateTime)+(ev.end&&ev.end.dateTime?" às "+t(ev.end.dateTime):""); }
  return "Dia inteiro";
}
function evCard(ev,withDate){
  const d=evDays(ev)[0], dl=d?d.split("-").reverse().slice(0,2).join("/"):"";
  return `<div class="ev"><b>${esc(ev.summary||"(sem título)")}</b><small>${withDate?esc(dl)+" · ":""}${esc(evTime(ev))}${ev.location?" · "+esc(ev.location):""}</small>${ev.htmlLink&&/^https:\/\//.test(ev.htmlLink)?` <a href="${esc(ev.htmlLink)}" target="_blank" rel="noopener">Abrir no Google Agenda</a>`:""}</div>`;
}
function calRender(){
  const first=new Date(CAL.y,CAL.m,1), lead=first.getDay(), dim=new Date(CAL.y,CAL.m+1,0).getDate(), map=calDayMap(), today=ymd(new Date());
  $("calTitle").textContent=`${MESES[CAL.m]} de ${CAL.y}`;
  let h=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<Math.ceil((lead+dim)/7)*7;i++){
    const d=new Date(CAL.y,CAL.m,1-lead+i), k=ymd(d), has=map.has(k);
    h+=`<button type="button" class="cd${d.getMonth()!==CAL.m?" o":""}${k===today?" t":""}${k===CAL.sel?" s":""}" data-d="${k}" aria-label="${d.toLocaleDateString("pt-BR",{day:"numeric",month:"long"})}${has?", com compromissos":""}">${d.getDate()}${has?"<i></i>":""}</button>`;
  }
  $("calGrid").innerHTML=h;
  const dayEv=map.get(CAL.sel)||[], ok=CAL.status==="ok";
  $("calList").innerHTML=`<h4>${new Date(CAL.sel+"T00:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</h4>`+
    (ok?(dayEv.length?dayEv.map(e=>evCard(e,false)).join(""):'<span class="mut">Nenhum compromisso neste dia.</span>'):'<span class="mut">Conecte o Google Agenda para ver seus compromissos.</span>')+
    (ok?`<h4>Próximos compromissos</h4>`+(CAL.upcoming.length?CAL.upcoming.map(e=>evCard(e,true)).join(""):'<span class="mut">Nada nos próximos dias.</span>'):"");
  calStat();
}
function calStat(){
  const s=CAL.status; let h="";
  if(s==="ok") h='<span class="gok">● Google Agenda conectado</span> <button class="lnk" id="grefresh">Atualizar</button> <button class="lnk" id="gdisc">Desconectar</button>';
  else if(s==="loading") h='<span class="mut">Carregando a agenda…</span>';
  else h=`<button class="btn sm" id="gconn">${s==="err"?"Reconectar":"Conectar Google Agenda"}</button>`;
  if(CAL.msg==="config") h+='<p class="gmsg">Para ligar o Google Agenda, configure o ID de cliente do Google (<b>GOOGLE_CLIENT_ID</b>) no início do index.html. O passo a passo está no README.</p>';
  else if(CAL.msg) h+=`<p class="gmsg">${esc(CAL.msg)}</p>`;
  $("gstat").innerHTML=h;
}
async function gcalLoad(){
  if(!CAL.token||Date.now()>CAL.exp){ CAL.token=null; CAL.status="err"; CAL.msg="A sessão do Google expirou. Clique em Reconectar."; calRender(); return; }
  CAL.status="loading"; calStat();
  try{
    const a=new Date(CAL.y,CAL.m,1-new Date(CAL.y,CAL.m,1).getDay()), b=new Date(CAL.y,CAL.m+1,0); b.setDate(b.getDate()+8);
    const url=(o)=>"https://www.googleapis.com/calendar/v3/calendars/primary/events?"+new URLSearchParams({singleEvents:"true",orderBy:"startTime",maxResults:"250",...o});
    const get=async(u)=>{ const r=await fetch(u,{headers:{Authorization:"Bearer "+CAL.token}}); if(r.status===401){ const e=new Error("expired"); e.code=401; throw e; }
      const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||("Erro "+r.status)); return j.items||[]; };
    const [month,up]=await Promise.all([get(url({timeMin:a.toISOString(),timeMax:b.toISOString()})),get(url({timeMin:new Date().toISOString(),maxResults:"6"}))]);
    CAL.events=month; CAL.upcoming=up; CAL.status="ok"; CAL.msg="";
  }catch(e){ if(e.code===401) CAL.token=null; CAL.status="err"; CAL.msg=e.code===401?"A sessão do Google expirou. Clique em Reconectar.":"Não foi possível ler a agenda: "+(e.message||e); }
  calRender();
}
async function gcalConnect(){
  if(GOOGLE_CLIENT_ID.startsWith("COLE")){ CAL.msg="config"; calStat(); return; }
  try{ await loadScript("https://accounts.google.com/gsi/client"); }catch(e){ CAL.status="err"; CAL.msg="Não foi possível carregar o login do Google (conexão ou bloqueador de anúncios)."; calStat(); return; }
  if(!CAL.tc) CAL.tc=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:GCAL_SCOPE,
    callback:(r)=>{ if(r.error){ CAL.status="err"; CAL.msg="Acesso não autorizado: "+(r.error_description||r.error); calStat(); return; }
      CAL.token=r.access_token; CAL.exp=Date.now()+(Number(r.expires_in)||3600)*1000-30000; gcalLoad(); },
    error_callback:(e)=>{ CAL.status="err"; CAL.msg=e&&e.type==="popup_closed"?"A janela do Google foi fechada antes de concluir.":"Falha no login do Google ("+((e&&e.type)||"erro")+")."; calStat(); }});
  CAL.tc.requestAccessToken({prompt:""});
}
function calMonth(d){ CAL.m+=d; if(CAL.m<0){ CAL.m=11; CAL.y--; } if(CAL.m>11){ CAL.m=0; CAL.y++; } CAL.sel=ymd(new Date(CAL.y,CAL.m,1)); if(CAL.token&&CAL.status==="ok") gcalLoad(); else calRender(); }
$("right").addEventListener("click",(e)=>{
  const t=e.target, day=t.closest(".cd"); if(day){ CAL.sel=day.dataset.d; const d=new Date(CAL.sel+"T00:00:00");
    if(d.getMonth()!==CAL.m){ CAL.y=d.getFullYear(); CAL.m=d.getMonth(); if(CAL.token&&CAL.status==="ok") return gcalLoad(); } calRender(); return; }
  if(t.id==="calPrev") return calMonth(-1); if(t.id==="calNext") return calMonth(1);
  if(t.id==="calToday"){ const n=new Date(); CAL.y=n.getFullYear(); CAL.m=n.getMonth(); CAL.sel=ymd(n); if(CAL.token&&CAL.status==="ok") gcalLoad(); else calRender(); return; }
  if(t.id==="gconn") return gcalConnect(); if(t.id==="grefresh") return gcalLoad();
  if(t.id==="gdisc"){ const tk=CAL.token; try{ if(tk&&window.google) google.accounts.oauth2.revoke(tk,()=>{}); }catch(e){} gcalForget(); calRender(); }
});
function agendaToggle(){
  if(window.innerWidth>=1200){ const hide=document.body.classList.toggle("noright"); try{ localStorage.setItem("agenda_hidden",hide?"1":"0"); }catch(e){} }
  else document.body.classList.toggle("agenda-open");
}
["agendaToggle","agendaClose","agendaOpen"].forEach(id=>$(id).addEventListener("click",agendaToggle));

/* ============ ORDENAÇÃO RÁPIDA EM TODAS AS TABELAS ============ */
const gcol=new Intl.Collator("pt-BR",{numeric:true,sensitivity:"base"});
function gsNum(v){
  let s=String(v).trim().replace(/R\$|\s|%/g,""), neg=false;
  if(/^-+$/.test(s)) return 0;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); } if(s.startsWith("-")){ neg=!neg; s=s.slice(1); }
  let n=null;
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) n=Number(s.replace(/\./g,"").replace(",","."));
  else if(/^\d+(,\d+)?$/.test(s)) n=Number(s.replace(",","."));
  else if(/^\d+\.\d+$/.test(s)) n=Number(s);
  return n===null||!isFinite(n)?null:(neg?-n:n);
}
function gsDate(v){
  let m=String(v).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})(?:[ ,]+(\d{2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m) return Date.UTC(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=String(v).trim().match(/^(\d{2})\/(\d{4})$/); return m?Date.UTC(+m[2],+m[1]-1,1):null;
}
const gsEmpty=(v)=>!v||v==="—"||v==="-";
function gsVal(cell){
  if(!cell) return "";
  const f=cell.querySelector("input:not([type=checkbox]):not([type=radio]),select,textarea");
  if(f) return f.tagName==="SELECT"?(f.selectedOptions[0]?f.selectedOptions[0].text:""):f.value;
  return cell.textContent;
}
function gsEnhance(){
  document.querySelectorAll("#view table:not([data-gs])").forEach(t=>{
    t.dataset.gs="1"; const head=t.tHead&&t.tHead.rows[t.tHead.rows.length-1]; if(!head||!t.tBodies[0]) return;
    [...head.cells].forEach(th=>{ const txt=th.textContent.trim();
      if(!txt||th.dataset.sort||th.colSpan>1||/^a[çc][õo]es$/i.test(txt)) return;
      th.classList.add("gs"); th.tabIndex=0; th.setAttribute("aria-sort","none"); th.title="Clique para ordenar"; });
  });
}
function gsSort(th){
  const table=th.closest("table"), idx=th.cellIndex, body=table.tBodies[0]; if(!body) return;
  const dir=th.getAttribute("aria-sort")==="ascending"?-1:1;
  const groups=[]; let cur={head:null,rows:[]}; groups.push(cur);
  [...body.rows].forEach(tr=>{ if(tr.classList.contains("catrow")){ cur={head:tr,rows:[]}; groups.push(cur); } else if(!tr.classList.contains("draft")) cur.rows.push(tr); });
  const vals=groups.flatMap(g=>g.rows).map(tr=>gsVal(tr.cells[idx]).trim()).filter(v=>!gsEmpty(v));
  const isNum=vals.length>0&&vals.every(v=>gsNum(v)!==null), isDate=!isNum&&vals.length>0&&vals.every(v=>gsDate(v)!==null);
  const key=(tr)=>{ const v=gsVal(tr.cells[idx]).trim(); return gsEmpty(v)?null:isNum?gsNum(v):isDate?gsDate(v):v; };
  groups.forEach(g=>{ const k=g.rows.map(tr=>({tr,k:key(tr)}));
    k.sort((a,b)=>{ if(a.k===null||b.k===null) return a.k===b.k?0:(a.k===null?1:-1); return dir*((isNum||isDate)?a.k-b.k:gcol.compare(a.k,b.k)); });
    g.rows=k.map(x=>x.tr); });
  const drafts=[...body.querySelectorAll("tr.draft")];
  groups.forEach(g=>{ if(g.head) body.appendChild(g.head); g.rows.forEach(tr=>body.appendChild(tr)); }); drafts.forEach(tr=>body.appendChild(tr));
  table.querySelectorAll("th.gs").forEach(h=>h.setAttribute("aria-sort",h===th?(dir===1?"ascending":"descending"):"none"));
  th.title=((isNum||isDate)?(dir===1?"Crescente":"Decrescente"):(dir===1?"A–Z":"Z–A"))+" (clique para inverter)";
}
$("view").addEventListener("click",(e)=>{ const th=e.target.closest("th.gs"); if(th) gsSort(th); });
$("view").addEventListener("keydown",(e)=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("th.gs")){ e.preventDefault(); gsSort(e.target); } });
let gsRaf=0; new MutationObserver(()=>{ if(gsRaf) return; gsRaf=requestAnimationFrame(()=>{ gsRaf=0; gsEnhance(); }); }).observe($("view"),{childList:true,subtree:true});

init();
</script>
