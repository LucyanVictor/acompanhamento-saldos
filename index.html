<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")==="dark"?"dark":"light";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento contabilidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#14284b;--blue:#2f5f9e;--blue-l:#e6eef8;--bg:#f2f4f7;--card:#fff;--line:#d9dee6;--tx:#1d2733;--mut:#6a7686;
--ok:#1f8a4c;--err:#c43232;--warn:#d98a12}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;width:100%;max-width:360px;overflow:hidden}
.box h1{margin:0;padding:18px 20px;background:#14284b;color:#fff;font-size:16px;font-weight:600}
.box form{padding:20px;display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:500}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--tx)}
.btn{padding:9px 14px;border:0;border-radius:4px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);font-weight:500}
.msg{color:var(--err);min-height:1.2em;font-size:13px}
/* app */
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:52px 1fr;height:100%}
header{grid-column:1/3;background:#14284b;color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px}
header strong{font-size:15px;font-weight:600;margin-right:auto}
header select,header input{background:#1d3a6b;color:#fff;border-color:#3a5a92;padding:5px 8px}
.who{font-size:13px;text-align:right;line-height:1.2}.who small{opacity:.7}
nav{background:var(--card);border-right:1px solid var(--line);padding:8px 0;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--tx);text-decoration:none;border-left:3px solid transparent}
nav a svg{width:17px;height:17px;stroke:var(--blue);fill:none;stroke-width:1.8;flex:none}
nav a:hover{background:var(--bg)}
nav a[aria-current=page]{background:var(--blue-l);border-left-color:var(--blue);font-weight:600}
main{padding:20px;overflow:auto}
main h2{margin:0 0 14px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;max-width:760px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--blue)}
table{border-collapse:collapse;width:100%}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.tag.ok{background:#dff3e6;color:var(--ok)}.tag.err{background:#f9e0e0;color:var(--err)}.tag.warn{background:#fcefd5;color:#9a5f00}
#toast{position:fixed;right:16px;bottom:16px;background:#14284b;color:#fff;padding:10px 14px;border-radius:4px;max-width:320px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input[type=search]{flex:1;min-width:220px}
.card.tbl{max-width:none;overflow-x:auto}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;padding:2px 6px;font-weight:500}.lnk:hover{text-decoration:underline}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
dialog{border:1px solid var(--line);border-radius:6px;padding:0;width:min(480px,94vw)}
dialog::backdrop{background:rgba(20,40,75,.45)}
dialog form{padding:18px;display:grid;gap:12px}dialog h3{margin:0;color:var(--navy);font-size:16px}
textarea{padding:8px 10px;border:1px solid var(--line);border-radius:4px;font:inherit;resize:vertical;background:var(--card);color:var(--tx)}
.row{display:flex;justify-content:flex-end;gap:8px}
.tag.mut{background:#e8ebef;color:#5b6674}
.pills{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;color:var(--mut);font-size:13px}.pills b{color:var(--tx)}
table.mt{min-width:900px}.mt th.r,.mt td.r{text-align:right}.mt thead th{position:sticky;top:0;background:var(--card)}
.mt input,.mt select{width:100%;padding:5px 6px}.mt input.num{text-align:right;min-width:120px}
.catrow td{background:var(--blue-l);font-weight:600;color:var(--navy)}.ct{font-weight:400;color:var(--mut);margin-left:8px}
.s-ok{border-left:4px solid var(--ok)}.s-err{border-left:4px solid var(--err)}.s-warn{border-left:4px solid var(--warn)}.s-mut{border-left:4px solid #9aa4b1}
.big{font-size:24px;font-weight:600;color:var(--navy)}.warnp{color:#9a5f00;margin:6px 0 0}
.card.wide{max-width:none}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:6px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.kpi:hover{background:var(--blue-l)}.kpi b{font-size:22px;color:var(--navy)}.kpi small{color:var(--mut)}
.kpi.k-ok{border-top-color:var(--ok)}.kpi.k-err{border-top-color:var(--err)}.kpi.k-warn{border-top-color:var(--warn)}
.hb{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;margin:6px 0}.hb>div{background:#e9edf2;height:12px;border-radius:6px;overflow:hidden}
.hb i{display:block;height:100%;border-left:0}.hb i.s-ok{background:var(--ok)}.hb i.s-err{background:var(--err)}.hb i.s-warn{background:var(--warn)}.hb i.s-mut{background:#9aa4b1}.hb b{text-align:right}
.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.donut::before{content:"";position:absolute;inset:14px;background:var(--card);border-radius:50%}.donut span{position:relative;font-weight:600;font-size:20px;color:var(--navy)}
.mt th[data-sort]{cursor:pointer;user-select:none}.mt th[data-sort]:hover{background:var(--blue-l)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;min-width:150px;text-align:left}
.tile svg{width:24px;height:24px;stroke:var(--blue);fill:none;stroke-width:1.8;flex:none}.tile b{font-size:20px;color:var(--navy);display:block;line-height:1.1}.tile small{color:var(--mut)}
.tile:hover{background:var(--bg)}.tile[aria-pressed=true]{background:var(--blue-l);border-color:var(--blue)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 12px;font-size:13px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pos-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center}
.pos-card svg{width:56px;height:56px;fill:none;stroke-width:1.5}.pos-card .pv{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pos-card b{font-size:14px;color:var(--navy)}.pos-card small{color:var(--mut)}.pos-card:hover{background:var(--bg)}.pos-card.off{opacity:.55}
.btn.sm{padding:5px 12px;font-size:12px}.foot{display:flex;justify-content:flex-end;margin:18px 0 6px}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:14px}.dmod{grid-column:span var(--span,6);min-width:0}.dmod .card{margin-bottom:0;max-width:none;height:100%}.dmod .kpis{margin-bottom:0}
.dmod.edit{outline:2px dashed var(--blue);outline-offset:3px;border-radius:6px;cursor:grab}.dmod.edit .kpi{cursor:default}
.dctl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--navy);font-size:13px}.dctl .lnk{padding:2px 6px}
.dhint{margin:0 0 10px;color:var(--mut);font-size:13px}
@media(max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  header{grid-column:1;flex-wrap:wrap;padding:8px 12px}
  nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0}
  nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  nav a[aria-current=page]{border-bottom-color:var(--blue)}
}

:root[data-theme="dark"]{--bg:#0f1622;--card:#182233;--line:#2b3a52;--tx:#e6ebf2;--mut:#9aa8bd;--blue-l:#1f3556;--blue:#5b8fd6;--navy:#a9c4ee;--ok:#3fb36f;--err:#e06565;--warn:#e9a53a;color-scheme:dark}
:root[data-theme="dark"] .tag.ok{background:#173a28;color:#6fd69a}:root[data-theme="dark"] .tag.err{background:#4a2020;color:#f08a8a}
:root[data-theme="dark"] .tag.warn{background:#4a3612;color:#f0c26a}:root[data-theme="dark"] .tag.mut{background:#2b3444;color:#aab4c4}
:root[data-theme="dark"] .hb>div{background:#2b3a52}:root[data-theme="dark"] .warnp{color:#f0c26a}
:root[data-theme="dark"] .btn{color:#fff}:root[data-theme="dark"] .btn.sec{color:var(--tx)}
.themebtn{display:inline-flex;align-items:center;gap:8px}.themebtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}.themebtn[aria-pressed=true]{background:var(--blue-l);border-color:var(--blue)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}.mh h2{margin:0}.mh-nav{display:flex;gap:8px;flex-wrap:wrap}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.mstat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:2px;align-content:start}.mstat b{font-size:20px;color:var(--navy);font-weight:600}.mstat small{color:var(--mut)}
.mstat.grow{grid-column:span 2}.mstat.grow input{width:100%}
.nw{white-space:nowrap}.dctl select{padding:3px 6px;font-size:12px}
.sqtile{background:var(--card);border:1px solid var(--line);border-radius:8px;width:128px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.sqtile svg{width:34px;height:34px;stroke:var(--blue);fill:none;stroke-width:1.7}.sqtile b{font-size:24px;color:var(--navy);line-height:1.1}.sqtile small{color:var(--mut)}.sqtile:hover{background:var(--blue-l)}
@media(max-width:900px){.dmod{grid-column:1/-1}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="box">
    <h1>Acompanhamento contabilidade</h1>
    <form id="loginForm">
      <label>E-mail<input type="email" id="email" autocomplete="username" required></label>
      <label>Senha<input type="password" id="pass" autocomplete="current-password" required></label>
      <div class="msg" id="loginMsg" role="alert"></div>
      <button class="btn" id="loginBtn">Entrar</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <strong>Acompanhamento contabilidade</strong>
    <label style="display:flex;align-items:center;gap:6px;font-weight:400">Empresa
      <select id="companySel"><option value="">Nenhuma</option></select></label>
    <label style="display:flex;align-items:center;gap:6px;font-weight:400">Competência
      <input type="month" id="period"></label>
    <div class="who"><div id="whoName"></div><small id="whoRole"></small></div>
    <button class="btn ghost" id="logout">Sair</button>
  </header>
  <nav id="nav" aria-label="Menu principal"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<div id="toast" class="hidden" role="status"></div>

<script>
/* ============ CONFIGURAÇÃO ============
   Cole aqui a URL e a chave "anon/public" do seu projeto Supabase
   (Project Settings > API). A chave anon é pública por desenho;
   quem protege os dados são as políticas RLS do banco.
   NUNCA coloque a chave service_role neste arquivo. */
const SUPABASE_URL = "https://akmmyeqbqxhxduyvvevo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_qp1K2n87El7VtzqaJf-8_w_R0C1xlPl";

/* ============ UTILITÁRIOS ============ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = (v) => v === null || v === undefined || v === "" ? "—" :
  Number(v).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const ROLES = {admin:"Administrador", supervisor:"Contador / supervisor", operator:"Operador"};
let toastT;
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.remove("hidden"); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.add("hidden"),4000); }

function cnpjValido(c){ // mesma regra do banco (usada nos formulários da Etapa 2)
  const d=String(c||"").replace(/\D/g,""); if(d.length!==14||/^(\d)\1+$/.test(d)) return false;
  const dv=(n)=>{const w=n===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];
    const s=w.reduce((a,x,i)=>a+x*+d[i],0)%11; return s<2?0:11-s;};
  return dv(12)===+d[12] && dv(13)===+d[13];
}

/* ============ ESTADO ============ */
const configured = !SUPABASE_URL.startsWith("COLE") && !SUPABASE_ANON_KEY.startsWith("COLE");
let sb, state = { profile:null, companies:[], page:"dashboard" };

const ICON = {
  dashboard:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  empresas:'<path d="M4 21V5l8-2v18M12 9h8v12M8 8h1M8 12h1M8 16h1"/>',
  mensal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  contas:'<path d="M3 10l9-6 9 6M5 10v9M10 10v9M14 10v9M19 10v9M3 21h18"/>',
  caixas:'<rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="2.5"/>',
  cartoes:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  maquininhas:'<rect x="6" y="2" width="12" height="20" rx="2"/><rect x="8.5" y="4.5" width="7" height="5" rx="1"/><path d="M9 13h.01M12 13h.01M15 13h.01M9 16h.01M12 16h.01M15 16h.01"/>',
  folha:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
  apropriacao:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  fiscal:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 14l2 2 4-4"/>',
  terceiros:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5a3 3 0 010 6M21 20c0-2.6-1.4-4.6-3.5-5.5"/>',
  relatorios:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/>',
  usuarios:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/>',
  config:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
const PAGES = [
  ["dashboard","Dashboard",4],["empresas","Empresas",2],["mensal","Acompanhamento mensal",2],
  ["contas","Contas e aplicações",2],["cartoes","Cartões",2],["maquininhas","Maquininhas",2],["folha","Folha",2],["fiscal","Fiscal",2],["apropriacao","Apropriação",2],
  ["relatorios","Relatórios",4],["usuarios","Usuários e responsáveis",2],["config","Configurações",1]
];

/* ============ INICIALIZAÇÃO ============ */
async function init(){
  if(!configured){
    $("login").classList.remove("hidden");
    $("loginMsg").textContent="Configure SUPABASE_URL e SUPABASE_ANON_KEY no início do index.html.";
    $("loginBtn").disabled=true; return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data:{ session } } = await sb.auth.getSession();
  session ? await enterApp() : showLogin();
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT") showLogin(); });
}
function showLogin(){ $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }

$("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault(); $("loginMsg").textContent=""; $("loginBtn").disabled=true;
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pass").value });
  $("loginBtn").disabled=false;
  if(error){ $("loginMsg").textContent = error.message.includes("Invalid") ? "E-mail ou senha incorretos." : "Não foi possível entrar: "+error.message; return; }
  $("pass").value=""; await enterApp();
});
$("logout").addEventListener("click", ()=>sb.auth.signOut());

async function enterApp(){
  const { data:{ user } } = await sb.auth.getUser();
  const { data:profile, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut(); $("loginMsg").textContent="Usuário sem perfil ativo. Fale com o administrador."; return;
  }
  state.profile = profile;
  $("whoName").textContent = profile.full_name || profile.email;
  $("whoRole").textContent = ROLES[profile.role];
  const { data:cs } = await sb.from("companies").select("id,legal_name,trade_name,cnpj,active").order("legal_name");
  state.companies = cs || [];
  $("companySel").innerHTML = '<option value="">Todas / nenhuma</option>' +
    state.companies.filter(c=>c.active).map(c=>`<option value="${esc(c.id)}">${esc(c.trade_name||c.legal_name)}</option>`).join("");
  const now = new Date(); $("period").value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  buildNav(); go(location.hash.slice(1) || "dashboard");
}

/* ============ NAVEGAÇÃO ============ */
function buildNav(){
  $("nav").innerHTML = PAGES.map(([id,label])=>
    `<a href="#${id}" data-p="${id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[id]}</svg>${esc(label)}</a>`).join("");
}
window.addEventListener("hashchange", ()=>{ if(state.profile) go(location.hash.slice(1)); });
function go(id){
  if(!PAGES.some(p=>p[0]===id)) id="dashboard";
  state.page=id;
  document.querySelectorAll("#nav a").forEach(a=> a.dataset.p===id ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  const [, label, etapa] = PAGES.find(p=>p[0]===id);
  $("view").innerHTML = `<h2>${esc(label)}</h2>` + ((id==="config"||id==="empresas"||id==="mensal"||id==="folha"||id==="fiscal"||id==="apropriacao"||id==="usuarios"||id==="dashboard"||id==="relatorios"||id==="cartoes"||id==="maquininhas"||PAGE_KIND[id]) ? "" :
    `<div class="card"><p>Este módulo será implementado na <strong>Etapa ${etapa}</strong>. A estrutura do banco que ele usa já existe.</p></div>`);
  if(id==="config") $("view").insertAdjacentHTML("beforeend",themeCard());
  if(id==="config") renderDiagnostico().then(()=>{ if(["admin","supervisor"].includes(state.profile.role)) renderAudit(); });
  if(id==="empresas") renderEmpresas();
  if(PAGE_KIND[id]) renderStruct(PAGE_KIND[id]);
  if(id==="mensal"||id==="folha"||id==="fiscal"||id==="apropriacao") renderMensal();
  if(id==="dashboard") renderDashboard();
  if(id==="relatorios") renderRelatorios();
  if(id==="maquininhas") renderMaquininhas();
  if(id==="usuarios") renderUsuarios();
}

/* ============ DIAGNÓSTICO (Configurações) ============ */
async function renderDiagnostico(){
  const checks = [];
  const ok = (n,v,d="")=>checks.push(`<tr><td>${esc(n)}</td><td><span class="tag ${v?"ok":"err"}">${v?"OK":"Falhou"}</span></td><td>${esc(d)}</td></tr>`);
  ok("Conexão com o Supabase", true, SUPABASE_URL.replace(/^https?:\/\//,""));
  ok("Sessão autenticada", !!state.profile, state.profile.email);
  ok("Perfil de acesso", true, ROLES[state.profile.role]);
  const tabelas = ["companies","account_categories","monitored_accounts","monthly_periods","monthly_account_records","reconciliation_issues"];
  for(const t of tabelas){
    const { count, error } = await sb.from(t).select("*",{count:"exact",head:true});

const fmtCnpj=(v)=>String(v||"").replace(/\D/g,"").slice(0,14).replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2");
let empFilter={q:"",st:"active"}, empEditing=null;

function fillCompanySel(){

    state.companies.filter(c=>c.active).map(c=>`<option value="${esc(c.id)}">${esc(c.trade_name||c.legal_name)}</option>`).join("");

}
async function loadCompanies(){
  const {data,error}=await sb.from("companies").select("*").order("legal_name");

  $("f_cnpj").addEventListener("input",e=>{e.target.value=fmtCnpj(e.target.value);});

  $("eform").addEventListener("submit",saveEmp);

function drawEmp(){
  const q=empFilter.q.trim().toLowerCase(), qd=q.replace(/\D/g,""), adm=state.profile.role==="admin";
  const rows=state.companies.filter(c=>
    (empFilter.st==="all"||(empFilter.st==="active")===c.active) &&
    (!q||[c.legal_name,c.trade_name,c.internal_code].some(x=>(x||"").toLowerCase().includes(q))||(qd&&c.cnpj.includes(qd))));
  if(!rows.length){
    $("elist").innerHTML=state.companies.length?"Nenhuma empresa encontrada com esses filtros."
      :(adm?"Nenhuma empresa cadastrada. Clique em <strong>Nova empresa</strong> para começar.":"Você ainda não foi vinculado a nenhuma empresa. Fale com o administrador.");
    return;
  }
  $("elist").innerHTML=`<table><thead><tr><th>Razão social</th><th>Nome fantasia</th><th>CNPJ</th><th>Código</th><th>Situação</th>${adm?"<th>Ações</th>":""}</tr></thead><tbody>`+
    rows.map(c=>`<tr><td>${esc(c.legal_name)}</td><td>${esc(c.trade_name||"—")}</td><td>${fmtCnpj(c.cnpj)}</td><td>${esc(c.internal_code||"—")}</td>
    <td><span class="tag ${c.active?"ok":"warn"}">${c.active?"Ativa":"Inativa"}</span></td>
    ${adm?`<td><button class="lnk" data-a="edit" data-id="${esc(c.id)}">Editar</button> <button class="lnk" data-a="tog" data-id="${esc(c.id)}">${c.active?"Inativar":"Reativar"}</button></td>`:""}</tr>`).join("")+"</tbody></table>";

function openEmp(c){
  empEditing=c; $("dmsg").textContent="";
  $("dtitle").textContent=c?"Editar empresa":"Nova empresa";
  $("f_legal").value=c?.legal_name||""; $("f_trade").value=c?.trade_name||"";
  $("f_cnpj").value=fmtCnpj(c?.cnpj); $("f_code").value=c?.internal_code||""; $("f_notes").value=c?.notes||"";
  $("dlg").showModal(); $("f_legal").focus();
}

async function saveEmp(e){
  e.preventDefault();
  const legal=$("f_legal").value.trim(), cnpj=$("f_cnpj").value.replace(/\D/g,"");
  if(!legal){ $("dmsg").textContent="Informe a razão social."; return; }
  if(!cnpjValido(cnpj)){ $("dmsg").textContent="CNPJ inválido. Confira os dígitos."; return; }
  const p={legal_name:legal,trade_name:$("f_trade").value.trim()||null,cnpj,internal_code:$("f_code").value.trim()||null,notes:$("f_notes").value.trim()||null};
  $("dsave").disabled=true; $("dsave").textContent="Salvando…";
  const {error}=empEditing ? await sb.from("companies").update(p).eq("id",empEditing.id)
                           : await sb.from("companies").insert({...p,created_by:state.profile.id});
  $("dsave").disabled=false; $("dsave").textContent="Salvar";
  if(error){ $("dmsg").textContent = error.code==="23505" ? "Já existe uma empresa com este CNPJ."
      : error.code==="23514" ? "CNPJ inválido." : "Não foi possível salvar: "+error.message; return; }
  $("dlg").close(); toast(empEditing?"Empresa atualizada.":"Empresa cadastrada.");
  if(await loadCompanies()) drawEmp();
}

async function onEmpClick(e){
  const b=e.target.closest("button[data-a]"); if(!b) return;
  const c=state.companies.find(x=>x.id===b.dataset.id); if(!c) return;
  if(b.dataset.a==="edit") return openEmp(c);
  const msg=c.active?`Inativar "${c.legal_name}"? O histórico é mantido, mas a empresa deixa de aparecer nas seleções e nos totais.`:`Reativar "${c.legal_name}"?`;
  if(!confirm(msg)) return;
  const {error}=await sb.from("companies").update({active:!c.active}).eq("id",c.id);
  if(error){ toast("Não foi possível alterar: "+error.message); return; }
  toast(c.active?"Empresa inativada.":"Empresa reativada.");
  if(await loadCompanies()) drawEmp();
}

  $("view").innerHTML=head+`<p style="margin:0 0 10px;color:var(--mut)">${esc(title)}</p><div id="mbody">Carregando…</div>`;
  const {data:per,error}=await sb.from("monthly_periods").select("*").eq("company_id",cid).eq("year",y).eq("month",m).maybeSingle();
  if(error){ $("mbody").textContent="Erro ao carregar: "+error.message; return; }
  if(!per){
    const can=["admin","supervisor"].includes(state.profile.role);
    $("mbody").innerHTML=`<div class="card">Esta competência ainda não foi aberta.${can?` <button class="btn" id="mcreate" style="margin-left:8px">Criar competência de ${MESES[m-1]}/${y}</button>
      <p style="color:var(--mut);margin:10px 0 0">Copia as contas ativas. O saldo final fica vazio, a situação volta para Pendente e o saldo anterior vem do mês anterior, se existir.</p>`:""}</div>`;
    if(can) $("mcreate").onclick=()=>createPanel(cid,y,m);
    return;
  }
  const [rs,pf]=await Promise.all([
    sb.from("monthly_account_records").select("*, monitored_accounts!inner(description,institution,account_number,accounting_code,revenue_code,sort_order,account_categories!inner(id,name,kind,counts_as_cash,sort_order))").eq("period_id",per.id),
    sb.from("profiles").select("id,full_name,email").eq("active",true).order("full_name")]);
  if(rs.error||pf.error){ $("mbody").textContent="Erro ao carregar: "+(rs.error||pf.error).message; return; }
  const cs=(r)=>r.monitored_accounts.account_categories, ac=(r)=>r.monitored_accounts;
  const mem=state.profile.role==="supervisor"?await sb.from("company_members").select("can_close").eq("company_id",cid).eq("user_id",state.profile.id).maybeSingle():{data:null};
  const iss=await sb.from("reconciliation_issues").select("*, monthly_account_records!inner(period_id)").eq("monthly_account_records.period_id",per.id).order("identified_at",{ascending:false});
  MM={per,people:pf.data,locked:per.status==="encerrada",canClose:state.profile.role==="admin"||(state.profile.role==="supervisor"&&!!mem.data?.can_close),issues:iss.data||[],only:only||null,
      rows:rs.data.sort((a,b)=>cs(a).sort_order-cs(b).sort_order||ac(a).sort_order-ac(b).sort_order)};
  drawMensal();
}

function mensalMods(){
  const cs=(r)=>r.monitored_accounts.account_categories, mods=[], ord=(t)=>{const i=ACC_TYPES.indexOf(t); return i<0?50:i;};
  for(const [kind,label] of GROUPS){
    if(MM.only?!MM.only.includes(kind):MAIN_HIDE.includes(kind)) continue;
    const rows=MM.rows.filter(r=>cs(r).kind===kind); if(!rows.length) continue;
    if(kind==="bank"||kind==="cash"){
      const tl=(r)=>r.monitored_accounts.account_type||(kind==="cash"?"Caixa":"Sem tipo");
      [...new Set(rows.map(tl))].sort((a,b)=>(a==="Sem tipo")-(b==="Sem tipo")||ord(a)-ord(b)||a.localeCompare(b)).forEach(t=>mods.push({kind,label:t,rows:rows.filter(r=>tl(r)===t)}));
    } else mods.push({kind,label,rows});
  }
  mods.forEach((m,i)=>m.id="m"+i); return mods;
}
function drawMensal(){
  const dis=MM.locked?"disabled":"", ac=(r)=>r.monitored_accounts;
  const people='<option value="">—</option>'+MM.people.map(p=>`<option value="${esc(p.id)}">${esc(p.full_name||p.email)}</option>`).join("");
  const TH=(k,l,c)=>`<th${c?` class="${c}"`:""} data-sort="${k}" data-l="${l}" tabindex="0">${l}</th>`;
  MM.mods=mensalMods();
  let h=`<div class="mstats">${periodTile()}${MM.only?"":'<div class="mstat" id="msum"></div>'}<div class="mstat" id="mprog"></div><div class="mstat" id="mpend"></div><div class="mstat grow"><small>Pesquisar</small><input type="search" id="msearch" placeholder="Descrição, banco, nº da conta ou código" aria-label="Pesquisar"></div></div>`;
  if(!MM.rows.length) h+='<div class="card">Nenhuma conta ativa foi encontrada para esta competência.</div>';
  for(const m of MM.mods){
    const bank=m.kind==="bank", card=m.kind==="card";
    const head=card?TH("description","Nome")+TH("institution","Banco")+TH("revenue_code","Código receita")+TH("accounting_code","C. contábil")+TH("status","Situação")+TH("responsible","Responsável")+"<th>Observações</th>"+TH("updated_at","Atualizado")+"<th></th>"
      :TH("description","Descrição")+(bank?TH("institution","Banco")+TH("account_number","Nº conta"):"")+TH("accounting_code","C. contábil")+TH("previous_balance","Saldo anterior","r")+TH("final_balance","Saldo final","r")+TH("status","Situação")+TH("responsible","Responsável")+"<th>Observações</th>"+TH("updated_at","Atualizado")+"<th></th>";
    h+=`<div class="card tbl" id="${m.id}-card"><h3>${esc(m.label)} <span class="ct" id="ct-${m.id}"></span></h3><div id="sec-${m.id}" class="pills"></div><table class="mt"><thead><tr>${head}</tr></thead><tbody>`;
    for(const r of m.rows){
      const a=ac(r), id=esc(r.id);
      const bal=`<td class="r">${r.previous_balance==null?"—":fmtNum(r.previous_balance)}</td><td class="r"><input class="num" data-f="final_balance" data-id="${id}" value="${fmtNum(r.final_balance)}" placeholder="não informado" inputmode="decimal" ${dis}></td>`;
      const tail=`<td><select class="s-${ST[r.status][1]}" data-f="status" data-id="${id}" ${dis}>${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===r.status?" selected":""}>${v[0]}</option>`).join("")}</select></td>
        <td><select data-f="responsible_id" data-id="${id}" ${dis}>${people.replace(`value="${r.responsible_id}"`,`value="${r.responsible_id}" selected`)}</select></td>
        <td><input data-f="notes" data-id="${id}" value="${esc(r.notes||"")}" maxlength="500" ${dis}></td><td>${new Date(r.updated_at).toLocaleDateString("pt-BR")}</td><td><button class="lnk" data-a="issue" data-id="${id}" ${dis}>Divergência</button></td>`;
      const mid=card?`<td>${esc(a.institution||"—")}</td><td>${esc(a.revenue_code||"—")}</td><td>${esc(a.accounting_code||"—")}</td>`
        :bank?`<td>${esc(a.institution||"—")}</td><td>${esc(a.account_number||"—")}</td><td>${esc(a.accounting_code||"—")}</td>${bal}`:`<td>${esc(a.accounting_code||"—")}</td>${bal}`;
      h+=`<tr data-rid="${id}" data-q="${esc([a.description,a.institution,a.account_number,a.accounting_code,a.revenue_code].join(" ").toLowerCase())}"><td>${esc(a.description)}</td>${mid}${tail}</tr>`;
    }
    h+="</tbody></table></div>";
  }
  $("mbody").innerHTML=h+'<div class="card tbl" id="issues"></div>'+periodFooter()+periodDialogs()+issueDialog(); $("mbody").onchange=onMensalChange; bindPeriod(); bindIssues(); updSummaries(); drawIssues(); bindSearch(); bindSort();
}

function updSummaries(){
  const cs=(r)=>r.monitored_accounts.account_categories;
  const sum=(rs)=>{ const ok=rs.filter(r=>r.status!=="nao_aplicavel"); const v=ok.filter(r=>r.final_balance!=null);
    return {cents:v.reduce((a,r)=>a+cents(r.final_balance),0), missing:ok.length-v.length}; };
  for(const m of MM.mods||[]){
    if(!$("sec-"+m.id)) continue;
    const rows=m.rows, ap=rows.filter(r=>r.status!=="nao_aplicavel"), n=(s)=>rows.filter(r=>r.status===s).length, done=n("concluido");
    $("sec-"+m.id).innerHTML=`<span>Registros <b>${rows.length}</b></span><span>Concluídos <b>${done}</b></span><span>Pendentes <b>${n("pendente")}</b></span><span>Em andamento <b>${n("em_andamento")}</b></span><span>Divergência <b>${n("divergencia")}</b></span><span>Não aplicável <b>${n("nao_aplicavel")}</b></span><span>Conclusão <b>${ap.length?Math.round(done/ap.length*100)+"%":"—"}</b></span>`;
    if(m.kind!=="card"){ const s=sum(rows); $("ct-"+m.id).textContent="Total: "+brl(s.cents/100)+(s.missing?` (${s.missing} sem saldo informado)`:""); }
  }
  const cashS=sum(MM.rows.filter(r=>cs(r).counts_as_cash));
  if($("msum")) $("msum").innerHTML=`<small>Disponibilidade financeira</small><b>${brl(cashS.cents/100)}</b><small>${cashS.missing?`parcial: ${cashS.missing} sem saldo informado`:"bancos, aplicações e caixas"}</small>`;
  const shown=(MM.mods||[]).flatMap(m=>m.rows), ap=shown.filter(r=>r.status!=="nao_aplicavel"), done=shown.filter(r=>r.status==="concluido").length;
  if($("mprog")) $("mprog").innerHTML=`<small>Conclusão</small><b>${ap.length?Math.round(done/ap.length*100)+"%":"—"}</b><small>${done} de ${ap.length} itens aplicáveis</small>`;
  const pend=shown.filter(r=>r.status==="pendente"||r.status==="em_andamento").length, dv=shown.filter(r=>r.status==="divergencia").length;
  if($("mpend")) $("mpend").innerHTML=`<small>Pendências</small><b>${pend}</b><small>${dv} com divergência</small>`;
}

async function onMensalChange(e){
  const el=e.target.closest("[data-f]"); if(!el) return;
  const r=MM.rows.find(x=>x.id===el.dataset.id), f=el.dataset.f; let v=el.value;
  const undo=()=>{ if(f==="final_balance") el.value=fmtNum(r[f]); else el.value=r[f]??""; };
  if(f==="final_balance"){ v=parseBRL(v); if(v===undefined){ toast("Valor inválido. Use o formato 1.234,56."); undo(); return; } }
  else if(f==="responsible_id") v=v||null; else if(f==="notes") v=v.trim()||null;
  const {error}=await sb.from("monthly_account_records").update({[f]:v}).eq("id",r.id);
  if(error){ toast("Não foi possível salvar: "+error.message); undo(); return; }
  r[f]=v; if(f==="final_balance") el.value=fmtNum(v); if(f==="status") el.className="s-"+ST[v][1];
  updSummaries(); toast("Salvo.");
}

async function updUser(u,patch){
  const {error}=await sb.from("profiles").update(patch).eq("id",u.id);
  if(error){ toast("Não foi possível salvar: "+error.message); return false; }
  Object.assign(u,patch); drawUsers(); toast("Salvo."); return true;

async function onUserChange(e){
  const sel=e.target.closest("select[data-id]"); if(!sel) return;
  const u=UD.users.find(x=>x.id===sel.dataset.id), role=sel.value;
  if(role==="admin"&&!confirm(`Tornar ${u.full_name||u.email} administrador? Terá acesso a todas as empresas e a todos os dados.`)){ sel.value=u.role; return; }
  if(!await updUser(u,{role})) sel.value=u.role;
}
async function onUserClick(e){
  const b=e.target.closest("button[data-a]"); if(!b) return;
  const u=UD.users.find(x=>x.id===b.dataset.id); if(!u) return;
  if(b.dataset.a==="links") return openLinks(u);
  if(b.dataset.a==="name"){ const n=prompt("Nome do usuário:",u.full_name||""); if(n&&n.trim()) updUser(u,{full_name:n.trim()}); return; }
  if(confirm(u.active?`Inativar ${u.full_name||u.email}? Ele deixa de acessar o sistema, mas o histórico é mantido.`:`Reativar ${u.full_name||u.email}?`)) updUser(u,{active:!u.active});
}
function renderLinks(){
  const u=UD.cur, mine=UD.links.filter(l=>l.user_id===u.id);
  $("ulinks").innerHTML=state.companies.length?`<table><thead><tr><th>Empresa</th><th>Acesso</th><th>Pode encerrar</th></tr></thead><tbody>`+state.companies.map(c=>{
    const l=mine.find(x=>x.company_id===c.id);
    return `<tr><td>${esc(c.trade_name||c.legal_name)}${c.active?"":' <span class="tag warn">Inativa</span>'}</td>
    <td><input type="checkbox" data-k="acc" data-c="${esc(c.id)}" ${l?"checked":""}></td>
    <td><input type="checkbox" data-k="close" data-c="${esc(c.id)}" ${l?(l.can_close?"checked":""):"disabled"}></td></tr>`;}).join("")+"</tbody></table>":"Nenhuma empresa cadastrada.";
}
function openLinks(u){
  UD.cur=u; $("utitle").textContent="Empresas de "+(u.full_name||u.email); renderLinks();
  $("ulinks").onchange=onLinkChange; $("udlg").showModal();
}
async function onLinkChange(e){
  const t=e.target, k=t.dataset.k, cid=t.dataset.c, uid=UD.cur.id; if(!k) return;
  let error;
  if(k==="acc"){
    if(t.checked){ const r=await sb.from("company_members").insert({company_id:cid,user_id:uid,can_close:false}).select().single(); error=r.error;
      if(!error) UD.links.push(r.data); }
    else { const r=await sb.from("company_members").delete().eq("company_id",cid).eq("user_id",uid); error=r.error;
      if(!error) UD.links=UD.links.filter(l=>!(l.company_id===cid&&l.user_id===uid)); }
  } else {
    const r=await sb.from("company_members").update({can_close:t.checked}).eq("company_id",cid).eq("user_id",uid); error=r.error;
    if(!error) UD.links.find(l=>l.company_id===cid&&l.user_id===uid).can_close=t.checked;
  }
  if(error){ toast("Não foi possível salvar: "+error.message); t.checked=!t.checked; return; }
  renderLinks(); drawUsers(); toast("Salvo.");
}

function periodTile(){

  const re=p.reopened_at?` · reaberta em ${new Date(p.reopened_at).toLocaleDateString("pt-BR")}`:"";
  return `<div class="mstat"${p.reopen_reason?` title="Justificativa da reabertura: ${esc(p.reopen_reason)}"`:""}><small>Competência</small><b>${MM.locked?'<span class="tag warn">Encerrada</span>':'<span class="tag ok">Aberta</span>'}</b><small>${MM.locked?`em ${new Date(p.closed_at).toLocaleDateString("pt-BR")} por ${esc(who(p.closed_by))}`:"alterações liberadas"}${re}</small></div>`;
}
function periodFooter(){
  if(MM.only) return "";
  if(MM.locked) return state.profile.role==="admin"?'<div class="foot"><button class="btn sm sec" id="mreopen">Reabrir competência</button></div>':"";
  return MM.canClose?'<div class="foot"><button class="btn sm sec" id="mclose">Encerrar competência</button></div>':"";
}

function periodDialogs(){
  return `<dialog id="pdlg"><form method="dialog" onsubmit="return false"><h3 id="ptitle"></h3><div id="pbody"></div><div class="msg" id="pmsg" role="alert"></div>
    <div class="row"><button type="button" class="btn sec" id="pcancel">Cancelar</button><button type="button" class="btn" id="pok">Confirmar</button></div></form></dialog>`;
}
function bindPeriod(){
  if($("mclose")) $("mclose").onclick=openClose; if($("mreopen")) $("mreopen").onclick=openReopen;
  $("pcancel").onclick=()=>$("pdlg").close();
}
function openClose(){
  const rs=MM.rows, ap=rs.filter(r=>r.status!=="nao_aplicavel"), n=(s)=>rs.filter(r=>r.status===s).length;
  const done=n("concluido"), pend=n("pendente")+n("em_andamento"), div=n("divergencia"), iss=MM.issues.filter(i=>!i.resolved).length;
  const cash=rs.filter(r=>r.monitored_accounts.account_categories.counts_as_cash&&r.status!=="nao_aplicavel"&&r.final_balance!=null).reduce((a,r)=>a+cents(r.final_balance),0);
  const miss=rs.filter(r=>r.monitored_accounts.account_categories.counts_as_cash&&r.status!=="nao_aplicavel"&&r.final_balance==null).length;
  const risk=pend+div+iss>0, adm=state.profile.role==="admin";
  $("ptitle").textContent="Encerrar competência"; $("pmsg").textContent=""; $("pok").textContent="Encerrar";
  $("pbody").innerHTML=`<table><tbody><tr><td>Total de contas (inclui Folha e Fiscal)</td><td><b>${rs.length}</b></td></tr><tr><td>Concluídas</td><td><b>${done}</b></td></tr>
    <tr><td>Pendentes / em andamento</td><td><b>${pend}</b></td></tr><tr><td>Com divergência</td><td><b>${div}</b></td></tr><tr><td>Divergências abertas (cadastro)</td><td><b>${iss}</b></td></tr>
    <tr><td>Conclusão</td><td><b>${ap.length?Math.round(done/ap.length*100)+"%":"—"}</b></td></tr>
    <tr><td>Disponibilidade financeira${miss?" (parcial)":""}</td><td><b>${brl(cash/100)}</b></td></tr></tbody></table>`+
    (risk?`<p class="warnp"><b>Atenção:</b> há pendências ou divergências nesta competência.</p>`+(adm?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pforce"> Encerrar mesmo com pendências</label>`:`<p>Somente administradores podem encerrar com pendências. Resolva os itens acima.</p>`):"<p>Após o encerramento, as alterações comuns ficam bloqueadas.</p>");
  $("pok").disabled=risk&&!adm; $("pok").onclick=async()=>{
    if(risk&&!$("pforce")?.checked){ $("pmsg").textContent="Marque a confirmação para encerrar com pendências."; return; }
    $("pok").disabled=true;
    const {error}=await sb.rpc("close_period",{p_period:MM.per.id,p_force:risk});
    $("pok").disabled=false;
    if(error){ $("pmsg").textContent="Não foi possível encerrar: "+error.message; return; }
    $("pdlg").close(); toast("Competência encerrada."); renderMensal(); };
  $("pdlg").showModal();
}
function openReopen(){
  $("ptitle").textContent="Reabrir competência"; $("pmsg").textContent=""; $("pok").textContent="Reabrir";
  $("pbody").innerHTML=`<label>Justificativa (obrigatória, mínimo 10 caracteres)<textarea id="preason" rows="3" maxlength="500"></textarea></label>`;
  $("pok").disabled=false; $("pok").onclick=async()=>{
    const reason=$("preason").value.trim();
    if(reason.length<10){ $("pmsg").textContent="Informe uma justificativa com pelo menos 10 caracteres."; return; }
    $("pok").disabled=true;
    const {error}=await sb.rpc("reopen_period",{p_period:MM.per.id,p_reason:reason});
    $("pok").disabled=false;
    if(error){ $("pmsg").textContent="Não foi possível reabrir: "+error.message; return; }
    $("pdlg").close(); toast("Competência reaberta."); renderMensal(); };
  $("pdlg").showModal(); $("preason").focus();
}

async function saveIssue(){
  const desc=$("i_desc").value.trim(), ref=parseBRL($("i_ref").value), fo=parseBRL($("i_found").value);

async function onMensalClick(e){
  const th=e.target.closest("th[data-sort]"); if(th) return sortMensal(th);
  const b=e.target.closest("button[data-a]"); if(!b) return;
  if(b.dataset.a==="issue") return openIssue(MM.rows.find(r=>r.id===b.dataset.id),null);
  const i=MM.issues.find(x=>x.id===b.dataset.id); if(!i) return;
  if(b.dataset.a==="iedit") return openIssue(MM.rows.find(r=>r.id===i.record_id),i);
  if(b.dataset.a==="ires"){
    const res=!i.resolved;
    if(!confirm(res?"Marcar esta divergência como resolvida?":"Reabrir esta divergência?")) return;
    const {data,error}=await sb.from("reconciliation_issues").update({resolved:res,resolved_at:res?todayISO():null}).eq("id",i.id).select("*").single();
    if(error){ toast("Não foi possível alterar: "+error.message); return; }
    MM.issues=MM.issues.map(x=>x.id===i.id?data:x); drawIssues(); toast(res?"Divergência resolvida.":"Divergência reaberta.");
    const rec=MM.rows.find(r=>r.id===i.record_id);
    if(res&&rec.status==="divergencia"&&!MM.issues.some(x=>x.record_id===rec.id&&!x.resolved)&&confirm("Não há mais divergências abertas nesta conta. Atualizar a situação dela para Concluído?")) await setRecStatus(rec,"concluido");
  }
}

async function byIds(table,sel,ids){
  const out={}; ids=[...new Set(ids)].filter(Boolean);
  for(let i=0;i<ids.length;i+=40){ const {data}=await sb.from(table).select(sel).in("id",ids.slice(i,i+40)); (data||[]).forEach(x=>out[x.id]=x); }

async function loadAudit(){
  $("au_list").textContent="Carregando…";
  let q=sb.from("audit_logs").select("*").order("at",{ascending:false}).limit(100);
  if($("au_c").value) q=q.eq("company_id",$("au_c").value); if($("au_t").value) q=q.eq("table_name",$("au_t").value);
  const {data:logs,error}=await q; if(error){ $("au_list").textContent="Erro ao carregar: "+error.message; return; }
  if(!logs.length){ $("au_list").textContent="Nenhum evento registrado com esses filtros."; return; }
  const ids=(t)=>logs.filter(l=>l.table_name===t).map(l=>l.record_id);
  const pIds=logs.flatMap(l=>[l.user_id,...(["responsible_id","closed_by","reopened_by","default_responsible"].includes(l.field)?[l.old_value,l.new_value]:[])]);
  const [pf,recs,accs,pers]=await Promise.all([byIds("profiles","id,full_name,email",pIds),
    byIds("monthly_account_records","id,monitored_accounts(description),monthly_periods(year,month)",ids("monthly_account_records")),
    byIds("monitored_accounts","id,description",ids("monitored_accounts")),byIds("monthly_periods","id,year,month",ids("monthly_periods"))]);
  const nm=(id)=>{const p=pf[id]; return p?(p.full_name||p.email):(id?"Usuário removido":"—");};
  const obj=(l)=>{ if(l.table_name==="companies"){const c=state.companies.find(x=>x.id===l.record_id); return c?c.legal_name:"—";}
    if(l.table_name==="monitored_accounts") return accs[l.record_id]?.description||"—";
    if(l.table_name==="monthly_periods"){const p=pers[l.record_id]; return p?String(p.month).padStart(2,"0")+"/"+p.year:"—";}
    if(l.table_name==="monthly_account_records"){const r=recs[l.record_id]; return r?`${r.monitored_accounts?.description||"—"} (${String(r.monthly_periods?.month).padStart(2,"0")}/${r.monthly_periods?.year})`:"—";}
    return "—"; };
  const val=(f,v)=>{ if(v==null) return "vazio"; if(/balance|_value$/.test(f)) return brl(v); if(f==="status") return ST[v]?ST[v][0]:v;
    if(["responsible_id","closed_by","reopened_by","default_responsible"].includes(f)) return nm(v); if(f==="active"||f==="resolved") return v==="true"?"sim":"não";
    if(f.endsWith("_at")&&v.includes("T")) return new Date(v).toLocaleString("pt-BR"); return v; };
  $("au_list").innerHTML=`<table class="mt" style="min-width:900px"><thead><tr><th>Data e hora</th><th>Usuário</th><th>Tipo</th><th>Registro</th><th>Operação</th><th>Campo</th><th>De</th><th>Para</th></tr></thead><tbody>`+
    logs.map(l=>`<tr><td>${new Date(l.at).toLocaleString("pt-BR")}</td><td>${esc(l.user_id?nm(l.user_id):"Sistema")}</td><td>${esc(TB[l.table_name]||l.table_name)}</td><td>${esc(obj(l))}</td><td>${OPN[l.operation]||esc(l.operation)}</td>
    <td>${l.field?esc(FLD[l.field]||l.field):"—"}</td><td>${l.field?esc(val(l.field,l.old_value)):"—"}</td><td>${l.field?esc(val(l.field,l.new_value)):"—"}</td></tr>`).join("")+"</tbody></table>";
}

function evoSVG(ev,sel){

  const mx=Math.max(0,...vals), mn=Math.min(0,...vals), span=(mx-mn)||1, y0=top+plotH*(mx/span), slot=(W-20)/12, bw=Math.min(34,slot-8);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:none;height:auto" role="img" aria-label="Evolução mensal"><line x1="10" x2="${W-10}" y1="${y0}" y2="${y0}" style="stroke:var(--line)"/>`;
  ev.forEach((d,i)=>{ const x=10+i*slot+(slot-bw)/2, cx=x+bw/2;
    if(d.total!=null){ const h=Math.abs(d.total)/span*plotH, y=d.total>=0?y0-h:y0, c=d.m===sel?"#2f5f9e":"#9db7d9";

}

function parseCSV(text){
  text=text.replace(/^\uFEFF/,""); const sample=text.slice(0,4000);
  const cnt=(ch)=>{let q=false,n=0; for(const c of sample){ if(c==='"') q=!q; else if(!q&&c===ch) n++; } return n;};
  const best=[",",";","\t"].map(c=>[c,cnt(c)]).sort((a,b)=>b[1]-a[1])[0], d=best[1]?best[0]:",";
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===d){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";} else if(c!=="\r") cell+=c; }
  if(cell!==""||row.length){row.push(cell);rows.push(row);} return rows;
}
function parseMoney(s){
  s=String(s??"").replace(/R\$|\s/g,""); if(s==="") return {v:null}; if(/^-+$/.test(s)||/^0+$/.test(s)) return {v:0};
  let neg=false; if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);} if(s.startsWith("-")){neg=!neg;s=s.slice(1);}
  if(!/^[\d.,]+$/.test(s)) return {err:"valor inválido"};
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf("."); let n;
  if(lc>=0&&ld>=0) n=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(lc>=0) n=s.replace(/\./g,"").replace(",",".");
  else if(ld>=0) n=/^\d{1,3}(\.\d{3})+$/.test(s)?s.replace(/\./g,""):s; else n=s;
  const v=Number(n); if(!isFinite(v)) return {err:"valor inválido"}; if((n.split(".")[1]||"").length>2) return {err:"mais de 2 casas decimais"};
  return {v:neg?-v:v};
}
const titleCase=(s)=>s.toLowerCase().replace(/(^|\s)\S/g,(c)=>c.toUpperCase());
function guessSection(title){
  const t=nrm(title), kind=/caixa/.test(t)?"cash":/cartao|cartoes/.test(t)?"card":/folha/.test(t)?"payroll":/fiscal/.test(t)?"fiscal":/apropria|agua|energia|telefon|internet/.test(t)?"appropriation":/fornecedor|cliente|adiant/.test(t)?"third_party":"bank";
  let category=kind==="bank"?"Contas Correntes / Aplicações":kind==="cash"?"Caixas":kind==="card"?"Cartões":kind==="payroll"?(/ministro/.test(t)?"Folha - Ministros":/clt/.test(t)?"Folha - CLT":"Folha"):kind==="fiscal"?"Fiscal":kind==="appropriation"?(/agua/.test(t)?"Apropriação - Água":/energia/.test(t)?"Apropriação - Energia":/telefon/.test(t)?"Apropriação - Telefonia":/internet/.test(t)?"Apropriação - Internet":"Apropriação"):/adiant.*fornec/.test(t)?"Adiantamento a fornecedores":/adiant.*client/.test(t)?"Adiantamento a clientes":/fornec/.test(t)?"Fornecedores":"Clientes";
  let inst=""; const m=String(title).match(/\bbanco\s+(.+)$/i);
  if(m&&kind==="bank") inst=/^(do|da|de)\s/i.test(m[1])?"Banco "+m[1].toLowerCase().replace(/^(\S+\s)(.*)$/,(a,p,r)=>p+titleCase(r)):titleCase(m[1].trim());
  return {kind,category,institution:inst};
}

async function imRead(e){

    else { await loadLibs("xlsx"); IM.wb=XLSX.read(await f.arrayBuffer(),{type:"array"}); const sn=IM.wb.SheetNames;
      $("im_sheet").innerHTML=sn.map(n=>`<option>${esc(n)}</option>`).join(""); $("im_sheet").classList.toggle("hidden",sn.length<2); imParse(sn[0]); }

function imParse(sheet){ imBuild(XLSX.utils.sheet_to_json(IM.wb.Sheets[sheet],{header:1,raw:false,defval:""}).map(r=>r.map(c=>String(c??"")))); }
function imBuild(matrix){
  const isHdr=(cells)=>{const n=cells.map(nrm); return n.some(x=>x.startsWith("descri"))&&n.some(x=>x.includes("saldo"));};
  IM.sections=[]; IM.rows=[]; IM.counts={blank:0,header:0,total:0}; IM.statusMap={}; IM.respMap={}; let first=null,cur=-1;
  matrix.forEach((cells,li)=>{
    const ne=cells.map((c,i)=>[i,c.trim()]).filter(x=>x[1]);
    if(!ne.length){ IM.counts.blank++; return; }
    if(isHdr(cells)){ IM.counts.header++; if(!first) first=cells; return; }
    if(/^total\b/.test(nrm(ne[0][1]))){ IM.counts.total++; return; }
    if(ne.length===1&&!/^[\d.,\-\sR$()]+$/.test(ne[0][1])){ IM.sections.push({title:ne[0][1],cfg:guessSection(ne[0][1])}); cur=IM.sections.length-1; return; }
    if(cur<0){ IM.sections.push({title:"(sem título)",cfg:guessSection("")}); cur=0; }
    IM.rows.push({line:li+1,sec:cur,cells});
  });
  IM.headers=first||[]; IM.ncol=Math.max(0,...matrix.map(r=>r.length)); IM.colmap={};
  (first||[]).forEach((c,i)=>{ const n=nrm(c), set=(k)=>{ if(IM.colmap[k]==null) IM.colmap[k]=i; };

const imVal=(cells,k)=>IM.colmap[k]==null?"":String(cells[IM.colmap[k]]||"").trim();

function defResp(raw){ const n=nrm(raw); const p=IM.people.find(x=>nrm(x.full_name)===n||nrm((x.email||"").split("@")[0])===n)||IM.people.find(x=>n&&(nrm(x.full_name).includes(n)||nrm((x.email||"").split("@")[0]).includes(n))); return p?p.id:""; }

async function imValidate(){

const IMS={nova:["Nova conta","ok"],preenche:["Preenche registro","ok"],conflito:["Já tem dados","warn"],erro:["Rejeitada","err"]};

const SORTKEYS={
  revenue_code:(r)=>r.monitored_accounts.revenue_code, description:(r)=>r.monitored_accounts.description, institution:(r)=>r.monitored_accounts.institution, account_number:(r)=>r.monitored_accounts.account_number,
  accounting_code:(r)=>r.monitored_accounts.accounting_code, previous_balance:(r)=>r.previous_balance, final_balance:(r)=>r.final_balance,
  status:(r)=>ST[r.status][0], responsible:(r)=>{const p=MM.people.find(x=>x.id===r.responsible_id); return p?(p.full_name||p.email):"";}, updated_at:(r)=>r.updated_at
};
function sortMensal(th){
  const key=th.dataset.sort, f=SORTKEYS[key]; if(!f) return;
  MM.sort={key,dir:MM.sort&&MM.sort.key===key?-MM.sort.dir:1};
  const col=new Intl.Collator("pt-BR",{numeric:true,sensitivity:"base"}), num=key==="previous_balance"||key==="final_balance", byId=new Map(MM.rows.map(r=>[r.id,r]));
  document.querySelectorAll("#mbody table.mt").forEach(tb=>{
    const body=tb.tBodies[0]; if(!body||!body.querySelector("tr[data-rid]")) return;
    const groups=[]; let cur={head:null,rows:[]}; groups.push(cur);
    [...body.rows].forEach(tr=>{ if(tr.classList.contains("catrow")){ cur={head:tr,rows:[]}; groups.push(cur); } else if(cur) cur.rows.push(tr); });
    groups.forEach(g=>g.rows.sort((a,b)=>{
      const va=f(byId.get(a.dataset.rid)), vb=f(byId.get(b.dataset.rid)), ea=va==null||va==="", eb=vb==null||vb==="";
      if(ea||eb) return ea&&eb?0:ea?1:-1;                       // vazios sempre por último
      return MM.sort.dir*(num?Number(va)-Number(vb):col.compare(String(va),String(vb))); }));
    groups.forEach(g=>{ if(g.head) body.appendChild(g.head); g.rows.forEach(tr=>body.appendChild(tr)); });
    tb.querySelectorAll("th[data-sort]").forEach(h=>{ const on=h.dataset.sort===key; h.textContent=h.dataset.l+(on?(MM.sort.dir===1?" ▲":" ▼"):"");
      h.setAttribute("aria-sort",on?(MM.sort.dir===1?"ascending":"descending"):"none"); });
  });
}

/* ============ DASHBOARD: SALDO POR TIPO DE CONTA ============ */
const TYPE_COLORS=["#2f5f9e","#1f8a4c","#d98a12","#8a5fb5","#3a9e9a","#c43232","#7fa6d6","#9aa4b1"];
function typeChart(base){
  const mo=(r)=>r.monthly_periods.month, lab=(r)=>r.monitored_accounts.account_type||(r.monitored_accounts.account_categories.kind==="cash"?"Caixa":"Sem tipo informado");
  const rows=base.filter(r=>["bank","cash"].includes(r.monitored_accounts.account_categories.kind)&&r.status!=="nao_aplicavel"&&r.final_balance!=null);
  if(!rows.length) return '<span style="color:var(--mut)">Sem saldos informados neste ano.</span>';
  const ord=(t)=>{const i=ACC_TYPES.indexOf(t); return i<0?99:i;};
  const types=[...new Set(rows.map(lab))].sort((a,b)=>ord(a)-ord(b)||a.localeCompare(b));
  const val=(m,t)=>rows.filter(r=>mo(r)===m&&lab(r)===t).reduce((s,r)=>s+cents(r.final_balance),0)/100;
  const has=(m)=>rows.some(r=>mo(r)===m);
  const stacks=MESES.map((_,i)=>types.map(t=>val(i+1,t)));
  const mx=Math.max(0,...stacks.map(s=>s.filter(v=>v>0).reduce((a,v)=>a+v,0))), mn=Math.min(0,...stacks.map(s=>s.filter(v=>v<0).reduce((a,v)=>a+v,0))), span=(mx-mn)||1;
  const W=720,H=235,top=22,plotH=150,y0=top+plotH*(mx/span),slot=(W-20)/12,bw=Math.min(36,slot-8), k=plotH/span;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:none;height:auto" role="img" aria-label="Saldo por tipo de conta em cada mês"><line x1="10" x2="${W-10}" y1="${y0}" y2="${y0}" style="stroke:var(--line)"/>`;
  stacks.forEach((st,i)=>{ const x=10+i*slot+(slot-bw)/2, cx=x+bw/2; let up=y0, dn=y0;
    if(has(i+1)){ st.forEach((v,ti)=>{ if(!v) return; const h=Math.abs(v)*k; const c=TYPE_COLORS[ti%TYPE_COLORS.length];
      if(v>0){ up-=h; s+=`<rect x="${x}" y="${up}" width="${bw}" height="${Math.max(h,1)}" fill="${c}"><title>${esc(types[ti])}: ${brl(v)}</title></rect>`; }
      else { s+=`<rect x="${x}" y="${dn}" width="${bw}" height="${Math.max(h,1)}" fill="${c}"><title>${esc(types[ti])}: ${brl(v)}</title></rect>`; dn+=h; } });
      s+=`<text x="${cx}" y="${up-4}" font-size="10" text-anchor="middle" style="fill:var(--tx)">${kfmt(st.reduce((a,v)=>a+v,0))}</text>`; }
    s+=`<text x="${cx}" y="${H-12}" font-size="11" text-anchor="middle" style="fill:var(--mut)">${MES_ABR[i]}</text>`; });
  s+="</svg>";

const FF_TITLE={payroll:"Folha",fiscal:"Fiscal",appropriation:"Apropriação"};

  appropriation:[["Apropriação - Água","Água"],["Apropriação - Energia","Energia"],["Apropriação - Telefonia","Telefonia"],["Apropriação - Internet","Internet"]]};
const FF_COLS={payroll:["description","code","balance","status","resp","notes"],fiscal:["description","code","balance","status","resp","notes"],appropriation:["description","number","code","status","resp","balance","notes"]};
const FF_HEAD={description:"Descrição",number:"Nº conta",code:"C. contábil",balance:"Saldo final",status:"Situação",resp:"Responsável",notes:"Observações"};
const FF_ICON={"Água":'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>',"Energia":'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  "Telefonia":'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',"Internet":'<path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01"/>'};
const FF_PLURAL={"Água":["água","águas"],"Energia":["energia","energias"],"Telefonia":["telefonia","telefonias"],"Internet":["internet","internet"]};
let FF={kind:null,per:null,rows:[],people:[],mods:[]};
function ffGroup(rows,kind){
  const mods=FF_MODS[kind].map(([cat,label])=>({cat,label,rows:[]}));
  rows.forEach(r=>{ const cn=r.monitored_accounts.account_categories.name; let m=mods.find(x=>x.cat.toLowerCase()===String(cn).toLowerCase()); if(!m){ m={cat:cn,label:cn,rows:[]}; mods.push(m); } m.rows.push(r); });
  mods.forEach(m=>m.rows.sort((a,b)=>a.monitored_accounts.sort_order-b.monitored_accounts.sort_order||a.monitored_accounts.description.localeCompare(b.monitored_accounts.description)));
  return mods;
}
async function renderFF(kind){
  const cid=$("companySel").value, ym=$("period").value, title=FF_TITLE[kind];
  const head=`<div class="mh"><h2>${title}</h2><div class="mh-nav"><button class="btn sm sec" id="mprev">‹ Mês anterior</button><button class="btn sm sec" id="mnext">Mês seguinte ›</button></div></div>`;
  if(!cid||!ym){ $("view").innerHTML=head+'<div class="card">Selecione a empresa e a competência no cabeçalho.</div>'; return; }
  const [y,m]=ym.split("-").map(Number), co=state.companies.find(c=>c.id===cid);
  $("view").innerHTML=head+`<p style="margin:0 0 10px;color:var(--mut)">${esc(co?.legal_name||"")} · ${MESES[m-1]} de ${y}</p><div id="mbody">Carregando…</div>`;
  const {data:per,error}=await sb.from("monthly_periods").select("*").eq("company_id",cid).eq("year",y).eq("month",m).maybeSingle();
  if(error){ $("mbody").textContent="Erro ao carregar: "+error.message; return; }
  if(!per){
    const can=["admin","supervisor"].includes(state.profile.role);
    $("mbody").innerHTML=`<div class="card">Esta competência ainda não foi aberta.${can?` <button class="btn sm" id="mcreate" style="margin-left:8px">Criar competência de ${MESES[m-1]}/${y}</button>`:""}</div>`;
    if(can) $("mcreate").onclick=()=>createPanel(cid,y,m); return;
  }
  const [rs,pf]=await Promise.all([
    sb.from("monthly_account_records").select("id,status,final_balance,responsible_id,notes,monitored_accounts!inner(id,description,account_number,accounting_code,sort_order,account_categories!inner(name,kind))").eq("period_id",per.id),
    sb.from("profiles").select("id,full_name,email").eq("active",true).order("full_name")]);
  if(rs.error||pf.error){ $("mbody").textContent="Erro ao carregar: "+(rs.error||pf.error).message; return; }
  FF={kind,per,people:pf.data,rows:rs.data.filter(r=>r.monitored_accounts.account_categories.kind===kind)};
  drawFF();
}
const ffPeople=(sel)=>'<option value="">—</option>'+FF.people.map(p=>`<option value="${esc(p.id)}"${p.id===sel?" selected":""}>${esc(p.full_name||p.email)}</option>`).join("");
const ffStatus=(sel)=>Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===sel?" selected":""}>${v[0]}</option>`).join("");
function rowFF(r,dis,ed){
  const a=r.monitored_accounts, fixed=(c,val)=>ed?`<td><input data-e="${c}" value="${esc(val)}" maxlength="${c==="description"?200:60}"></td>`:`<td>${esc(val||"—")}</td>`;
  const cell=(c)=>c==="description"?fixed(c,a.description):c==="number"?fixed(c,a.account_number||""):c==="code"?fixed(c,a.accounting_code||""):
    c==="balance"?`<td class="r"><input class="num" data-f="final_balance" value="${fmtNum(r.final_balance)}" placeholder="não informado" inputmode="decimal" ${dis}></td>`:
    c==="status"?`<td><select class="s-${ST[r.status][1]}" data-f="status" ${dis}>${ffStatus(r.status)}</select></td>`:
    c==="resp"?`<td><select data-f="responsible_id" ${dis}>${ffPeople(r.responsible_id)}</select></td>`:
    `<td><input data-f="notes" value="${esc(r.notes||"")}" maxlength="500" ${dis}></td>`;
  const act=dis?"":ed?'<button class="lnk" data-a="esave">Salvar</button> <button class="lnk" data-a="ecancel">Cancelar</button>':'<button class="lnk" data-a="edit">Editar</button> <button class="lnk" data-a="del">Remover</button>';
  return `<tr data-id="${esc(r.id)}">${FF_COLS[FF.kind].map(cell).join("")}<td class="nw">${act}</td></tr>`;
}
function ffDraftCell(col){
  if(col==="description") return '<td><input id="dr_desc" placeholder="Descrição" maxlength="200"></td>';
  if(col==="number") return '<td><input id="dr_num" placeholder="Nº conta" maxlength="60"></td>';
  if(col==="code") return '<td><input id="dr_code" placeholder="C. contábil" maxlength="60"></td>';
  if(col==="balance") return '<td class="r"><input class="num" id="dr_bal" placeholder="0,00" inputmode="decimal"></td>';
  if(col==="status") return `<td><select id="dr_st">${ffStatus("pendente")}</select></td>`;
  if(col==="resp") return `<td><select id="dr_resp">${ffPeople("")}</select></td>`;
  return '<td><input id="dr_notes" placeholder="Observações" maxlength="500"></td>';
}
function ffTiles(mods){
  if(FF.kind!=="appropriation") return "";
  return `<div class="tiles">`+mods.filter(m=>FF_ICON[m.label]).map((m,i)=>{ const n=m.rows.length, pl=FF_PLURAL[m.label];
    return `<button type="button" class="sqtile" data-go="${i}" aria-label="${n} ${n===1?pl[0]:pl[1]}"><svg viewBox="0 0 24 24" aria-hidden="true">${FF_ICON[m.label]}</svg><b>${n}</b><small>${n===1?pl[0]:pl[1]}</small></button>`;}).join("")+"</div>";
}
function drawFF(){
  const locked=FF.per.status==="encerrada", dis=locked?"disabled":"", mods=ffGroup(FF.rows,FF.kind), cols=FF_COLS[FF.kind]; FF.mods=mods;
  let h=(locked?'<div class="card" style="border-left:4px solid var(--warn)">Competência encerrada: alterações bloqueadas.</div>':"")+'<div id="ff_sum" class="pills"></div>'+ffTiles(mods);
  mods.forEach((md,i)=>{
    h+=`<div class="card tbl wide" id="ffm-${i}"><h3>${esc(md.label)} <span class="ct" id="fft-${i}"></span></h3><table class="mt" style="min-width:820px"><thead><tr>${cols.map(c=>`<th class="${c==="balance"?"r":""}">${FF_HEAD[c]}</th>`).join("")}<th></th></tr></thead>
      <tbody id="ffb-${i}">${md.rows.map(r=>rowFF(r,dis,false)).join("")}</tbody></table>${locked?"":`<p style="margin:10px 0 0"><button class="btn sm sec" data-a="add" data-m="${i}">+ Adicionar item</button></p>`}</div>`; });
  $("mbody").innerHTML=h; $("mbody").onchange=onFFChange; $("mbody").onclick=onFFClick;
  $("mbody").onkeydown=(e)=>{ if(e.key==="Enter"&&e.target.closest(".draft")&&e.target.tagName==="INPUT") saveFF(); };
  ffSummary();
}
function ffSummary(){
  const rs=FF.rows, ap=rs.filter(r=>r.status!=="nao_aplicavel"), n=(s)=>rs.filter(r=>r.status===s).length, done=n("concluido");
  $("ff_sum").innerHTML=`<span>Itens <b>${rs.length}</b></span><span>Concluídos <b>${done}</b></span><span>Pendentes <b>${n("pendente")}</b></span><span>Em andamento <b>${n("em_andamento")}</b></span><span>Divergência <b>${n("divergencia")}</b></span><span>Não aplicável <b>${n("nao_aplicavel")}</b></span><span>Conclusão <b>${ap.length?Math.round(done/ap.length*100)+"%":"—"}</b></span>`;
  FF.mods.forEach((md,i)=>{ const v=md.rows.filter(r=>r.status!=="nao_aplicavel"&&r.final_balance!=null); if($("fft-"+i)) $("fft-"+i).textContent=md.rows.length?"Total: "+brl(v.reduce((s,r)=>s+cents(r.final_balance),0)/100):""; });
}
async function onFFChange(e){
  const el=e.target.closest("[data-f]"), tr=e.target.closest("tr[data-id]"); if(!el||!tr) return;
  const r=FF.rows.find(x=>x.id===tr.dataset.id), f=el.dataset.f; let v=el.value;
  const undo=()=>{ if(f==="final_balance") el.value=fmtNum(r.final_balance); else el.value=r[f]??""; };
  if(f==="final_balance"){ v=parseBRL(v); if(v===undefined){ toast("Valor inválido. Use o formato 1.234,56."); undo(); return; } } else v=v.trim()||null;
  const {error}=await sb.from("monthly_account_records").update({[f]:v}).eq("id",r.id);
  if(error){ toast("Não foi possível salvar: "+error.message); undo(); return; }
  r[f]=v; if(f==="final_balance") el.value=fmtNum(v); if(f==="status") el.className="s-"+ST[v][1]; ffSummary(); toast("Salvo.");
}
async function onFFClick(e){
  const go=e.target.closest("[data-go]"); if(go){ $("ffm-"+go.dataset.go)?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const b=e.target.closest("button[data-a]"); if(!b) return; const a=b.dataset.a, tr=b.closest("tr");
  if(a==="cancel"){ document.querySelector(".draft")?.remove(); return; }
  if(a==="add"){
    document.querySelector(".draft")?.remove(); const i=b.dataset.m;
    $("ffb-"+i).insertAdjacentHTML("beforeend",`<tr class="draft" data-m="${i}">${FF_COLS[FF.kind].map(ffDraftCell).join("")}<td class="nw"><button class="lnk" data-a="save">Salvar</button> <button class="lnk" data-a="cancel">Cancelar</button></td></tr>`);
    $("dr_desc").focus(); return;
  }
  if(a==="save") return saveFF();
  const r=tr&&FF.rows.find(x=>x.id===tr.dataset.id); if(!r) return;
  if(a==="edit"){ tr.outerHTML=rowFF(r,"",true); document.querySelector('tr[data-id="'+r.id+'"] [data-e="description"]')?.focus(); return; }
  if(a==="ecancel"){ tr.outerHTML=rowFF(r,"",false); return; }
  if(a==="esave"){
    const g=(k)=>tr.querySelector(`[data-e="${k}"]`), ac=r.monitored_accounts, d=g("description").value.trim(), c=g("code").value.trim(), num=g("number")?g("number").value.trim():(ac.account_number||"");
    if(!d){ toast("A descrição não pode ficar vazia."); return; }
    const {error}=await sb.rpc("update_ff_item",{p_record:r.id,p_description:d,p_code:c,p_number:num});
    if(error){ toast(error.message); return; }
    ac.description=d; ac.accounting_code=c||null; ac.account_number=num||null; tr.outerHTML=rowFF(r,"",false); toast("Salvo."); return;
  }
  if(a==="del"){
    if(!confirm(`Remover "${r.monitored_accounts.description}"? Ele deixa de entrar nos próximos meses.`)) return;
    const {data,error}=await sb.rpc("remove_ff_item",{p_record:r.id});
    if(error){ toast("Não foi possível remover: "+error.message); return; }
    toast(data==="removed"?"Item removido.":"O item já tem dados: continua neste mês, mas não entra nos próximos."); renderFF(FF.kind);
  }
}
async function saveFF(){
  const dr=document.querySelector(".draft"); if(!dr) return;
  const desc=$("dr_desc").value.trim(), bal=$("dr_bal")?parseBRL($("dr_bal").value):null;
  if(!desc){ toast("Informe a descrição."); $("dr_desc").focus(); return; }
  if(bal===undefined){ toast("Valor inválido. Use o formato 1.234,56."); $("dr_bal").focus(); return; }
  const md=FF.mods[Number(dr.dataset.m)];
  const {data,error}=await sb.rpc("add_ff_item",{p_period:FF.per.id,p_kind:FF.kind,p_category:md.cat,p_description:desc,p_number:$("dr_num")?$("dr_num").value.trim():"",p_code:$("dr_code").value.trim(),p_status:$("dr_st").value,p_resp:$("dr_resp").value||null,p_balance:bal});
  if(error){ toast("Não foi possível adicionar: "+error.message); return; }
  const nt=$("dr_notes").value.trim();
  if(nt&&data){ const u=await sb.from("monthly_account_records").update({notes:nt}).eq("id",data); if(u.error) toast("Item criado, mas a observação não foi salva: "+u.error.message); }
  toast("Item adicionado."); renderFF(FF.kind);
}

function themeCard(){
  const t=document.documentElement.dataset.theme==="dark"?"dark":"light";
  return `<div class="card" id="th_card"><h3>Aparência</h3><p style="margin:0 0 10px;color:var(--mut)">Escolha a cor do sistema. A escolha fica salva neste navegador.</p>
    <div class="bar" style="margin:0"><button type="button" class="btn sec themebtn" data-theme-set="light" aria-pressed="${t==="light"}" aria-label="Tema claro" title="Tema claro"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> Claro</button>
    <button type="button" class="btn sec themebtn" data-theme-set="dark" aria-pressed="${t==="dark"}" aria-label="Tema escuro" title="Tema escuro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg> Escuro</button></div></div>`;
}
function setTheme(t){
  document.documentElement.dataset.theme=t==="dark"?"dark":"light";
  try{ localStorage.setItem("theme",t==="dark"?"dark":"light"); }catch(e){}
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===t)));
  if(state.page==="dashboard"&&DB&&DB.rows&&$("d_body")&&$("d_body").innerHTML) drawDash();
}
$("view").addEventListener("click",(e)=>{ const b=e.target.closest("[data-theme-set]"); if(b) setTheme(b.dataset.themeSet); });

init();
</script>
</body>
</html>
