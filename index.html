/* Monta o PDF no modelo oficial (A4, 1 página). */
async function buildDeclPdf(d){
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"}), S=d.set, L=25.5, R=184.5, W=R-L;
  doc.setTextColor(0,0,0); doc.setDrawColor(0,0,0);
  // Logotipo centralizado
  let y=24;
  const LG=d.logo; if(LG){ try{ const sz=await imgSize(LG), k=Math.min(92/sz.w,30/sz.h), w=sz.w*k, h=sz.h*k;
    doc.addImage(LG,/^data:image\/png/.test(LG)?"PNG":"JPEG",105-w/2,y+(30-h)/2,w,h); }catch(e){} }
  // Parágrafo justificado com a razão social em negrito e recuo na primeira linha
  const fs=12, lh=5.55; doc.setFontSize(fs);
  const words=[]; const add=(t,bold)=>t.split(/\s+/).filter(Boolean).forEach(w=>words.push({w,bold}));
  add("A",false); add(d.legal,true);
  add(`, inscrita no CNPJ sob o número ${d.cnpj}, situada na ${d.address||"(endereço não cadastrado)"}, obteve um faturamento nos últimos doze meses, no montante de:`,false);
  for(let i=1;i<words.length;i++) if(/^[,.;:]/.test(words[i].w)&&!words[i].bold){ words[i-1].tail=(words[i-1].tail||"")+words[i].w; words[i].drop=true; }
  const toks=words.filter(t=>!t.drop);
  const wid=(t)=>{ doc.setFont("helvetica",t.bold?"bold":"normal"); let x=doc.getTextWidth(t.w); if(t.tail){ doc.setFont("helvetica","normal"); x+=doc.getTextWidth(t.tail); } return x; };
  doc.setFont("helvetica","normal"); const sp=doc.getTextWidth(" "), indent=25;
  const lines=[]; let cur=[], cw=0, avail=W-indent;
  toks.forEach(t=>{ const w=wid(t); if(cur.length&&cw+sp+w>avail){ lines.push({t:cur,w:cw,avail}); cur=[]; cw=0; avail=W; } cw+=(cur.length?sp:0)+w; cur.push(t); });
  if(cur.length) lines.push({t:cur,w:cw,avail,last:true});
  y=72;
  lines.forEach((ln,li)=>{ let x=L+(li===0?indent:0); const gap=ln.last||ln.t.length<2?sp:sp+(ln.avail-ln.w)/(ln.t.length-1);
    ln.t.forEach(t=>{ doc.setFont("helvetica",t.bold?"bold":"normal"); doc.text(t.w,x,y); let x2=x+doc.getTextWidth(t.w);
      if(t.tail){ doc.setFont("helvetica","normal"); doc.text(t.tail,x2,y); x2+=doc.getTextWidth(t.tail); } x=x2+gap; }); y+=lh; });
  // Tabela centralizada
  const tx=59.5, cw1=46.5, cw2=48.5, rh=6.05; let ty=Math.max(105,y+12);
  const cell=(x,yy,w,txt,bold,thick)=>{ doc.setLineWidth(thick?0.5:0.25); doc.rect(x,yy,w,rh); doc.setFont("helvetica",bold?"bold":"normal"); doc.text(txt,x+w/2,yy+rh/2+1.35,{align:"center"}); };
  doc.setFontSize(11);
  cell(tx,ty,cw1,"MÊS",true); cell(tx+cw1,ty,cw2,"RECEITA",true);
  doc.setLineWidth(0.25); [["MÊS",tx,cw1],["RECEITA",tx+cw1,cw2]].forEach(([t,x,w])=>{ const tw=doc.getTextWidth(t); doc.line(x+w/2-tw/2,ty+rh/2+1.9,x+w/2+tw/2,ty+rh/2+1.9); });
  ty+=rh; let tot=0;
  d.rows.forEach(r=>{ tot+=cents(r.value); cell(tx,ty,cw1,r.label,false); cell(tx+cw1,ty,cw2,brlPdf(r.value),false); ty+=rh; });
  doc.setFontSize(11.5); cell(tx,ty,cw1,"TOTAL",true,true); cell(tx+cw1,ty,cw2,brlPdf(tot/100),true,true); ty+=rh;
  // Data e local
  const dt=d.date; doc.setFont("helvetica","normal"); doc.setFontSize(12);
  doc.text(`${S.place||"Campina Grande/PB"}, ${dt.getDate()} de ${MES_CAP(dt.getMonth())} de ${dt.getFullYear()}.`,L,Math.max(225,ty+20));
  // Assinaturas lado a lado
  const sy=258, sig=(cx,lines)=>{ doc.setLineWidth(0.25); doc.line(cx-30,sy,cx+30,sy); doc.setFontSize(11);
    lines.forEach((t,i)=>{ doc.setFont("helvetica","normal"); doc.text(doc.splitTextToSize(t,70)[0]||"",cx,sy+7+i*5,{align:"center"}); }); };
  sig(62,[S.accountant_name||"",S.accountant_role||"Contador",S.accountant_crc?(/^crc/i.test(S.accountant_crc)?S.accountant_crc:"CRC: "+S.accountant_crc):""]);
  sig(152,[S.rep_name||"",S.rep_role||"",S.rep_cpf?"CPF: "+fmtCpf(S.rep_cpf):""]);
  return doc;
}

  const q=sb.from("pos_machines").select("*").order("name"); const {data,error}=await (cid?q.eq("company_id",cid):q);
  if(error){ $("pm_grid").textContent=/pos_machines/.test(error.message)?"A tabela de maquininhas ainda não existe. Rode o arquivo 010_maquininhas.sql no Supabase.":"Erro ao carregar: "+error.message; return; }

  $("pm_q").oninput=drawPM; $("pm_s").onchange=drawPM; $("pm_grid").onclick=(e)=>{ const b=e.target.closest(".pos-card"); if(b) openPM(PM.rows.find(x=>x.id===b.dataset.id)); };

  if(canEdit) $("pm_new").onclick=()=>openPM(null);

}
function drawPM(){
  const q=$("pm_q").value.trim().toLowerCase(), st=$("pm_s").value, all=!$("companySel").value;
  const rows=PM.rows.filter(m=>(st==="all"||(st==="active")===m.active)&&(!q||[m.name,m.provider,m.serial_number,m.pos_number].join(" ").toLowerCase().includes(q)));
  if(!rows.length){ $("pm_grid").innerHTML='<div class="card">'+(PM.rows.length?"Nenhuma maquininha com esses filtros.":"Nenhuma maquininha cadastrada.")+"</div>"; return; }
  $("pm_grid").innerHTML=`<div class="pos-grid">`+rows.map(m=>{ const c=POS_COLORS[m.provider.trim().toLowerCase()]||"#6a7686";
    return `<button type="button" class="pos-card${m.active?"":" off"}" data-id="${esc(m.id)}"><svg viewBox="0 0 24 24" style="stroke:${c}" aria-hidden="true">${POS_SVG}</svg><span class="pv" style="color:${c}">${esc(m.provider)}</span><b>${esc(m.name)}</b>${all?`<small>${esc(compName(m.company_id))}</small>`:""}${m.active?"":"<small>Inativa</small>"}</button>`;}).join("")+"</div>";
}
function openPM(m){
  PM.edit=m; const canEdit=["admin","supervisor"].includes(state.profile.role), cid=$("companySel").value; $("p_msg").textContent="";
  $("pm_title").textContent=m?"Maquininha":"Cadastrar maquininha";
  $("p_co").innerHTML='<option value="">Selecione…</option>'+state.companies.filter(c=>c.active||c.id===m?.company_id).map(c=>`<option value="${esc(c.id)}">${esc(c.trade_name||c.legal_name)}</option>`).join("");
  $("p_prov").innerHTML='<option value="">Selecione…</option>'+POS_PROVIDERS.map(p=>`<option>${p}</option>`).join("")+'<option value="__outra">Outra…</option>';
  const known=m&&POS_PROVIDERS.find(p=>p.toLowerCase()===m.provider.trim().toLowerCase());
  $("p_co").value=m?.company_id||cid||""; $("p_prov").value=m?(known||"__outra"):""; $("p_oth").value=m&&!known?m.provider:""; $("p_othl").classList.toggle("hidden",$("p_prov").value!=="__outra");
  $("p_name").value=m?.name||""; $("p_sn").value=m?.serial_number||""; $("p_pos").value=m?.pos_number||""; $("p_desc").value=m?.description||"";
  ["p_co","p_name","p_prov","p_oth","p_sn","p_pos","p_desc"].forEach(id=>$(id).disabled=!canEdit||(id==="p_co"&&!!m));
  $("p_save").classList.toggle("hidden",!canEdit); $("p_tog").classList.toggle("hidden",!(canEdit&&m)); if(m) $("p_tog").textContent=m.active?"Inativar":"Reativar";
  $("pm_dlg").showModal();

async function savePM(){
  const g=(id)=>$(id).value.trim(), prov=$("p_prov").value==="__outra"?g("p_oth"):$("p_prov").value;
  if(!g("p_co")||!g("p_name")||!prov||!g("p_sn")||!g("p_pos")||!g("p_desc")){ $("p_msg").textContent="Preencha todos os campos: empresa, nome, companhia, SN, POS e descrição."; return; }
  const f={name:g("p_name"),provider:prov,serial_number:g("p_sn"),pos_number:g("p_pos"),description:g("p_desc")};
  $("p_save").disabled=true;
  const {error}=PM.edit?await sb.from("pos_machines").update(f).eq("id",PM.edit.id):await sb.from("pos_machines").insert({...f,company_id:g("p_co")});
  $("p_save").disabled=false;
  if(error){ $("p_msg").textContent=error.code==="23505"?"Já existe uma maquininha com este SN para essa companhia nesta empresa.":error.code==="23514"?"Preencha todos os campos.":"Não foi possível salvar: "+error.message; return; }
  $("pm_dlg").close(); toast("Maquininha salva."); renderMaquininhas();
}
async function togglePM(){
  const m=PM.edit; if(!confirm(m.active?`Inativar "${m.name}"? O histórico é mantido.`:`Reativar "${m.name}"?`)) return;
  const {error}=await sb.from("pos_machines").update({active:!m.active}).eq("id",m.id);
  if(error){ $("p_msg").textContent="Não foi possível alterar: "+error.message; return; }
  $("pm_dlg").close(); toast(m.active?"Maquininha inativada.":"Maquininha reativada."); renderMaquininhas();
}

/* ============ FOLHA, FISCAL E APROPRIAÇÃO (itens na própria tela) ============ */
const FF_TITLE={payroll:"Folha",fiscal:"Fiscal",appropriation:"Apropriação"};
const FF_MODS={payroll:[["Folha - CLT","Folha Matriz - CLT"],["Folha - Ministros","Folha Matriz - Ministros"]],fiscal:[["Fiscal","Fiscal"]],
  appropriation:[["Apropriação - Água","Água"],["Apropriação - Energia","Energia"],["Apropriação - Telefonia","Telefonia"],["Apropriação - Internet","Internet"]]};
const FF_COLS={payroll:["description","code","balance","status","resp","notes"],fiscal:["description","code","balance","status","resp","notes"],appropriation:["description","number","code","status","resp","balance","notes"]};
const FF_HEAD={description:"Descrição",number:"Nº conta",code:"C. contábil",balance:"Saldo final",status:"Situação",resp:"Responsável",notes:"Observações"};
const FF_ICON={"Água":'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>',"Energia":'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  "Telefonia":'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',"Internet":'<path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01"/>'};
const FF_PLURAL={"Água":["água","águas"],"Energia":["energia","energias"],"Telefonia":["telefonia","telefonias"],"Internet":["internet","internet"]};
let FF={kind:null,per:null,rows:[],people:[],mods:[]};
function ffGroup(rows,kind){
  const mods=FF_MODS[kind].map(([cat,label])=>({cat,label,rows:[]}));
  rows.forEach(r=>{ const cn=r.monitored_accounts.account_categories.name; let m=mods.find(x=>x.cat.toLowerCase()===String(cn).toLowerCase()); if(!m){ m={cat:cn,label:cn,rows:[]}; mods.push(m); } m.rows.push(r); });
  mods.forEach(m=>m.rows.sort((a,b)=>a.monitored_accounts.sort_order-b.monitored_accounts.sort_order||a.monitored_accounts.description.localeCompare(b.monitored_accounts.description)));
  return mods;
}
async function renderFF(kind){
  const cid=$("companySel").value, ym=$("period").value, title=FF_TITLE[kind];
  const head=`<div class="mh"><h2>${title}</h2><div class="mh-nav"><button class="btn sm sec" id="mprev">‹ Mês anterior</button><button class="btn sm sec" id="mnext">Mês seguinte ›</button></div></div>`;
  if(!cid||!ym){ $("view").innerHTML=head+'<div class="card">Selecione a empresa e a competência no cabeçalho.</div>'; return; }
  const [y,m]=ym.split("-").map(Number), co=state.companies.find(c=>c.id===cid);
  $("view").innerHTML=head+`<p style="margin:0 0 10px;color:var(--mut)">${esc(co?.legal_name||"")} · ${MESES[m-1]} de ${y}</p><div id="mbody">Carregando…</div>`;
  const {data:per,error}=await sb.from("monthly_periods").select("*").eq("company_id",cid).eq("year",y).eq("month",m).maybeSingle();
  if(error){ $("mbody").textContent="Erro ao carregar: "+error.message; return; }
  if(!per){
    const can=["admin","supervisor"].includes(state.profile.role);
    $("mbody").innerHTML=`<div class="card">Esta competência ainda não foi aberta.${can?` <button class="btn sm" id="mcreate" style="margin-left:8px">Criar competência de ${MESES[m-1]}/${y}</button>`:""}</div>`;
    if(can) $("mcreate").onclick=()=>createPanel(cid,y,m); return;
  }
  const [rs,pf]=await Promise.all([
    sb.from("monthly_account_records").select("id,status,final_balance,responsible_id,notes,monitored_accounts!inner(id,description,account_number,accounting_code,sort_order,account_categories!inner(name,kind))").eq("period_id",per.id),
    sb.from("profiles").select("id,full_name,email").eq("active",true).order("full_name")]);
  if(rs.error||pf.error){ $("mbody").textContent="Erro ao carregar: "+(rs.error||pf.error).message; return; }
  FF={kind,per,people:pf.data,rows:rs.data.filter(r=>r.monitored_accounts.account_categories.kind===kind)};
  drawFF();
}
const ffPeople=(sel)=>'<option value="">—</option>'+FF.people.map(p=>`<option value="${esc(p.id)}"${p.id===sel?" selected":""}>${esc(p.full_name||p.email)}</option>`).join("");
const ffStatus=(sel)=>STV(sel).map(([k,v])=>`<option value="${k}"${k===sel?" selected":""}>${v[0]}</option>`).join("");
function rowFF(r,dis,ed){
  const a=r.monitored_accounts, fixed=(c,val)=>ed?`<td><input data-e="${c}" value="${esc(val)}" maxlength="${c==="description"?200:60}"></td>`:`<td>${esc(val||"—")}</td>`;
  const cell=(c)=>c==="description"?fixed(c,a.description):c==="number"?fixed(c,a.account_number||""):c==="code"?fixed(c,a.accounting_code||""):
    c==="balance"?`<td class="r"><input class="num" data-f="final_balance" value="${fmtNum(r.final_balance)}" placeholder="não informado" inputmode="decimal" ${dis}></td>`:
    c==="status"?`<td><select class="s-${ST[r.status][1]}" data-f="status" ${dis}>${ffStatus(r.status)}</select></td>`:
    c==="resp"?`<td><select data-f="responsible_id" ${dis}>${ffPeople(r.responsible_id)}</select></td>`:
    `<td><input data-f="notes" value="${esc(r.notes||"")}" maxlength="500" ${dis}></td>`;
  const act=dis?"":ed?'<button class="lnk" data-a="esave">Salvar</button> <button class="lnk" data-a="ecancel">Cancelar</button>':'<button class="lnk" data-a="edit">Editar</button> <button class="lnk" data-a="del">Remover</button>';
  return `<tr data-id="${esc(r.id)}">${FF_COLS[FF.kind].map(cell).join("")}<td class="nw">${act}</td></tr>`;
}
function ffDraftCell(col){
  if(col==="description") return '<td><input id="dr_desc" placeholder="Descrição" maxlength="200"></td>';
  if(col==="number") return '<td><input id="dr_num" placeholder="Nº conta" maxlength="60"></td>';
  if(col==="code") return '<td><input id="dr_code" placeholder="C. contábil" maxlength="60"></td>';
  if(col==="balance") return '<td class="r"><input class="num" id="dr_bal" placeholder="0,00" inputmode="decimal"></td>';
  if(col==="status") return `<td><select id="dr_st">${ffStatus("pendente")}</select></td>`;
  if(col==="resp") return `<td><select id="dr_resp">${ffPeople("")}</select></td>`;
  return '<td><input id="dr_notes" placeholder="Observações" maxlength="500"></td>';
}
function ffTiles(mods){
  if(FF.kind!=="appropriation") return "";
  return `<div class="tiles">`+mods.filter(m=>FF_ICON[m.label]).map((m,i)=>{ const n=m.rows.length, pl=FF_PLURAL[m.label];
    return `<button type="button" class="sqtile" data-go="${i}" aria-label="${n} ${n===1?pl[0]:pl[1]}"><svg viewBox="0 0 24 24" aria-hidden="true">${FF_ICON[m.label]}</svg><b>${n}</b><small>${n===1?pl[0]:pl[1]}</small></button>`;}).join("")+"</div>";
}
function drawFF(){
  const locked=FF.per.status==="encerrada", dis=locked?"disabled":"", mods=ffGroup(FF.rows,FF.kind), cols=FF_COLS[FF.kind]; FF.mods=mods;
  let h=(locked?'<div class="card" style="border-left:4px solid var(--warn)">Competência encerrada: alterações bloqueadas.</div>':"")+'<div id="ff_sum" class="pills"></div>'+ffTiles(mods);
  mods.forEach((md,i)=>{
    h+=`<div class="card tbl wide" id="ffm-${i}"><h3>${esc(md.label)} <span class="ct" id="fft-${i}"></span></h3><table class="mt" style="min-width:820px"><thead><tr>${cols.map(c=>`<th class="${c==="balance"?"r":""}">${FF_HEAD[c]}</th>`).join("")}<th></th></tr></thead>
      <tbody id="ffb-${i}">${md.rows.map(r=>rowFF(r,dis,false)).join("")}</tbody></table>${locked?"":`<p style="margin:10px 0 0"><button class="btn sm sec" data-a="add" data-m="${i}">+ Adicionar item</button></p>`}</div>`; });
  $("mbody").innerHTML=h; $("mbody").onchange=onFFChange; $("mbody").onclick=onFFClick;
  $("mbody").onkeydown=(e)=>{ if(e.key==="Enter"&&e.target.closest(".draft")&&e.target.tagName==="INPUT") saveFF(); };
  ffSummary();
}
function ffSummary(){
  const rs=FF.rows, ap=rs.filter(r=>r.status!=="nao_aplicavel"), n=(s)=>rs.filter(r=>r.status===s).length, done=n("concluido");
  $("ff_sum").innerHTML=`<span>Itens <b>${rs.length}</b></span><span>Concluídos <b>${done}</b></span><span>Pendentes <b>${n("pendente")}</b></span><span>Em andamento <b>${n("em_andamento")}</b></span><span>Não aplicável <b>${n("nao_aplicavel")}</b></span><span>Conclusão <b>${ap.length?Math.round(done/ap.length*100)+"%":"—"}</b></span>`;
  FF.mods.forEach((md,i)=>{ const v=md.rows.filter(r=>r.status!=="nao_aplicavel"&&r.final_balance!=null); if($("fft-"+i)) $("fft-"+i).textContent=md.rows.length?"Total: "+brl(v.reduce((s,r)=>s+cents(r.final_balance),0)/100):""; });
}
async function onFFChange(e){
  const el=e.target.closest("[data-f]"), tr=e.target.closest("tr[data-id]"); if(!el||!tr) return;
  const r=FF.rows.find(x=>x.id===tr.dataset.id), f=el.dataset.f; let v=el.value;
  const undo=()=>{ if(f==="final_balance") el.value=fmtNum(r.final_balance); else el.value=r[f]??""; };
  if(f==="final_balance"){ v=parseBRL(v); if(v===undefined){ toast("Valor inválido. Use o formato 1.234,56."); undo(); return; } } else v=v.trim()||null;
  const {error}=await sb.from("monthly_account_records").update({[f]:v}).eq("id",r.id);
  if(error){ toast("Não foi possível salvar: "+error.message); undo(); return; }
  r[f]=v; if(f==="final_balance") el.value=fmtNum(v); if(f==="status"&&!el.classList.contains("stsel")) el.className="s-"+ST[v][1]; ffSummary(); toast("Salvo.");
}
async function onFFClick(e){
  const go=e.target.closest("[data-go]"); if(go){ $("ffm-"+go.dataset.go)?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const b=e.target.closest("button[data-a]"); if(!b) return; const a=b.dataset.a, tr=b.closest("tr");
  if(a==="cancel"){ document.querySelector(".draft")?.remove(); return; }
  if(a==="add"){
    document.querySelector(".draft")?.remove(); const i=b.dataset.m;
    $("ffb-"+i).insertAdjacentHTML("beforeend",`<tr class="draft" data-m="${i}">${FF_COLS[FF.kind].map(ffDraftCell).join("")}<td class="nw"><button class="lnk" data-a="save">Salvar</button> <button class="lnk" data-a="cancel">Cancelar</button></td></tr>`);
    $("dr_desc").focus(); return;
  }
  if(a==="save") return saveFF();
  const r=tr&&FF.rows.find(x=>x.id===tr.dataset.id); if(!r) return;
  if(a==="edit"){ tr.outerHTML=rowFF(r,"",true); document.querySelector('tr[data-id="'+r.id+'"] [data-e="description"]')?.focus(); return; }
  if(a==="ecancel"){ tr.outerHTML=rowFF(r,"",false); return; }
  if(a==="esave"){
    const g=(k)=>tr.querySelector(`[data-e="${k}"]`), ac=r.monitored_accounts, d=g("description").value.trim(), c=g("code").value.trim(), num=g("number")?g("number").value.trim():(ac.account_number||"");
    if(!d){ toast("A descrição não pode ficar vazia."); return; }
    const {error}=await sb.rpc("update_ff_item",{p_record:r.id,p_description:d,p_code:c,p_number:num});
    if(error){ toast(error.message); return; }
    ac.description=d; ac.accounting_code=c||null; ac.account_number=num||null; tr.outerHTML=rowFF(r,"",false); toast("Salvo."); return;
  }
  if(a==="del"){
    if(!confirm(`Remover "${r.monitored_accounts.description}"? Ele deixa de entrar nos próximos meses.`)) return;
    const {data,error}=await sb.rpc("remove_ff_item",{p_record:r.id});
    if(error){ toast("Não foi possível remover: "+error.message); return; }
    toast(data==="removed"?"Item removido.":"O item já tem dados: continua neste mês, mas não entra nos próximos."); renderFF(FF.kind);
  }
}
async function saveFF(){
  const dr=document.querySelector(".draft"); if(!dr) return;
  const desc=$("dr_desc").value.trim(), bal=$("dr_bal")?parseBRL($("dr_bal").value):null;
  if(!desc){ toast("Informe a descrição."); $("dr_desc").focus(); return; }
  if(bal===undefined){ toast("Valor inválido. Use o formato 1.234,56."); $("dr_bal").focus(); return; }
  const md=FF.mods[Number(dr.dataset.m)];
  const {data,error}=await sb.rpc("add_ff_item",{p_period:FF.per.id,p_kind:FF.kind,p_category:md.cat,p_description:desc,p_number:$("dr_num")?$("dr_num").value.trim():"",p_code:$("dr_code").value.trim(),p_status:$("dr_st").value,p_resp:$("dr_resp").value||null,p_balance:bal});
  if(error){ toast("Não foi possível adicionar: "+error.message); return; }
  const nt=$("dr_notes").value.trim();
  if(nt&&data){ const u=await sb.from("monthly_account_records").update({notes:nt}).eq("id",data); if(u.error) toast("Item criado, mas a observação não foi salva: "+u.error.message); }
  toast(FF.kind==="appropriation"?"Item adicionado e replicado para os próximos meses abertos.":"Item adicionado."); renderFF(FF.kind);

const AV_RE=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
function setAvatar(){
  const p=state.profile||{}, nm=String(p.full_name||p.email||"?").trim(), ok=!!(p.avatar&&AV_RE.test(p.avatar));
  document.querySelectorAll(".avatar").forEach(el=>{ el.style.backgroundImage=ok?`url(${p.avatar})`:""; el.classList.toggle("photo",ok); el.textContent=ok?"":(nm[0]||"?").toUpperCase(); });
}
const uiSaved=()=>{ try{ return JSON.parse(localStorage.getItem("ui_prefs")||"null"); }catch(e){ return null; } };
function uiCur(){ const r=document.documentElement; return {layout:r.dataset.layout==="2"?"2":"1",theme:r.dataset.theme==="dark"?"dark":"light"}; }
function uiBoot(p){
  const prefs=p&&p.ui_prefs; if(prefs&&typeof prefs==="object"){
    const r=document.documentElement; r.dataset.layout=prefs.layout==="2"?"2":"1"; r.dataset.theme=prefs.theme==="dark"?"dark":"light";
    try{ localStorage.setItem("ui_prefs",JSON.stringify({layout:r.dataset.layout,theme:r.dataset.theme}));
      if(prefs.dash&&!localStorage.getItem(dashKey())) localStorage.setItem(dashKey(),JSON.stringify(prefs.dash));
      if(localStorage.getItem("agenda_hidden")===null&&prefs.agendaHidden) localStorage.setItem("agenda_hidden","1"); }catch(e){}
  }
  setAvatar();
}
function uiMark(){
  const sv=uiSaved()||{layout:"1",theme:"light"}, c=uiCur(), dirty=sv.layout!==c.layout||sv.theme!==c.theme;
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===c.theme)));
  document.querySelectorAll("[data-layout-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.layoutSet===c.layout)));
  const h=$("ui_hint"); if(h){ h.textContent=dirty?"Há alterações não salvas. Clique em Salvar layout para mantê-las.":"Layout salvo."; h.className=dirty?"gmsg warnp":"gmsg"; }
  const d=$("ui_discard"); if(d) d.disabled=!dirty;
}
function setTheme(t){ document.documentElement.dataset.theme=t==="dark"?"dark":"light"; uiMark(); }
function setLayout(l){ document.documentElement.dataset.layout=l==="2"?"2":"1"; uiMark(); }
async function uiSave(){
  const prefs={...uiCur(),agendaHidden:document.body.classList.contains("noright"),dash:dashLoad()};
  try{ localStorage.setItem("ui_prefs",JSON.stringify({layout:prefs.layout,theme:prefs.theme})); localStorage.removeItem("theme"); }catch(e){}
  const {error}=await sb.from("profiles").update({ui_prefs:prefs}).eq("id",state.profile.id);
  if(error) toast(/ui_prefs/.test(error.message)?"Salvo neste navegador. Para salvar na sua conta, rode o arquivo 016_foto_e_layout.sql no Supabase.":"Salvo neste navegador, mas não foi possível salvar na conta: "+error.message);
  else { state.profile.ui_prefs=prefs; toast("Layout salvo na sua conta."); }
  uiMark();
}
function uiDiscard(){ const sv=uiSaved()||{layout:"1",theme:"light"}; setLayout(sv.layout); setTheme(sv.theme); }
async function avatarSave(url){
  const {error}=await sb.from("profiles").update({avatar:url}).eq("id",state.profile.id);
  if(error){ toast(/avatar/.test(error.message)?"O campo da foto ainda não existe. Rode o arquivo 016_foto_e_layout.sql no Supabase.":"Não foi possível salvar a foto: "+error.message); return; }
  state.profile.avatar=url; setAvatar(); toast(url?"Foto atualizada.":"Foto removida.");
  document.querySelectorAll(".av-opt").forEach(b=>{ const on=AVATAR_PRESETS[Number(b.dataset.av)]===url; b.classList.toggle("on",on); b.setAttribute("aria-checked",String(on)); });
}
async function avatarPick(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("Escolha um arquivo de imagem."); return; }
  if(file.size>10e6){ toast("A imagem é muito grande (máximo 10 MB)."); return; }
  let bmp; try{ bmp=await createImageBitmap(file,{imageOrientation:"from-image"}); }catch(e){ toast("Não foi possível ler essa imagem."); return; }
  const c=document.createElement("canvas"); c.width=c.height=256; const x=c.getContext("2d"), s=Math.min(bmp.width,bmp.height);
  x.fillStyle="#fff"; x.fillRect(0,0,256,256); x.drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,256,256);
  let q=.85, url=c.toDataURL("image/jpeg",q); while(url.length>150000&&q>.4){ q-=.1; url=c.toDataURL("image/jpeg",q); }
  await avatarSave(url);
}
function themeCard(){
  const c=uiCur();
  return `<div class="card" id="th_card"><h3>Perfil, layout e aparência</h3>
    <div class="who" style="margin-bottom:14px"><div class="avatar big" aria-hidden="true">?</div><div><b>Foto de perfil</b><small>Imagem quadrada funciona melhor. Ela é reduzida automaticamente.</small>
      <p style="margin:10px 0 6px;font-size:13px;color:var(--mut)">Escolha um dos avatares ou envie sua própria foto:</p>
      <div class="av-grid" role="radiogroup" aria-label="Avatares prontos">${AVATAR_PRESETS.map((u,i)=>`<button type="button" class="av-opt${state.profile?.avatar===u?" on":""}" data-av="${i}" role="radio" aria-checked="${state.profile?.avatar===u}" aria-label="Avatar ${i+1}"><img src="${u}" alt=""></button>`).join("")}</div>
      <div class="bar" style="margin:8px 0 0"><label class="btn sm sec" style="cursor:pointer">Escolher foto<input type="file" id="avatarFile" accept="image/*" style="display:none"></label><button type="button" class="btn sm sec" id="avatarDel">Remover foto</button></div></div></div>
    <p style="margin:0 0 6px;font-weight:600">Layout</p>
    <div class="lay-opts"><button type="button" class="lay-opt" data-layout-set="1" aria-pressed="${c.layout==="1"}"><span class="lay-prev l1"><i></i><b></b><em></em></span><span>Layout 1 · Azul</span></button>
      <button type="button" class="lay-opt" data-layout-set="2" aria-pressed="${c.layout==="2"}"><span class="lay-prev l2"><i></i><b></b><em></em></span><span>Layout 2 · Roxo</span></button></div>
    <p style="margin:14px 0 6px;font-weight:600">Cor do sistema</p>
    <div class="bar" style="margin:0"><button type="button" class="btn sec themebtn" data-theme-set="light" aria-pressed="${c.theme==="light"}" aria-label="Tema claro" title="Tema claro"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> Claro</button>
    <button type="button" class="btn sec themebtn" data-theme-set="dark" aria-pressed="${c.theme==="dark"}" aria-label="Tema escuro" title="Tema escuro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg> Escuro</button></div>
    <div class="bar" style="margin:16px 0 0"><button type="button" class="btn" id="ui_save">Salvar layout</button><button type="button" class="btn sec" id="ui_discard">Descartar alterações</button></div>
    <p class="gmsg" id="ui_hint"></p></div>`;
}
$("view").addEventListener("click",(e)=>{
  const t=e.target, th=t.closest("[data-theme-set]"), ly=t.closest("[data-layout-set]");
  if(th) return setTheme(th.dataset.themeSet); if(ly) return setLayout(ly.dataset.layoutSet);
  if(t.id==="ui_save") return uiSave(); if(t.id==="ui_discard") return uiDiscard(); if(t.id==="avatarDel") return avatarSave(null);
  const av=t.closest("[data-av]"); if(av) return avatarSave(AVATAR_PRESETS[Number(av.dataset.av)]);
});
$("view").addEventListener("change",(e)=>{ if(e.target.id==="avatarFile"){ avatarPick(e.target.files[0]); e.target.value=""; } });

/* ============ AGENDA (calendário lateral + Google Agenda) ============ */
const GCAL_SCOPE="https://www.googleapis.com/auth/calendar.readonly";
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const ymd=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
let CAL={y:0,m:0,sel:"",events:[],upcoming:[],token:null,exp:0,status:"off",msg:"",tc:null};
function calInit(){
  const n=new Date(); CAL.y=n.getFullYear(); CAL.m=n.getMonth(); CAL.sel=ymd(n);
  const nm=($("whoName").textContent||"").trim(); setAvatar();
  try{ if(localStorage.getItem("agenda_hidden")==="1") document.body.classList.add("noright"); }catch(e){}
  calRender();
}
function gcalForget(){ CAL.token=null; CAL.events=[]; CAL.upcoming=[]; CAL.status="off"; CAL.msg=""; }
function evDays(ev){
  const out=[];
  if(ev.start&&ev.start.date){ const s=new Date(ev.start.date+"T00:00:00"), e=new Date((ev.end&&ev.end.date||ev.start.date)+"T00:00:00");
    for(let d=new Date(s);d<e&&out.length<62;d.setDate(d.getDate()+1)) out.push(ymd(d)); if(!out.length) out.push(ev.start.date); }
  else if(ev.start&&ev.start.dateTime) out.push(ymd(new Date(ev.start.dateTime)));
  return out;
}
function calDayMap(){ const m=new Map(); CAL.events.forEach(ev=>evDays(ev).forEach(d=>{ if(!m.has(d)) m.set(d,[]); m.get(d).push(ev); })); return m; }
function evTime(ev){
  if(ev.start&&ev.start.dateTime){ const t=(s)=>new Date(s).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); return t(ev.start.dateTime)+(ev.end&&ev.end.dateTime?" às "+t(ev.end.dateTime):""); }
  return "Dia inteiro";
}
function evCard(ev,withDate){
  const d=evDays(ev)[0], dl=d?d.split("-").reverse().slice(0,2).join("/"):"";
  return `<div class="ev"><b>${esc(ev.summary||"(sem título)")}</b><small>${withDate?esc(dl)+" · ":""}${esc(evTime(ev))}${ev.location?" · "+esc(ev.location):""}</small>${ev.htmlLink&&/^https:\/\//.test(ev.htmlLink)?` <a href="${esc(ev.htmlLink)}" target="_blank" rel="noopener">Abrir no Google Agenda</a>`:""}</div>`;
}
function calRender(){
  const first=new Date(CAL.y,CAL.m,1), lead=first.getDay(), dim=new Date(CAL.y,CAL.m+1,0).getDate(), map=calDayMap(), today=ymd(new Date());
  $("calTitle").textContent=`${MESES[CAL.m]} de ${CAL.y}`;
  let h=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<Math.ceil((lead+dim)/7)*7;i++){
    const d=new Date(CAL.y,CAL.m,1-lead+i), k=ymd(d), has=map.has(k);
    h+=`<button type="button" class="cd${d.getMonth()!==CAL.m?" o":""}${k===today?" t":""}${k===CAL.sel?" s":""}" data-d="${k}" aria-label="${d.toLocaleDateString("pt-BR",{day:"numeric",month:"long"})}${has?", com compromissos":""}">${d.getDate()}${has?"<i></i>":""}</button>`;
  }
  $("calGrid").innerHTML=h;
  const dayEv=map.get(CAL.sel)||[], ok=CAL.status==="ok";
  $("calList").innerHTML=`<h4>${new Date(CAL.sel+"T00:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</h4>`+
    (ok?(dayEv.length?dayEv.map(e=>evCard(e,false)).join(""):'<span class="mut">Nenhum compromisso neste dia.</span>'):'<span class="mut">Conecte o Google Agenda para ver seus compromissos.</span>')+
    (ok?`<h4>Próximos compromissos</h4>`+(CAL.upcoming.length?CAL.upcoming.map(e=>evCard(e,true)).join(""):'<span class="mut">Nada nos próximos dias.</span>'):"");
  calStat();
}
function calStat(){
  const s=CAL.status; let h="";
  if(s==="ok") h='<span class="gok">● Google Agenda conectado</span> <button class="lnk" id="grefresh">Atualizar</button> <button class="lnk" id="gdisc">Desconectar</button>';
  else if(s==="loading") h='<span class="mut">Carregando a agenda…</span>';
  else h=`<button class="btn sm" id="gconn">${s==="err"?"Reconectar":"Conectar Google Agenda"}</button>`;
  if(CAL.msg==="config") h+='<p class="gmsg">Para ligar o Google Agenda, configure o ID de cliente do Google (<b>GOOGLE_CLIENT_ID</b>) no início do index.html. O passo a passo está no README.</p>';
  else if(CAL.msg) h+=`<p class="gmsg">${esc(CAL.msg)}</p>`;
  $("gstat").innerHTML=h;
}
async function gcalLoad(){
  if(!CAL.token||Date.now()>CAL.exp){ CAL.token=null; CAL.status="err"; CAL.msg="A sessão do Google expirou. Clique em Reconectar."; calRender(); return; }
  CAL.status="loading"; calStat();
  try{
    const a=new Date(CAL.y,CAL.m,1-new Date(CAL.y,CAL.m,1).getDay()), b=new Date(CAL.y,CAL.m+1,0); b.setDate(b.getDate()+8);
    const url=(o)=>"https://www.googleapis.com/calendar/v3/calendars/primary/events?"+new URLSearchParams({singleEvents:"true",orderBy:"startTime",maxResults:"250",...o});
    const get=async(u)=>{ const r=await fetch(u,{headers:{Authorization:"Bearer "+CAL.token}}); if(r.status===401){ const e=new Error("expired"); e.code=401; throw e; }
      const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||("Erro "+r.status)); return j.items||[]; };
    const [month,up]=await Promise.all([get(url({timeMin:a.toISOString(),timeMax:b.toISOString()})),get(url({timeMin:new Date().toISOString(),maxResults:"6"}))]);
    CAL.events=month; CAL.upcoming=up; CAL.status="ok"; CAL.msg="";
  }catch(e){ if(e.code===401) CAL.token=null; CAL.status="err"; CAL.msg=e.code===401?"A sessão do Google expirou. Clique em Reconectar.":"Não foi possível ler a agenda: "+(e.message||e); }
  calRender();
}
async function gcalConnect(){
  if(GOOGLE_CLIENT_ID.startsWith("COLE")){ CAL.msg="config"; calStat(); return; }
  try{ await loadScript("https://accounts.google.com/gsi/client"); }catch(e){ CAL.status="err"; CAL.msg="Não foi possível carregar o login do Google (conexão ou bloqueador de anúncios)."; calStat(); return; }
  if(!CAL.tc) CAL.tc=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:GCAL_SCOPE,
    callback:(r)=>{ if(r.error){ CAL.status="err"; CAL.msg="Acesso não autorizado: "+(r.error_description||r.error); calStat(); return; }
      CAL.token=r.access_token; CAL.exp=Date.now()+(Number(r.expires_in)||3600)*1000-30000; gcalLoad(); },
    error_callback:(e)=>{ CAL.status="err"; CAL.msg=e&&e.type==="popup_closed"?"A janela do Google foi fechada antes de concluir.":"Falha no login do Google ("+((e&&e.type)||"erro")+")."; calStat(); }});
  CAL.tc.requestAccessToken({prompt:""});
}
function calMonth(d){ CAL.m+=d; if(CAL.m<0){ CAL.m=11; CAL.y--; } if(CAL.m>11){ CAL.m=0; CAL.y++; } CAL.sel=ymd(new Date(CAL.y,CAL.m,1)); if(CAL.token&&CAL.status==="ok") gcalLoad(); else calRender(); }
$("right").addEventListener("click",(e)=>{
  const t=e.target, day=t.closest(".cd"); if(day){ CAL.sel=day.dataset.d; const d=new Date(CAL.sel+"T00:00:00");
    if(d.getMonth()!==CAL.m){ CAL.y=d.getFullYear(); CAL.m=d.getMonth(); if(CAL.token&&CAL.status==="ok") return gcalLoad(); } calRender(); return; }
  if(t.id==="calPrev") return calMonth(-1); if(t.id==="calNext") return calMonth(1);
  if(t.id==="calToday"){ const n=new Date(); CAL.y=n.getFullYear(); CAL.m=n.getMonth(); CAL.sel=ymd(n); if(CAL.token&&CAL.status==="ok") gcalLoad(); else calRender(); return; }
  if(t.id==="gconn") return gcalConnect(); if(t.id==="grefresh") return gcalLoad();
  if(t.id==="gdisc"){ const tk=CAL.token; try{ if(tk&&window.google) google.accounts.oauth2.revoke(tk,()=>{}); }catch(e){} gcalForget(); calRender(); }
});
function agendaToggle(){
  if(window.innerWidth>=1200){ const hide=document.body.classList.toggle("noright"); try{ localStorage.setItem("agenda_hidden",hide?"1":"0"); }catch(e){} }
  else document.body.classList.toggle("agenda-open");
}
["agendaToggle","agendaClose","agendaOpen"].forEach(id=>$(id).addEventListener("click",agendaToggle));

/* ============ ORDENAÇÃO RÁPIDA EM TODAS AS TABELAS ============ */
const gcol=new Intl.Collator("pt-BR",{numeric:true,sensitivity:"base"});
function gsNum(v){
  let s=String(v).trim().replace(/R\$|\s|%/g,""), neg=false;
  if(/^-+$/.test(s)) return 0;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); } if(s.startsWith("-")){ neg=!neg; s=s.slice(1); }
  let n=null;
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) n=Number(s.replace(/\./g,"").replace(",","."));
  else if(/^\d+(,\d+)?$/.test(s)) n=Number(s.replace(",","."));
  else if(/^\d+\.\d+$/.test(s)) n=Number(s);
  return n===null||!isFinite(n)?null:(neg?-n:n);
}
function gsDate(v){
  let m=String(v).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})(?:[ ,]+(\d{2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m) return Date.UTC(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=String(v).trim().match(/^(\d{2})\/(\d{4})$/); return m?Date.UTC(+m[2],+m[1]-1,1):null;
}
const gsEmpty=(v)=>!v||v==="—"||v==="-";
function gsVal(cell){
  if(!cell) return "";
  const f=cell.querySelector("input:not([type=checkbox]):not([type=radio]),select,textarea");
  if(f) return f.tagName==="SELECT"?(f.selectedOptions[0]?f.selectedOptions[0].text:""):f.value;
  return cell.textContent;
}
function gsEnhance(){
  document.querySelectorAll("#view table:not([data-gs])").forEach(t=>{
    t.dataset.gs="1"; const head=t.tHead&&t.tHead.rows[t.tHead.rows.length-1]; if(!head||!t.tBodies[0]) return;
    [...head.cells].forEach(th=>{ const txt=th.textContent.trim();
      if(!txt||th.dataset.sort||th.colSpan>1||/^a[çc][õo]es$/i.test(txt)) return;
      th.classList.add("gs"); th.tabIndex=0; th.setAttribute("aria-sort","none"); th.title="Clique para ordenar"; });
  });
}
function gsSort(th){
  const table=th.closest("table"), idx=th.cellIndex, body=table.tBodies[0]; if(!body) return;
  const dir=th.getAttribute("aria-sort")==="ascending"?-1:1;
  const groups=[]; let cur={head:null,rows:[]}; groups.push(cur);
  [...body.rows].forEach(tr=>{ if(tr.classList.contains("catrow")){ cur={head:tr,rows:[]}; groups.push(cur); } else if(!tr.classList.contains("draft")) cur.rows.push(tr); });
  const vals=groups.flatMap(g=>g.rows).map(tr=>gsVal(tr.cells[idx]).trim()).filter(v=>!gsEmpty(v));
  const isNum=vals.length>0&&vals.every(v=>gsNum(v)!==null), isDate=!isNum&&vals.length>0&&vals.every(v=>gsDate(v)!==null);
  const key=(tr)=>{ const v=gsVal(tr.cells[idx]).trim(); return gsEmpty(v)?null:isNum?gsNum(v):isDate?gsDate(v):v; };
  groups.forEach(g=>{ const k=g.rows.map(tr=>({tr,k:key(tr)}));
    k.sort((a,b)=>{ if(a.k===null||b.k===null) return a.k===b.k?0:(a.k===null?1:-1); return dir*((isNum||isDate)?a.k-b.k:gcol.compare(a.k,b.k)); });
    g.rows=k.map(x=>x.tr); });
  const drafts=[...body.querySelectorAll("tr.draft")];
  groups.forEach(g=>{ if(g.head) body.appendChild(g.head); g.rows.forEach(tr=>body.appendChild(tr)); }); drafts.forEach(tr=>body.appendChild(tr));
  table.querySelectorAll("th.gs").forEach(h=>h.setAttribute("aria-sort",h===th?(dir===1?"ascending":"descending"):"none"));
  th.title=((isNum||isDate)?(dir===1?"Crescente":"Decrescente"):(dir===1?"A–Z":"Z–A"))+" (clique para inverter)";
}
$("view").addEventListener("click",(e)=>{ const th=e.target.closest("th.gs"); if(th) gsSort(th); });
$("view").addEventListener("keydown",(e)=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("th.gs")){ e.preventDefault(); gsSort(e.target); } });
let gsRaf=0; new MutationObserver(()=>{ if(gsRaf) return; gsRaf=requestAnimationFrame(()=>{ gsRaf=0; gsEnhance(); }); }).observe($("view"),{childList:true,subtree:true});

init();
</script>
