<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>try{const p=JSON.parse(localStorage.getItem("ui_prefs")||"null")||{},r=document.documentElement;r.dataset.theme=(p.theme||localStorage.getItem("theme"))==="dark"?"dark":"light";r.dataset.layout=p.layout==="2"?"2":"1";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento contabilidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#14284b;--blue:#4f6bed;--blue-l:#e8ecfe;--bg:#f1f3fc;--card:#fff;--line:#e2e6f4;--tx:#1b2140;--mut:#6b7392;--side:#131a3b;
--ok:#1f8a4c;--err:#c43232;--warn:#d98a12}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--tx);background:linear-gradient(135deg,#d7dcf8 0%,#eceffc 60%,#e3e7fb 100%) fixed}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;width:100%;max-width:360px;overflow:hidden}
.box h1{margin:0;padding:18px 20px;background:#14284b;color:#fff;font-size:16px;font-weight:600}
.box form{padding:20px;display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:500}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--tx)}
.btn{padding:9px 14px;border:0;border-radius:4px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);font-weight:500}
.msg{color:var(--err);min-height:1.2em;font-size:13px}
/* app */
#app{display:grid;grid-template-columns:240px minmax(0,1fr) 330px;height:calc(100% - 28px);margin:14px;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:0 20px 60px rgba(40,50,120,.22)}
#side{background:var(--side);color:#c9d0f2;display:flex;flex-direction:column;padding:20px 12px 14px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;color:#fff}
.brand svg{width:30px;height:30px;stroke:#8ea0ff;fill:none;stroke-width:2;flex:none}
.brand b{display:block;font-size:15px;line-height:1.1}.brand span{font-size:12px;opacity:.7}
#nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;min-height:0}
#nav a{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#aab3de;text-decoration:none;font-weight:500}
#nav a svg{width:19px;height:19px;stroke:#8f9bd6;fill:none;stroke-width:1.8;flex:none}
#nav a:hover{background:rgba(255,255,255,.07);color:#fff}
#nav a[aria-current=page]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
#nav a[aria-current=page] svg{stroke:#fff}
#nav a[aria-current=page]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:#8ea0ff}
.side-out{display:flex;align-items:center;gap:12px;margin-top:8px;padding:11px 14px;border:0;border-radius:12px;background:transparent;color:#aab3de;cursor:pointer;font-weight:500;text-align:left}
.side-out svg{width:19px;height:19px;stroke:#8f9bd6;fill:none;stroke-width:1.8;flex:none}.side-out:hover{background:rgba(255,255,255,.07);color:#fff}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#center>header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 26px 6px}
.hf{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:6px 12px;color:var(--mut);font-size:12px;font-weight:500;box-shadow:0 2px 8px rgba(40,50,110,.06)}
.hf select,.hf input{border:0;background:transparent;padding:4px 2px;color:var(--tx);font-weight:600;font-size:14px;border-radius:6px;max-width:240px}
.grow{flex:1}
.iconbtn{width:40px;height:40px;border:0;border-radius:12px;background:var(--card);color:var(--tx);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(40,50,110,.06)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
main{padding:10px 26px 26px;overflow:auto;flex:1;min-height:0}
main h2{margin:0 0 14px;font-size:22px;font-weight:600}
#right{background:var(--card);border-left:1px solid var(--line);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:18px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;max-width:760px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--blue)}
table{border-collapse:collapse;width:100%}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.tag.ok{background:#dff3e6;color:var(--ok)}.tag.err{background:#f9e0e0;color:var(--err)}.tag.warn{background:#fcefd5;color:#9a5f00}
#toast{position:fixed;right:16px;bottom:16px;background:#14284b;color:#fff;padding:10px 14px;border-radius:4px;max-width:320px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input[type=search]{flex:1;min-width:220px}
.card.tbl{max-width:none;overflow-x:auto}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;padding:2px 6px;font-weight:500}.lnk:hover{text-decoration:underline}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
dialog{border:1px solid var(--line);border-radius:6px;padding:0;width:min(480px,94vw)}
dialog::backdrop{background:rgba(20,40,75,.45)}
dialog form{padding:18px;display:grid;gap:12px}dialog h3{margin:0;color:var(--navy);font-size:16px}
textarea{padding:8px 10px;border:1px solid var(--line);border-radius:4px;font:inherit;resize:vertical;background:var(--card);color:var(--tx)}
.row{display:flex;justify-content:flex-end;gap:8px}
.tag.mut{background:#e8ebef;color:#5b6674}
.pills{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;color:var(--mut);font-size:13px}.pills b{color:var(--tx)}
table.mt{min-width:900px}.mt th.r,.mt td.r{text-align:right}.mt thead th{position:sticky;top:0;background:var(--card)}
.mt input,.mt select{width:100%;padding:5px 6px}.mt input.num{text-align:right;min-width:120px}
.catrow td{background:var(--blue-l);font-weight:600;color:var(--navy)}.ct{font-weight:400;color:var(--mut);margin-left:8px}
.s-ok{border-left:4px solid var(--ok)}.s-err{border-left:4px solid var(--err)}.s-warn{border-left:4px solid var(--warn)}.s-mut{border-left:4px solid #9aa4b1}
.big{font-size:24px;font-weight:600;color:var(--navy)}.warnp{color:#9a5f00;margin:6px 0 0}
.card.wide{max-width:none}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:6px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.kpi:hover{background:var(--blue-l)}.kpi b{font-size:22px;color:var(--navy)}.kpi small{color:var(--mut)}
.kpi.k-ok{border-top-color:var(--ok)}.kpi.k-err{border-top-color:var(--err)}.kpi.k-warn{border-top-color:var(--warn)}
.hb{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;margin:6px 0}.hb>div{background:#e9edf2;height:12px;border-radius:6px;overflow:hidden}
.hb i{display:block;height:100%;border-left:0}.hb i.s-ok{background:var(--ok)}.hb i.s-err{background:var(--err)}.hb i.s-warn{background:var(--warn)}.hb i.s-mut{background:#9aa4b1}.hb b{text-align:right}
.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.donut::before{content:"";position:absolute;inset:14px;background:var(--card);border-radius:50%}.donut span{position:relative;font-weight:600;font-size:20px;color:var(--navy)}
.mt th[data-sort]{cursor:pointer;user-select:none}.mt th[data-sort]:hover{background:var(--blue-l)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;min-width:150px;text-align:left}
.tile svg{width:24px;height:24px;stroke:var(--blue);fill:none;stroke-width:1.8;flex:none}.tile b{font-size:20px;color:var(--navy);display:block;line-height:1.1}.tile small{color:var(--mut)}
.tile:hover{background:var(--bg)}.tile[aria-pressed=true]{background:var(--blue-l);border-color:var(--blue)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 12px;font-size:13px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pos-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center}
.pos-card svg{width:56px;height:56px;fill:none;stroke-width:1.5}.pos-card .pv{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pos-card b{font-size:14px;color:var(--navy)}.pos-card small{color:var(--mut)}.pos-card:hover{background:var(--bg)}.pos-card.off{opacity:.55}
.btn.sm{padding:5px 12px;font-size:12px}.foot{display:flex;justify-content:flex-end;margin:18px 0 6px}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:14px}.dmod{grid-column:span var(--span,6);min-width:0}.dmod .card{margin-bottom:0;max-width:none;height:100%}.dmod .kpis{margin-bottom:0}
.dmod.edit{outline:2px dashed var(--blue);outline-offset:3px;border-radius:6px;cursor:grab}.dmod.edit .kpi{cursor:default}
.dctl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--navy);font-size:13px}.dctl .lnk{padding:2px 6px}
.dhint{margin:0 0 10px;color:var(--mut);font-size:13px}
@media(max-width:1199px){
  #app{grid-template-columns:240px minmax(0,1fr)}
  #right{position:fixed;right:14px;top:14px;bottom:14px;width:min(340px,92vw);z-index:30;border-radius:22px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(20,30,80,.3);transform:translateX(120%);transition:transform .2s}
  body.agenda-open #right{transform:none}
}
@media(min-width:1200px){ body.noright #app{grid-template-columns:240px minmax(0,1fr)} body.noright #right{display:none} }
@media(max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);margin:0;height:100%;border-radius:0}
  #side{flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;gap:6px}
  .brand{padding:0 8px 0 4px}.brand span{display:none}
  #nav{flex-direction:row;overflow-x:auto;flex:1}
  #nav a{white-space:nowrap;padding:9px 12px}#nav a[aria-current=page]::before{display:none}
  .side-out{margin:0;padding:9px 12px}.side-out span{display:none}
  #center>header{padding:12px 14px 4px}main{padding:8px 14px 20px}
}


:root[data-theme="dark"]{--bg:#0e1226;--card:#171c36;--line:#2a3158;--tx:#e8ebfa;--mut:#9aa3c7;--blue-l:#232b57;--blue:#7b8ff5;--navy:#b8c4f5;--side:#0b0f26;--ok:#3fb36f;--err:#e06565;--warn:#e9a53a;color-scheme:dark}
:root[data-theme="dark"] .tag.ok{background:#173a28;color:#6fd69a}:root[data-theme="dark"] .tag.err{background:#4a2020;color:#f08a8a}
:root[data-theme="dark"] .tag.warn{background:#4a3612;color:#f0c26a}:root[data-theme="dark"] .tag.mut{background:#2b3444;color:#aab4c4}
:root[data-theme="dark"] .hb>div{background:#2b3a52}:root[data-theme="dark"] .warnp{color:#f0c26a}
:root[data-theme="dark"] .btn{color:#fff}:root[data-theme="dark"] .btn.sec{color:var(--tx)}
.themebtn{display:inline-flex;align-items:center;gap:8px}.themebtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}.themebtn[aria-pressed=true]{background:var(--blue-l);border-color:var(--blue)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}.mh h2{margin:0}.mh-nav{display:flex;gap:8px;flex-wrap:wrap}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.mstat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:2px;align-content:start}.mstat b{font-size:20px;color:var(--navy);font-weight:600}.mstat small{color:var(--mut)}
.mstat.grow{grid-column:span 2}.mstat.grow input{width:100%}
.nw{white-space:nowrap}.dctl select{padding:3px 6px;font-size:12px}
.sqtile{background:var(--card);border:1px solid var(--line);border-radius:8px;width:128px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.sqtile svg{width:34px;height:34px;stroke:var(--blue);fill:none;stroke-width:1.7}.sqtile b{font-size:24px;color:var(--navy);line-height:1.1}.sqtile small{color:var(--mut)}.sqtile:hover{background:var(--blue-l)}
@media(max-width:900px){.dmod{grid-column:1/-1}}

.drv{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;border:0;background:transparent;cursor:pointer;vertical-align:middle;text-decoration:none}
.drv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}.drv.on{color:var(--blue)}.drv.on:hover{background:var(--blue-l)}.drv.off{color:var(--mut);opacity:.45}.drv.off:hover{opacity:1}span.drv{cursor:default}
th.gs{cursor:pointer;user-select:none;white-space:nowrap}th.gs:hover{background:var(--blue-l)}
th.gs::after{content:"↕";opacity:.35;margin-left:6px;font-size:11px}th.gs[aria-sort=ascending]::after{content:"▲";opacity:1;color:var(--blue)}th.gs[aria-sort=descending]::after{content:"▼";opacity:1;color:var(--blue)}
/* ===== visual moderno ===== */
#login{background:linear-gradient(135deg,#d7dcf8,#eceffc)}
.box{border:0;border-radius:22px;box-shadow:0 20px 60px rgba(40,50,120,.2);max-width:380px}
.box h1{background:linear-gradient(135deg,#131a3b,#2b3a8f);font-size:17px;padding:22px 24px}.box form{padding:24px}
input,select,textarea{border-radius:10px}.btn{border-radius:10px}
.card{border-radius:16px;border-color:transparent;box-shadow:0 2px 14px rgba(40,50,110,.07)}
.tile,.sqtile,.pos-card,.mstat{border-radius:14px;border-color:transparent;box-shadow:0 2px 10px rgba(40,50,110,.06)}
.kpi{background:linear-gradient(135deg,#4f6bed,#7d8ff7);border:0;color:#fff;border-radius:16px;box-shadow:0 8px 18px rgba(79,107,237,.25)}
.kpi b{color:#fff}.kpi small{color:rgba(255,255,255,.88)}.kpi:hover{background:linear-gradient(135deg,#4560e3,#7387f4)}
.kpi.k-ok{background:linear-gradient(135deg,#1f9d5c,#4cc58a);box-shadow:0 8px 18px rgba(31,157,92,.25)}
.kpi.k-err{background:linear-gradient(135deg,#d6453d,#f27a6e);box-shadow:0 8px 18px rgba(214,69,61,.25)}
.kpi.k-warn{background:linear-gradient(135deg,#e69a1c,#f6c15a);box-shadow:0 8px 18px rgba(230,154,28,.25)}
.dmod.edit .kpi{box-shadow:none}
.welcome{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue-l),var(--card));border-radius:18px;padding:20px 24px;margin-bottom:14px;box-shadow:0 2px 14px rgba(40,50,110,.07)}
.welcome h3{margin:0 0 4px;font-size:20px;color:var(--tx)}.welcome p{margin:0;color:var(--mut);max-width:560px}
.welcome::after{content:"";position:absolute;right:-30px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(79,107,237,.28),transparent 70%)}
/* agenda lateral */
.who{display:flex;align-items:center;gap:12px}.who b{display:block;font-size:14px}.who small{color:var(--mut)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#4f6bed,#8ea0ff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600}.calhead #calTitle{text-transform:capitalize}
.calhead button{border:0;background:var(--bg);width:30px;height:30px;border-radius:9px;cursor:pointer;color:var(--tx);font-size:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.calgrid .dow{font-size:11px;color:var(--mut);padding:4px 0}
.cd{border:0;background:transparent;border-radius:10px;height:34px;position:relative;cursor:pointer;color:var(--tx);font-size:13px}
.cd:hover{background:var(--bg)}.cd.o{color:var(--mut);opacity:.55}.cd.t{font-weight:700;color:var(--blue)}.cd.s{background:var(--blue);color:#fff;font-weight:600}
.cd i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--err)}.cd.s i{background:#fff}
.calfoot{display:flex;justify-content:flex-end;margin-top:8px}.gstat{margin-top:10px;font-size:13px}.gok{color:var(--ok);font-weight:600}.gmsg{margin:8px 0 0;color:var(--mut);font-size:12px}
.evl{display:grid;gap:8px}.evl h4{margin:6px 0 0;font-size:13px;text-transform:capitalize;color:var(--tx)}.mut{color:var(--mut);font-size:13px}
.ev{border-left:4px solid var(--blue);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}.ev b{display:block}.ev small{color:var(--mut);display:block}.ev a{color:var(--blue);font-size:12px}

:root[data-theme="dark"] body{background:linear-gradient(135deg,#080b1c,#10143a) fixed}:root[data-theme="dark"] #login{background:linear-gradient(135deg,#080b1c,#10143a)}

/* ===== botão de recolher a agenda, foto e escolha de layout ===== */
.who #agendaClose{margin-left:auto}.iconbtn.sm{width:30px;height:30px;border-radius:9px;font-size:16px;background:var(--bg)}
.edge{display:none;position:fixed;right:14px;top:50%;transform:translateY(-50%);width:26px;height:68px;border:0;border-radius:14px 0 0 14px;background:var(--blue);color:#fff;cursor:pointer;z-index:20;font-size:16px;box-shadow:0 6px 18px rgba(40,50,120,.3)}
@media(min-width:1200px){body.noright .edge{display:grid;place-items:center}}
.avatar.photo{background-size:cover;background-position:center;color:transparent}.avatar.big{width:76px;height:76px;font-size:30px;flex:none}
.lay-opts{display:flex;gap:14px;flex-wrap:wrap}.lay-opt{display:grid;gap:6px;text-align:center;background:transparent;border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;color:var(--tx);font-weight:500}
.lay-opt[aria-pressed=true]{border-color:var(--blue);background:var(--blue-l)}
.lay-prev{display:block;width:150px;height:92px;border-radius:10px;position:relative;overflow:hidden}
.lay-prev i{position:absolute}.lay-prev b{position:absolute}.lay-prev em{position:absolute}
.lay-prev.l1{background:#e9ecfb}.lay-prev.l1 i{left:0;top:0;bottom:0;width:34px;background:#131a3b}.lay-prev.l1 b{left:42px;top:8px;right:8px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4f6bed,#7d8ff7)}.lay-prev.l1 em{left:42px;top:42px;right:8px;bottom:8px;border-radius:7px;background:#fff}
.lay-prev.l2{background:#ecebf4}.lay-prev.l2 i{left:6px;top:6px;bottom:6px;width:16px;border-radius:9px;background:linear-gradient(180deg,#7466c4,#5e4fae)}.lay-prev.l2 b{left:30px;top:8px;right:8px;height:34px;border-radius:12px;background:linear-gradient(135deg,#6f60bf,#5a4c9f)}.lay-prev.l2 em{left:30px;top:50px;right:8px;bottom:8px;border-radius:12px;background:#fff}
/* ===== Layout 2 (roxo, barra lateral só com ícones) ===== */
:root[data-layout="2"]{--blue:#6c5eb5;--blue-l:#ebe8f7;--bg:#ecebf4;--side:#6b5db0;--line:#e4e1f1;--tx:#2d2a4a;--mut:#7a7699;--navy:#4d4290}
:root[data-layout="2"][data-theme="dark"]{--bg:#17142b;--card:#211d3d;--line:#352f5c;--tx:#ece9fb;--mut:#a9a3cf;--blue:#9a8cf0;--blue-l:#2c2652;--side:#3a3070;--navy:#cfc8fb}

<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="box">
    <h1>Acompanhamento contabilidade</h1>
    <form id="loginForm">
      <label>E-mail<input type="email" id="email" autocomplete="username" required></label>
      <label>Senha<input type="password" id="pass" autocomplete="current-password" required></label>
      <div class="msg" id="loginMsg" role="alert"></div>
      <button class="btn" id="loginBtn">Entrar</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg><div><b>Acompanhamento</b><span>contabilidade</span></div></div>
    <nav id="nav" aria-label="Menu principal"></nav>
    <button class="side-out" id="logout" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sair</span></button>
  </aside>
  <div id="center">
    <header>
      <label class="hf">Empresa <select id="companySel"><option value="">Nenhuma</option></select></label>
      <label class="hf">Competência <input type="month" id="period"></label>
      <span class="grow"></span>
      <button class="iconbtn" id="agendaToggle" type="button" aria-label="Mostrar ou ocultar a agenda" title="Agenda"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <aside id="right" aria-label="Agenda">
    <div class="who"><div class="avatar" id="avatar" aria-hidden="true">?</div><div><b id="whoName"></b><small id="whoRole"></small></div><button type="button" class="iconbtn sm" id="agendaClose" aria-label="Recolher a agenda" title="Recolher a agenda">›</button></div>
    <section class="calbox">
      <div class="calhead"><button type="button" id="calPrev" aria-label="Mês anterior">‹</button><span id="calTitle"></span><button type="button" id="calNext" aria-label="Próximo mês">›</button></div>
      <div class="calgrid" id="calGrid"></div>
      <div class="calfoot"><button type="button" class="btn sm sec" id="calToday">Hoje</button></div>
      <div id="gstat" class="gstat"></div>
    </section>
    <section><div id="calList" class="evl"></div></section>
  </aside>
  <button type="button" class="edge" id="agendaOpen" aria-label="Mostrar a agenda" title="Mostrar a agenda">‹</button>
</div>
<div id="toast" class="hidden" role="status"></div>

<script>
/* ============ CONFIGURAÇÃO ============
   Cole aqui a URL e a chave "anon/public" do seu projeto Supabase
   (Project Settings > API). A chave anon é pública por desenho;
   quem protege os dados são as políticas RLS do banco.
   NUNCA coloque a chave service_role neste arquivo. */
const SUPABASE_URL = "https://akmmyeqbqxhxduyvvevo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_qp1K2n87El7VtzqaJf-8_w_R0C1xlPl";

/* Google Agenda (opcional): cole aqui o "ID do cliente" OAuth do Google Cloud.
   É um dado público (não é senha). Sem ele, o calendário funciona, mas sem ligar à agenda. */
const GOOGLE_CLIENT_ID = "COLE_AQUI_O_ID_DO_CLIENTE_GOOGLE";

/* ============ UTILITÁRIOS ============ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = (v) => v === null || v === undefined || v === "" ? "—" :
  Number(v).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const ROLES = {admin:"Administrador", supervisor:"Contador / supervisor", operator:"Operador"};
let toastT;
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.remove("hidden"); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.add("hidden"),4000); }

function cnpjValido(c){ // mesma regra do banco (usada nos formulários da Etapa 2)
  const d=String(c||"").replace(/\D/g,""); if(d.length!==14||/^(\d)\1+$/.test(d)) return false;
  const dv=(n)=>{const w=n===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];
    const s=w.reduce((a,x,i)=>a+x*+d[i],0)%11; return s<2?0:11-s;};
  return dv(12)===+d[12] && dv(13)===+d[13];
}

/* ============ ESTADO ============ */
const configured = !SUPABASE_URL.startsWith("COLE") && !SUPABASE_ANON_KEY.startsWith("COLE");
let sb, state = { profile:null, companies:[], page:"dashboard" };

const ICON = {
  dashboard:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  empresas:'<path d="M4 21V5l8-2v18M12 9h8v12M8 8h1M8 12h1M8 16h1"/>',
  mensal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  contas:'<path d="M3 10l9-6 9 6M5 10v9M10 10v9M14 10v9M19 10v9M3 21h18"/>',
  caixas:'<rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="2.5"/>',
  cartoes:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  maquininhas:'<path d="M7 9V3.5a1 1 0 011-1h8a1 1 0 011 1V9"/><path d="M10 5.5h4"/><rect x="4.5" y="8" width="15" height="14" rx="2.5"/><rect x="7.5" y="11" width="9" height="3.5" rx=".8"/><path d="M8.5 17.5h.01M12 17.5h.01M15.5 17.5h.01M8.5 20h.01M12 20h.01M15.5 20h.01"/>',
  emprestimos:'<path d="M11 15h2a2 2 0 100-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="M7 21l1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 00-2.75-2.91l-4.2 3.9"/><path d="M2 16l6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/>',
  "declaracao-faturamento":'<path d="M15 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7z"/><path d="M14 2v4a2 2 0 002 2h4"/><path d="M8 13h2M14 13h2M8 17h2M14 17h2"/>',
  folha:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
  apropriacao:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  fiscal:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 14l2 2 4-4"/>',
  terceiros:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5a3 3 0 010 6M21 20c0-2.6-1.4-4.6-3.5-5.5"/>',
  relatorios:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/>',
  usuarios:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/>',
  config:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
const PAGES = [
  ["dashboard","Dashboard",4],["empresas","Empresas",2],["mensal","Acompanhamento mensal",2],
  ["contas","Contas e aplicações",2],["cartoes","Cartões",2],["maquininhas","Maquininhas",2],["folha","Folha",2],["fiscal","Fiscal",2],["apropriacao","Apropriação",2],["emprestimos","Empréstimos",2],["declaracao-faturamento","Declaração de Faturamento",2],
  ["relatorios","Relatórios",4],["usuarios","Usuários e responsáveis",2],["config","Configurações",1]
];

/* ============ INICIALIZAÇÃO ============ */
async function init(){
  if(!configured){
    $("login").classList.remove("hidden");
    $("loginMsg").textContent="Configure SUPABASE_URL e SUPABASE_ANON_KEY no início do index.html.";
    $("loginBtn").disabled=true; return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data:{ session } } = await sb.auth.getSession();
  session ? await enterApp() : showLogin();
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT") showLogin(); });
}
function showLogin(){ $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }

$("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault(); $("loginMsg").textContent=""; $("loginBtn").disabled=true;
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pass").value });
  $("loginBtn").disabled=false;
  if(error){ $("loginMsg").textContent = error.message.includes("Invalid") ? "E-mail ou senha incorretos." : "Não foi possível entrar: "+error.message; return; }
  $("pass").value=""; await enterApp();
});
$("logout").addEventListener("click", ()=>{ gcalForget(); sb.auth.signOut(); });

async function enterApp(){
  const { data:{ user } } = await sb.auth.getUser();
  const { data:profile, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut(); $("loginMsg").textContent="Usuário sem perfil ativo. Fale com o administrador."; return;
  }
  state.profile = profile; uiBoot(profile);
  $("whoName").textContent = profile.full_name || profile.email;
  $("whoRole").textContent = ROLES[profile.role];
  const { data:cs } = await sb.from("companies").select("id,legal_name,trade_name,cnpj,active").order("legal_name");
  state.companies = cs || [];
  $("companySel").innerHTML = '<option value="">Todas / nenhuma</option>' +
    state.companies.filter(c=>c.active).map(c=>`<option value="${esc(c.id)}">${esc(c.trade_name||c.legal_name)}</option>`).join("");
  const now = new Date(); $("period").value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  buildNav(); calInit(); go(location.hash.slice(1) || "dashboard");
}

/* ============ NAVEGAÇÃO ============ */
function buildNav(){
  $("nav").innerHTML = PAGES.map(([id,label])=>
    `<a href="#${id}" data-p="${id}" title="${esc(label)}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[id]}</svg>${esc(label)}</a>`).join("");
}
window.addEventListener("hashchange", ()=>{ if(state.profile) go(location.hash.slice(1)); });
/* Telas que usam a competência (mês) do cabeçalho; nas demais ela fica oculta. */
const PERIOD_PAGES=["mensal","folha","fiscal","apropriacao","relatorios","usuarios","config"];
const NO_COMPANY_PAGES=["empresas","emprestimos","declaracao-faturamento"];
const PLACEHOLDERS={
  emprestimos:{d:"Controle de empréstimos a funcionários: parcelas mensais, juros simples e amortizações.",items:["Cadastro de empréstimos por funcionário","Tabela mês a mês com saldo, juros e amortizações","Amortizações extras e contratos diferentes por pessoa","Histórico de quem alterou cada valor"]}
};
function renderPlaceholder(id){
  const P=PLACEHOLDERS[id], ic=`<svg viewBox="0 0 24 24" aria-hidden="true" style="width:40px;height:40px;fill:none;stroke:var(--blue);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">${ICON[id]}</svg>`;
  $("view").insertAdjacentHTML("beforeend",`<p style="margin:-8px 0 12px;color:var(--mut)">${esc(P.d)}</p>
   <div class="card wide" style="text-align:center;padding:36px 20px">${ic}<h3 style="margin:12px 0 6px">Módulo em construção</h3>
   <p style="color:var(--mut);margin:0 auto 16px;max-width:520px">A estrutura da página já está pronta. As regras de negócio serão implementadas na próxima etapa.</p>
   <div style="display:inline-block;text-align:left"><b style="font-size:13px">Previsto:</b><ul style="margin:6px 0 0;padding-left:20px;color:var(--mut);font-size:14px">${P.items.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></div>`);
}
function go(id){
  if(!PAGES.some(p=>p[0]===id)) id="dashboard";
  if(state.page==="declaracao-faturamento"&&id!==state.page&&DF.dirty){ dfReadForm(); dfFlush(); }
  state.page=id;
  $("period").closest(".hf").classList.toggle("hidden",!PERIOD_PAGES.includes(id));
  $("companySel").closest(".hf").classList.toggle("hidden",NO_COMPANY_PAGES.includes(id));
  document.querySelectorAll("#nav a").forEach(a=> a.dataset.p===id ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  const [, label, etapa] = PAGES.find(p=>p[0]===id);
  $("view").innerHTML = `<h2>${esc(label)}</h2>` + ((id==="config"||id==="empresas"||id==="mensal"||id==="folha"||id==="fiscal"||id==="apropriacao"||id==="usuarios"||id==="dashboard"||id==="relatorios"||id==="cartoes"||id==="maquininhas"||PLACEHOLDERS[id]||id==="declaracao-faturamento"||PAGE_KIND[id]) ? "" :
    `<div class="card"><p>Este módulo será implementado na <strong>Etapa ${etapa}</strong>. A estrutura do banco que ele usa já existe.</p></div>`);
  if(id==="config"){ $("view").insertAdjacentHTML("beforeend",themeCard()); uiMark(); setAvatar(); }
  if(id==="config") renderDiagnostico().then(()=>{ if(["admin","supervisor"].includes(state.profile.role)) renderAudit(); });
  if(id==="empresas") renderEmpresas();
  if(PAGE_KIND[id]) renderStruct(PAGE_KIND[id]);
  if(id==="mensal"||id==="folha"||id==="fiscal"||id==="apropriacao") renderMensal();
  if(id==="dashboard") renderDashboard();
  if(id==="relatorios") renderRelatorios();
  if(id==="maquininhas") renderMaquininhas();
  if(id==="usuarios") renderUsuarios();
  if(PLACEHOLDERS[id]) renderPlaceholder(id);
  if(id==="declaracao-faturamento") renderDeclaracao();
}

/* ============ DIAGNÓSTICO (Configurações) ============ */
async function renderDiagnostico(){
  const checks = [];
  const ok = (n,v,d="")=>checks.push(`<tr><td>${esc(n)}</td><td><span class="tag ${v?"ok":"err"}">${v?"OK":"Falhou"}</span></td><td>${esc(d)}</td></tr>`);
  ok("Conexão com o Supabase", true, SUPABASE_URL.replace(/^https?:\/\//,""));
  ok("Sessão autenticada", !!state.profile, state.profile.email);
  ok("Perfil de acesso", true, ROLES[state.profile.role]);
  const tabelas = ["companies","account_categories","monitored_accounts","monthly_periods","monthly_account_records","reconciliation_issues"];
  for(const t of tabelas){
    const { count, error } = await sb.from(t).select("*",{count:"exact",head:true});
    ok(`Tabela ${t}`, !error, error ? error.message : `${count} registro(s) visíveis`);
  }
  const { error:ea } = await sb.from("audit_logs").select("id",{head:true,count:"exact"});
  ok("Auditoria (leitura)", !ea, ea ? ea.message : (state.profile.role==="operator" ? "Operador não vê registros (esperado)" : "Acesso permitido"));
  $("view").innerHTML += `<div class="card"><h3>Diagnóstico da instalação</h3>
    <table><tbody>${checks.join("")}</tbody></table></div>
    <div class="card"><h3>Formato de valores</h3><p>Exemplo: ${brl(97.93)} · saldo não informado: ${brl(null)} · saldo zero: ${brl(0)}</p></div>`;
}

/* ============ EMPRESAS (Etapa 2.1) ============ */
const fmtCnpj=(v)=>String(v||"").replace(/\D/g,"").slice(0,14).replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2");
let empFilter={q:"",st:"active"}, empEditing=null;

function fillCompanySel(){
  const cur=$("companySel").value;
  $("companySel").innerHTML='<option value="">Todas / nenhuma</option>'+
    state.companies.filter(c=>c.active).map(c=>`<option value="${esc(c.id)}">${esc(c.trade_name||c.legal_name)}</option>`).join("");
  $("companySel").value=cur;
}
async function loadCompanies(){
  const {data,error}=await sb.from("companies").select("*").order("legal_name");
  if(error){ toast("Erro ao carregar empresas: "+error.message); return false; }
  state.companies=data||[]; fillCompanySel(); return true;
}

  const adm=state.profile.role==="admin";
  $("view").innerHTML=`<h2>Empresas</h2>
    <div class="bar"><input id="eq" type="search" placeholder="Pesquisar razão social, CNPJ ou código" value="${esc(empFilter.q)}">
    <select id="est"><option value="active">Ativas</option><option value="inactive">Inativas</option><option value="all">Todas</option></select>
    ${adm?'<button class="btn" id="enew">Nova empresa</button>':""}</div>
    <div class="card tbl" id="elist">Carregando…</div>
    <dialog id="dlg"><form id="eform" method="dialog">
      <h3 id="dtitle"></h3>
      <label>Razão social *<input id="f_legal" required maxlength="200"></label>
      <label>CNPJ *<input id="f_cnpj" inputmode="numeric" placeholder="00.000.000/0000-00" required></label>
      <label>Código interno<input id="f_code" maxlength="50"></label>
      <fieldset class="addr"><legend>Endereço (usado na Declaração de Faturamento)</legend>
        <label>Logradouro<input id="f_street" maxlength="200" placeholder="Rua, avenida…"></label>
        <div class="addr2"><label>Número<input id="f_num" maxlength="20"></label><label>Bairro<input id="f_dist" maxlength="100"></label></div>
        <div class="addr2"><label>Cidade<input id="f_city" maxlength="100"></label><label>UF<input id="f_uf" maxlength="2" style="text-transform:uppercase" placeholder="PB"></label></div></fieldset>
      <label>Link do Drive (opcional)<input id="f_drive" maxlength="500" placeholder="https://drive.google.com/…" inputmode="url"></label>
      <label>Observações<textarea id="f_notes" rows="3"></textarea></label>
      <div class="msg" id="dmsg" role="alert"></div>
      <div class="row"><button type="button" class="btn sec" id="dcancel">Cancelar</button><button class="btn" id="dsave">Salvar</button></div>
    </form></dialog>`;
  $("est").value=empFilter.st;
  $("eq").addEventListener("input",e=>{empFilter.q=e.target.value;drawEmp();});
  $("est").addEventListener("change",e=>{empFilter.st=e.target.value;drawEmp();});
  if(adm) $("enew").addEventListener("click",()=>openEmp(null));
  $("f_cnpj").addEventListener("input",e=>{e.target.value=fmtCnpj(e.target.value);});
  $("dcancel").addEventListener("click",()=>$("dlg").close());
  $("eform").addEventListener("submit",saveEmp);
  $("elist").addEventListener("click",onEmpClick);

const driveOk=(u)=>{ try{ return new URL(u).protocol==="https:"&&String(u).length<=500; }catch(e){ return false; } };
const DRV_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>';
function driveIcon(c,adm){
  if(c.drive_url&&driveOk(c.drive_url)) return `<a class="drv on" href="${esc(c.drive_url)}" target="_blank" rel="noopener noreferrer" title="Abrir o Drive de ${esc(c.legal_name)}" aria-label="Abrir o Drive de ${esc(c.legal_name)}">${DRV_SVG}</a>`;
  return adm?`<button type="button" class="drv off" data-a="drive" data-id="${esc(c.id)}" title="Vincular um Drive" aria-label="Vincular um Drive a ${esc(c.legal_name)}">${DRV_SVG}</button>`
            :`<span class="drv off" title="Sem Drive vinculado">${DRV_SVG}</span>`;
}
function drawEmp(){
  const q=empFilter.q.trim().toLowerCase(), qd=q.replace(/\D/g,""), adm=state.profile.role==="admin";
  const rows=state.companies.filter(c=>
    (empFilter.st==="all"||(empFilter.st==="active")===c.active) &&
    (!q||[c.legal_name,c.internal_code].some(x=>(x||"").toLowerCase().includes(q))||(qd&&c.cnpj.includes(qd))));
  if(!rows.length){
    $("elist").innerHTML=state.companies.length?"Nenhuma empresa encontrada com esses filtros."
      :(adm?"Nenhuma empresa cadastrada. Clique em <strong>Nova empresa</strong> para começar.":"Você ainda não foi vinculado a nenhuma empresa. Fale com o administrador.");
    return;
  }
  $("elist").innerHTML=`<table><thead><tr><th>Razão social</th><th>CNPJ</th><th>Código</th><th>Situação</th>${adm?"<th>Ações</th>":""}<th class="r" title="Link do Drive">Drive</th></tr></thead><tbody>`+
    rows.map(c=>`<tr><td>${esc(c.legal_name)}</td><td>${fmtCnpj(c.cnpj)}</td><td>${esc(c.internal_code||"—")}</td>
    <td><span class="tag ${c.active?"ok":"warn"}">${c.active?"Ativa":"Inativa"}</span></td>
    ${adm?`<td><button class="lnk" data-a="edit" data-id="${esc(c.id)}">Editar</button> <button class="lnk" data-a="tog" data-id="${esc(c.id)}">${c.active?"Inativar":"Reativar"}</button></td>`:""}<td class="r">${driveIcon(c,adm)}</td></tr>`).join("")+"</tbody></table>";
}

function openEmp(c){
  empEditing=c; $("dmsg").textContent="";
  $("dtitle").textContent=c?"Editar empresa":"Nova empresa";
  $("f_legal").value=c?.legal_name||""; $("f_drive").value=c?.drive_url||"";
  $("f_street").value=c?.address_street||""; $("f_num").value=c?.address_number||""; $("f_dist").value=c?.address_district||""; $("f_city").value=c?.address_city||""; $("f_uf").value=c?.address_uf||"";
  $("f_cnpj").value=fmtCnpj(c?.cnpj); $("f_code").value=c?.internal_code||""; $("f_notes").value=c?.notes||"";
  $("dlg").showModal(); $("f_legal").focus();
}

async function saveEmp(e){
  e.preventDefault();
  const legal=$("f_legal").value.trim(), cnpj=$("f_cnpj").value.replace(/\D/g,"");
  if(!legal){ $("dmsg").textContent="Informe a razão social."; return; }
  if(!cnpjValido(cnpj)){ $("dmsg").textContent="CNPJ inválido. Confira os dígitos."; return; }
  const drv=$("f_drive").value.trim();
  if(drv&&!driveOk(drv)){ $("dmsg").textContent="Informe um link que comece com https:// (por exemplo, o link da pasta no Drive)."; return; }
  const uf=$("f_uf").value.trim().toUpperCase();
  if(uf&&!/^[A-Z]{2}$/.test(uf)){ $("dmsg").textContent="UF deve ter 2 letras (ex.: PB)."; return; }
  const p={legal_name:legal,drive_url:drv||null,cnpj,internal_code:$("f_code").value.trim()||null,notes:$("f_notes").value.trim()||null};
  const ad={address_street:$("f_street").value.trim()||null,address_number:$("f_num").value.trim()||null,address_district:$("f_dist").value.trim()||null,address_city:$("f_city").value.trim()||null,address_uf:uf||null};
  if(Object.values(ad).some(Boolean)||(empEditing&&"address_street" in empEditing)) Object.assign(p,ad);
  $("dsave").disabled=true; $("dsave").textContent="Salvando…";
  const {error}=empEditing ? await sb.from("companies").update(p).eq("id",empEditing.id)
                           : await sb.from("companies").insert({...p,created_by:state.profile.id});
  $("dsave").disabled=false; $("dsave").textContent="Salvar";
  if(error){ $("dmsg").textContent = error.code==="23505" ? "Já existe uma empresa com este CNPJ."
      : /address_/.test(error.message) ? "Os campos de endereço ainda não existem no banco. Rode o arquivo 017_declaracao_faturamento.sql no Supabase."
      : /drive_url/.test(error.message) ? "O campo do Drive ainda não existe no banco. Rode o arquivo 014_drive_empresas.sql no Supabase." : error.code==="23514" ? "CNPJ inválido ou link do Drive inválido." : "Não foi possível salvar: "+error.message; return; }
  $("dlg").close(); toast(empEditing?"Empresa atualizada.":"Empresa cadastrada.");
  if(await loadCompanies()) drawEmp();
}

async function onEmpClick(e){
  const b=e.target.closest("button[data-a]"); if(!b) return;
  const c=state.companies.find(x=>x.id===b.dataset.id); if(!c) return;
  if(b.dataset.a==="edit") return openEmp(c);
  if(b.dataset.a==="drive"){ openEmp(c); $("f_drive").focus(); return; }
  const msg=c.active?`Inativar "${c.legal_name}"? O histórico é mantido, mas a empresa deixa de aparecer nas seleções e nos totais.`:`Reativar "${c.legal_name}"?`;
  if(!confirm(msg)) return;
  const {error}=await sb.from("companies").update({active:!c.active}).eq("id",c.id);
  if(error){ toast("Não foi possível alterar: "+error.message); return; }
  toast(c.active?"Empresa inativada.":"Empresa reativada.");
  if(await loadCompanies()) drawEmp();
}

/* ============ CATEGORIAS E CONTAS (Etapa 2.2) ============ */
const KINDS={
  bank:{title:"Contas e aplicações",item:"conta",seed:[["Contas Correntes / Aplicações",true]]},
  cash:{title:"Caixas",item:"caixa",seed:[["Caixas",true]]},
  card:{title:"Cartões",item:"cartão",seed:[["Cartões",false]]},
  payroll:{title:"Itens da Folha",item:"item",seed:[["Folha - CLT",false],["Folha - Ministros",false]]},
  fiscal:{title:"Itens do Fiscal",item:"item",seed:[["Fiscal",false]]},
  third_party:{title:"Fornecedores e clientes",item:"registro",seed:[["Fornecedores",false],["Adiantamento a fornecedores",false],["Adiantamento a clientes",false],["Clientes",false]]}
};
const PAGE_KIND={contas:"bank",cartoes:"card"};
const hasInst=(k)=>k==="bank"||k==="card";
const ACC_TYPES=["Conta corrente","Aplicação financeira","Conta poupança","Caixa","Cartão corporativo","Outros"];
let SD={}, accEditing=null;
$("companySel").addEventListener("change",()=>{ const k=PAGE_KIND[state.page]; if(k) renderStruct(k); });

async function renderStruct(kind,back){ SBACK=back||null;
  const K=KINDS[kind], cid=$("companySel").value;
  const head=`<h2>${esc(K.title)}</h2>`+(back?'<div class="bar"><button class="btn sec" id="sback">‹ Voltar ao acompanhamento</button></div>':"");
  if(!cid){ $("view").innerHTML=head+'<div class="card">Selecione uma empresa no cabeçalho para ver e cadastrar itens.</div>'; return; }
  const co=state.companies.find(c=>c.id===cid);
  $("view").innerHTML=head+`<p style="margin:-8px 0 12px;color:var(--mut)">${esc(co?.legal_name||"")}</p><div id="stool"></div><div class="card tbl" id="slist">Carregando…</div>
   <dialog id="adlg"><form id="aform" method="dialog"><h3 id="atitle"></h3>
     <label>Categoria *<select id="a_cat" required></select></label>
     <label>Descrição *<input id="a_desc" required maxlength="200"></label>
     <div id="a_bank" class="hidden" style="display:grid;gap:12px">
       <label>Instituição financeira<input id="a_inst" maxlength="120"></label>
       <label id="a_typel">Tipo de conta<select id="a_type"><option value="">—</option>${ACC_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></label>
       <label><span id="a_numt">Número da conta</span><input id="a_num" maxlength="60"></label></div>
     <label id="a_revl" class="hidden"><span>Código receita</span><input id="a_rev" maxlength="60"></label><label>Código contábil<input id="a_code" maxlength="60"></label>
     <label id="a_respl">Responsável sugerido<select id="a_resp"></select></label>
     <div class="msg" id="amsg" role="alert"></div>
     <div class="row"><button type="button" class="btn sec" id="acancel">Cancelar</button><button class="btn" id="asave">Salvar</button></div></form></dialog>
   <dialog id="cdlg"><form id="cform" method="dialog"><h3>Categorias</h3><div id="clist"></div>
     <label>Nova categoria<input id="c_name" maxlength="100"></label>
     <label id="c_cashl" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="c_cash" checked> Entra no total de disponibilidade financeira</label>
     <div class="msg" id="cmsg" role="alert"></div>
     <div class="row"><button type="button" class="btn sec" id="cclose">Fechar</button><button class="btn" id="cadd">Adicionar</button></div></form></dialog>`;
  const [cats,accs,pf]=await Promise.all([
    sb.from("account_categories").select("*").eq("company_id",cid).eq("kind",kind).order("sort_order").order("name"),
    sb.from("monitored_accounts").select("*, account_categories!inner(kind)").eq("company_id",cid).eq("account_categories.kind",kind).order("sort_order").order("description"),
    sb.from("profiles").select("id,full_name,email").eq("active",true).order("full_name")]);
  const err=cats.error||accs.error||pf.error;
  if(err){ $("slist").textContent="Erro ao carregar: "+err.message; return; }
  SD={kind,cid,cats:cats.data,accs:accs.data,people:pf.data};
  $("a_revl").classList.toggle("hidden",kind!=="card"); $("a_respl").classList.toggle("hidden",kind==="bank"); $("a_bank").classList.toggle("hidden",!hasInst(kind)); $("a_typel").classList.toggle("hidden",kind!=="bank"); $("c_cashl").classList.toggle("hidden",!(kind==="bank"||kind==="cash"));
  if(kind==="card"){ $("a_numt").textContent="Final do cartão (somente os 4 últimos dígitos)"; $("a_num").maxLength=4; $("a_num").placeholder="0000"; }
  $("slist").onclick=onStructClick; $("acancel").onclick=()=>$("adlg").close(); $("cclose").onclick=()=>$("cdlg").close();
  $("aform").onsubmit=saveAcc; $("cform").onsubmit=addCat;

function drawStruct(){
  const adm=state.profile.role==="admin", {kind,cats,accs,people}=SD, K=KINDS[kind];
  const nome=(id)=>{const p=people.find(x=>x.id===id); return p?esc(p.full_name||p.email):"—";};
  $("stool").innerHTML=(kind==="bank"?typeTiles(accs,bankMods()):"")+(adm?`<div class="bar">${cats.length?`<button class="btn" id="anew">Novo ${esc(K.item)}</button>`:""}<button class="btn sec" id="cman">Categorias</button></div>`:"");
  $("stool").onclick=(e)=>{ const b=e.target.closest(".tile"); if(!b) return; const el=b.dataset.go!==""&&b.dataset.go!=="-1"?$("stm-"+b.dataset.go):null; if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); else toast("Nenhuma conta deste tipo."); };
  if(adm){ if($("anew")) $("anew").onclick=()=>openAcc(null); $("cman").onclick=openCats; }
  if(!cats.length){
    $("slist").innerHTML=`Nenhuma categoria cadastrada para esta empresa.`+(adm?` <button class="btn" id="seed" style="margin-left:8px">Criar categorias padrão</button>`:"");
    if(adm) $("seed").onclick=seedCats; return;
  }
  if(kind==="bank"){ $("slist").className=""; $("slist").innerHTML=bankModules(adm); return; }
  const cols=kind==="bank"?["Descrição","Instituição","Tipo","Número","Código contábil","Responsável"]:kind==="card"?["Nome","Banco","Final do cartão","Código receita","Código contábil","Responsável"]:["Descrição","Código contábil","Responsável"];
  $("slist").innerHTML=cats.map(c=>{
    const rows=accs.filter(a=>a.category_id===c.id&&(!SD.tf||(a.account_type||"(sem tipo)")===SD.tf));
    return `<h3 style="margin:14px 0 6px">${esc(c.name)} <span class="tag ${c.counts_as_cash?"ok":"warn"}">${c.counts_as_cash?"Entra na disponibilidade":"Controle contábil"}</span>${c.active?"":' <span class="tag warn">Categoria inativa</span>'}</h3>`+
    (rows.length?`<table><thead><tr>${cols.map(x=>`<th>${x}</th>`).join("")}<th>Situação</th>${adm?"<th>Ações</th>":""}</tr></thead><tbody>`+rows.map(a=>
      `<tr><td>${esc(a.description)}</td>`+(kind==="bank"?`<td>${esc(a.institution||"—")}</td><td>${esc(a.account_type||"—")}</td><td>${esc(a.account_number||"—")}</td>`:kind==="card"?`<td>${esc(a.institution||"—")}</td><td>${esc(a.account_number||"—")}</td><td>${esc(a.revenue_code||"—")}</td>`:"")+
      `<td>${esc(a.accounting_code||"—")}</td><td>${nome(a.default_responsible)}</td><td><span class="tag ${a.active?"ok":"warn"}">${a.active?"Ativo":"Inativo"}</span></td>`+
      (adm?`<td><button class="lnk" data-a="edit" data-id="${esc(a.id)}">Editar</button> <button class="lnk" data-a="tog" data-id="${esc(a.id)}">${a.active?"Inativar":"Reativar"}</button></td>`:"")+"</tr>").join("")+"</tbody></table>"
     :'<p style="color:var(--mut);margin:4px 0">Nenhum item nesta categoria.</p>');
  }).join("");
}

async function seedCats(){
  const rows=KINDS[SD.kind].seed.map(([name,cash],i)=>({company_id:SD.cid,kind:SD.kind,name,counts_as_cash:cash,sort_order:i+1}));
  const {error}=await sb.from("account_categories").insert(rows);
  if(error){ toast("Não foi possível criar as categorias: "+error.message); return; }
  toast("Categorias criadas."); renderStruct(SD.kind);
}

function openCats(){
  $("cmsg").textContent=""; $("c_name").value="";
  $("clist").innerHTML=SD.cats.length?"<table><tbody>"+SD.cats.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.counts_as_cash?"Disponibilidade":"Controle contábil"}</td>
    <td><button type="button" class="lnk" data-cid="${esc(c.id)}">${c.active?"Inativar":"Reativar"}</button></td></tr>`).join("")+"</tbody></table>":"<p>Nenhuma categoria.</p>";
  $("clist").onclick=async(e)=>{ const b=e.target.closest("button[data-cid]"); if(!b) return;
    const c=SD.cats.find(x=>x.id===b.dataset.cid);
    const {error}=await sb.from("account_categories").update({active:!c.active}).eq("id",c.id);
    if(error){ $("cmsg").textContent="Erro: "+error.message; return; }
    c.active=!c.active; openCats(); drawStruct(); };
  $("cdlg").showModal();
}
async function addCat(e){
  e.preventDefault(); const name=$("c_name").value.trim();
  if(!name){ $("cmsg").textContent="Informe o nome da categoria."; return; }
  const cash=(SD.kind==="bank"||SD.kind==="cash")?$("c_cash").checked:false;
  const {data,error}=await sb.from("account_categories").insert({company_id:SD.cid,kind:SD.kind,name,counts_as_cash:cash,sort_order:SD.cats.length+1}).select().single();
  if(error){ $("cmsg").textContent=error.code==="23505"?"Já existe uma categoria com esse nome.":"Erro: "+error.message; return; }
  SD.cats.push(data); openCats(); drawStruct(); toast("Categoria adicionada.");
}

function openAcc(a){
  accEditing=a; $("amsg").textContent=""; $("atitle").textContent=a?"Editar "+KINDS[SD.kind].item:"Novo "+KINDS[SD.kind].item;
  $("a_cat").innerHTML=SD.cats.filter(c=>c.active||c.id===a?.category_id).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  $("a_resp").innerHTML='<option value="">Nenhum</option>'+SD.people.map(p=>`<option value="${esc(p.id)}">${esc(p.full_name||p.email)}</option>`).join("");
  $("a_cat").value=a?.category_id||$("a_cat").options[0]?.value||""; $("a_desc").value=a?.description||"";
  $("a_inst").value=a?.institution||""; if(a?.account_type&&!ACC_TYPES.includes(a.account_type)) $("a_type").insertAdjacentHTML("beforeend",`<option>${esc(a.account_type)}</option>`); $("a_type").value=a?.account_type||""; $("a_num").value=a?.account_number||"";
  $("a_code").value=a?.accounting_code||""; $("a_rev").value=a?.revenue_code||""; $("a_resp").value=a?.default_responsible||"";
  $("adlg").showModal(); $("a_desc").focus();
}
async function saveAcc(e){
  e.preventDefault(); const desc=$("a_desc").value.trim();
  if(!desc||!$("a_cat").value){ $("amsg").textContent="Informe a categoria e a descrição."; return; }
  const bank=SD.kind==="bank", inst=hasInst(SD.kind), t=(id)=>$(id).value.trim()||null;
  if(SD.kind==="card"&&$("a_num").value.trim()&&!/^\d{4}$/.test($("a_num").value.trim())){ $("amsg").textContent="Informe somente os 4 últimos dígitos do cartão (nunca o número completo)."; return; }
  const p={category_id:$("a_cat").value,description:desc,institution:inst?t("a_inst"):null,account_type:bank?t("a_type"):null,
    account_number:inst?t("a_num"):null,accounting_code:t("a_code"),revenue_code:SD.kind==="card"?t("a_rev"):null,default_responsible:$("a_resp").value||null};
  $("asave").disabled=true;
  const {data,error}=accEditing ? await sb.from("monitored_accounts").update(p).eq("id",accEditing.id).select("*, account_categories!inner(kind)").single()
    : await sb.from("monitored_accounts").insert({...p,company_id:SD.cid,sort_order:SD.accs.length+1}).select("*, account_categories!inner(kind)").single();
  $("asave").disabled=false;
  if(error){ $("amsg").textContent="Não foi possível salvar: "+error.message; return; }
  SD.accs=accEditing?SD.accs.map(x=>x.id===data.id?data:x):[...SD.accs,data];
  $("adlg").close(); drawStruct(); toast("Salvo.");
}
async function onStructClick(e){
  const b=e.target.closest("button[data-a]"); if(!b) return;
  if(b.dataset.a==="addmod"){ openAcc(null); if(b.dataset.t!=="(sem tipo)") $("a_type").value=b.dataset.t; return; }
  const a=SD.accs.find(x=>x.id===b.dataset.id); if(!a) return;
  if(b.dataset.a==="edit") return openAcc(a);
  if(!confirm(a.active?`Inativar "${a.description}"? O histórico é mantido e o item sai das próximas competências e dos totais.`:`Reativar "${a.description}"?`)) return;
  const {error}=await sb.from("monitored_accounts").update({active:!a.active}).eq("id",a.id);
  if(error){ toast("Não foi possível alterar: "+error.message); return; }
  a.active=!a.active; drawStruct(); toast(a.active?"Item reativado.":"Item inativado.");
}

  em_andamento:'<path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/>',divergencia:'<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',nao_aplicavel:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>'};

function mensalMods(){
  const MM_ORDER=["Conta corrente","Conta poupança","Aplicação financeira","Caixa","Cartão corporativo","Outros"];
  const cs=(r)=>r.monitored_accounts.account_categories, mods=[], ord=(t)=>{const i=MM_ORDER.indexOf(t); return i<0?50:i;};
  for(const [kind,label] of GROUPS){
    if(MM.only?!MM.only.includes(kind):MAIN_HIDE.includes(kind)) continue;
    const rows=MM.rows.filter(r=>cs(r).kind===kind); if(!rows.length) continue;
    if(kind==="bank"||kind==="cash"){
      const tl=(r)=>r.monitored_accounts.account_type||(kind==="cash"?"Caixa":"Sem tipo");
      [...new Set(rows.map(tl))].sort((a,b)=>(a==="Sem tipo")-(b==="Sem tipo")||ord(a)-ord(b)||a.localeCompare(b)).forEach(t=>mods.push({kind,label:t,rows:rows.filter(r=>tl(r)===t)}));
    } else mods.push({kind,label,rows});
  }
  mods.forEach((m,i)=>m.id="m"+i); return mods;
}
function drawMensal(){
  const dis=MM.locked?"disabled":"", ac=(r)=>r.monitored_accounts;
  const people='<option value="">—</option>'+MM.people.map(p=>`<option value="${esc(p.id)}">${esc(p.full_name||p.email)}</option>`).join("");
  const TH=(k,l,c)=>`<th${c?` class="${c}"`:""} data-sort="${k}" data-l="${l}" tabindex="0">${l}</th>`;
  MM.mods=mensalMods();
  let h=`<div class="mstats">${periodTile()}${MM.only?"":'<div class="mstat" id="msum"></div>'}<div class="mstat" id="mprog"></div><div class="mstat" id="mpend"></div><div class="mstat grow"><small>Pesquisar</small><input type="search" id="msearch" placeholder="Descrição, banco, nº da conta ou código" aria-label="Pesquisar"></div></div>`;
  if(!MM.rows.length) h+='<div class="card">Nenhuma conta ativa foi encontrada para esta competência.</div>';
  for(const m of MM.mods){
    const bank=m.kind==="bank", card=m.kind==="card";
    const head=card?TH("description","Nome")+TH("institution","Banco")+TH("revenue_code","Código receita")+TH("accounting_code","C. contábil")+TH("status","Situação")+TH("responsible","Responsável")+"<th>Observações</th>"
      :TH("description","Descrição")+(bank?TH("institution","Banco")+TH("account_number","Nº conta"):"")+TH("accounting_code","C. contábil")+TH("previous_balance","Saldo anterior","r")+TH("final_balance","Saldo final","r")+TH("status","Situação")+TH("responsible","Responsável")+"<th>Observações</th>";
    const plural=TYPE_PLURAL[m.label]||m.label, closed=mmCol().has(m.label);
    m.plural=plural;
    h+=`<div class="card tbl mblock${closed?" collapsed":""}" id="${m.id}-card" data-lbl="${esc(m.label)}"><h3 class="mhead"><button type="button" class="mtg" data-tg="${m.id}" aria-expanded="${!closed}" aria-controls="${m.id}-in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><span>${esc(plural)}</span><span class="mcnt">${m.rows.length} ${m.rows.length===1?"conta":"contas"}</span></button><span class="msub" id="ct-${m.id}"></span></h3>
      <div class="mblock-in" id="${m.id}-in"><div id="sec-${m.id}" class="pills"></div><table class="mt"><thead><tr>${head}</tr></thead><tbody>`;
    for(const r of m.rows){
      const a=ac(r), id=esc(r.id);
      const bal=`<td class="r">${r.previous_balance==null?"—":fmtNum(r.previous_balance)}</td><td class="r"><input class="num" data-f="final_balance" data-id="${id}" value="${fmtNum(r.final_balance)}" placeholder="não informado" inputmode="decimal" ${dis}></td>`;
      const tail=`<td><span class="stb st-${r.status}">${stIcon(r.status)}<select class="stsel" data-f="status" data-id="${id}" aria-label="Situação" ${dis}>${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===r.status?" selected":""}>${v[0]}</option>`).join("")}</select></span></td>
        <td><select data-f="responsible_id" data-id="${id}" ${dis}>${people.replace(`value="${r.responsible_id}"`,`value="${r.responsible_id}" selected`)}</select></td>
        <td><input data-f="notes" data-id="${id}" value="${esc(r.notes||"")}" maxlength="500" ${dis}></td>`;
      const mid=card?`<td>${esc(a.institution||"—")}</td><td>${esc(a.revenue_code||"—")}</td><td>${esc(a.accounting_code||"—")}</td>`
        :bank?`<td>${esc(a.institution||"—")}</td><td>${esc(a.account_number||"—")}</td><td>${esc(a.accounting_code||"—")}</td>${bal}`:`<td>${esc(a.accounting_code||"—")}</td>${bal}`;
      h+=`<tr class="mrow st-${r.status}" data-rid="${id}" data-q="${esc([a.description,a.institution,a.account_number,a.accounting_code,a.revenue_code].join(" ").toLowerCase())}"><td>${esc(a.description)}</td>${mid}${tail}</tr>`;
    }

  }
  if((MM.mods||[]).length>1) h=h.replace('<div class="card tbl mblock','<div class="bar mtools"><button type="button" class="btn sm sec" data-tgall="0">Recolher todos</button><button type="button" class="btn sm sec" data-tgall="1">Expandir todos</button></div><div class="card tbl mblock');
  $("mbody").innerHTML=h+'<div class="card tbl" id="issues"></div>'+periodFooter()+periodDialogs()+issueDialog(); $("mbody").onchange=onMensalChange; bindBlocks(); bindPeriod(); bindIssues(); updSummaries(); drawIssues(); bindSearch(); bindSort();
}

function bindBlocks(){
  const set=(card,open)=>{ card.classList.toggle("collapsed",!open); const b=card.querySelector(".mtg"); if(b) b.setAttribute("aria-expanded",String(open));
    const c=mmCol(); open?c.delete(card.dataset.lbl):c.add(card.dataset.lbl); mmColSave(c); };
  const mb=$("mbody"); if(mb._blk) return; mb._blk=true;
  mb.addEventListener("click",(e)=>{
    const t=e.target.closest(".mtg"); if(t){ const card=t.closest(".mblock"); set(card,card.classList.contains("collapsed")); return; }
    const a=e.target.closest("[data-tgall]"); if(a) document.querySelectorAll("#mbody .mblock").forEach(c=>set(c,a.dataset.tgall==="1"));
  });
}
function paintStatus(sel,v){ const w=sel.closest(".stb"), tr=sel.closest("tr");
  if(w){ w.className="stb st-"+v; const ic=w.querySelector("svg"); if(ic) ic.innerHTML=ST_ICON[v]||""; }
  if(tr&&tr.classList.contains("mrow")) tr.className="mrow st-"+v; }
function updSummaries(){
  const cs=(r)=>r.monitored_accounts.account_categories;
  const sum=(rs)=>{ const ok=rs.filter(r=>r.status!=="nao_aplicavel"); const v=ok.filter(r=>r.final_balance!=null);
    return {cents:v.reduce((a,r)=>a+cents(r.final_balance),0), missing:ok.length-v.length}; };
  for(const m of MM.mods||[]){
    if(!$("sec-"+m.id)) continue;
    const rows=m.rows, ap=rows.filter(r=>r.status!=="nao_aplicavel"), n=(s)=>rows.filter(r=>r.status===s).length, done=n("concluido");
    $("sec-"+m.id).innerHTML=`<span>Registros <b>${rows.length}</b></span><span>Concluídos <b>${done}</b></span><span>Pendentes <b>${n("pendente")}</b></span><span>Em andamento <b>${n("em_andamento")}</b></span><span>Divergência <b>${n("divergencia")}</b></span><span>Não aplicável <b>${n("nao_aplicavel")}</b></span><span>Conclusão <b>${ap.length?Math.round(done/ap.length*100)+"%":"—"}</b></span>`;
    if(m.kind!=="card"){ const s=sum(rows); $("ct-"+m.id).innerHTML=`Subtotal ${esc(m.plural||m.label)}: <b>${brl(s.cents/100)}</b>`+(s.missing?` <small>(${s.missing} sem saldo)</small>`:""); }
    else $("ct-"+m.id).innerHTML=`${done} de ${ap.length} concluídos`;
  }
  const cashS=sum(MM.rows.filter(r=>cs(r).counts_as_cash));
  if($("msum")) $("msum").innerHTML=`<small>Disponibilidade financeira</small><b>${brl(cashS.cents/100)}</b><small>${cashS.missing?`parcial: ${cashS.missing} sem saldo informado`:"bancos, aplicações e caixas"}</small>`;
  const shown=(MM.mods||[]).flatMap(m=>m.rows), ap=shown.filter(r=>r.status!=="nao_aplicavel"), done=shown.filter(r=>r.status==="concluido").length;
  if($("mprog")) $("mprog").innerHTML=`<small>Conclusão</small><b>${ap.length?Math.round(done/ap.length*100)+"%":"—"}</b><small>${done} de ${ap.length} itens aplicáveis</small>`;
  const pend=shown.filter(r=>r.status==="pendente"||r.status==="em_andamento").length, dv=shown.filter(r=>r.status==="divergencia").length;
  if($("mpend")) $("mpend").innerHTML=`<small>Pendências</small><b>${pend}</b><small>${dv} com divergência</small>`;
}

async function onMensalChange(e){
  const el=e.target.closest("[data-f]"); if(!el) return;
  const r=MM.rows.find(x=>x.id===el.dataset.id), f=el.dataset.f; let v=el.value;
  const undo=()=>{ if(f==="final_balance") el.value=fmtNum(r[f]); else el.value=r[f]??""; if(f==="status"&&el.classList.contains("stsel")){ paintStatus(el,r.status); updSummaries(); } };
  if(f==="status"&&el.classList.contains("stsel")){ paintStatus(el,v); const old=r.status; r.status=v; updSummaries(); r.status=old; }
  if(f==="final_balance"){ v=parseBRL(v); if(v===undefined){ toast("Valor inválido. Use o formato 1.234,56."); undo(); return; } }
  else if(f==="responsible_id") v=v||null; else if(f==="notes") v=v.trim()||null;
  const {error}=await sb.from("monthly_account_records").update({[f]:v}).eq("id",r.id);
  if(error){ toast("Não foi possível salvar: "+error.message); undo(); return; }
  r[f]=v; if(f==="final_balance") el.value=fmtNum(v); if(f==="status"&&!el.classList.contains("stsel")) el.className="s-"+ST[v][1];
  updSummaries(); toast("Salvo.");
}

async function onMensalClick(e){
  const th=e.target.closest("th[data-sort]"); if(th) return sortMensal(th);
  const b=e.target.closest("button[data-a]"); if(!b) return;
  if(b.dataset.a==="issue") return openIssue(MM.rows.find(r=>r.id===b.dataset.id),null);
  const i=MM.issues.find(x=>x.id===b.dataset.id); if(!i) return;
  if(b.dataset.a==="iedit") return openIssue(MM.rows.find(r=>r.id===i.record_id),i);
  if(b.dataset.a==="ires"){
    const res=!i.resolved;
    if(!confirm(res?"Marcar esta divergência como resolvida?":"Reabrir esta divergência?")) return;
    const {data,error}=await sb.from("reconciliation_issues").update({resolved:res,resolved_at:res?todayISO():null}).eq("id",i.id).select("*").single();
    if(error){ toast("Não foi possível alterar: "+error.message); return; }
    MM.issues=MM.issues.map(x=>x.id===i.id?data:x); drawIssues(); toast(res?"Divergência resolvida.":"Divergência reaberta.");
    const rec=MM.rows.find(r=>r.id===i.record_id);
    if(res&&rec.status==="divergencia"&&!MM.issues.some(x=>x.record_id===rec.id&&!x.resolved)&&confirm("Não há mais divergências abertas nesta conta. Atualizar a situação dela para Concluído?")) await setRecStatus(rec,"concluido");
  }
}

const OPN={INSERT:"Criação",UPDATE:"Alteração",DELETE:"Exclusão"};

async function byIds(table,sel,ids){
  const out={}; ids=[...new Set(ids)].filter(Boolean);
  for(let i=0;i<ids.length;i+=40){ const {data}=await sb.from(table).select(sel).in("id",ids.slice(i,i+40)); (data||[]).forEach(x=>out[x.id]=x); }
  return out;
}
async function renderAudit(){
  if(state.page!=="config") return;
  $("view").insertAdjacentHTML("beforeend",`<div class="card tbl" style="max-width:none"><h3>Histórico de alterações (últimos 100 eventos)</h3>
    <div class="bar"><select id="au_c"><option value="">Todas as empresas</option>${state.companies.map(c=>`<option value="${esc(c.id)}">${esc(c.trade_name||c.legal_name)}</option>`).join("")}</select>
    <select id="au_t"><option value="">Todos os tipos</option>${Object.entries(TB).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
    <button class="btn sec" id="au_go">Atualizar</button></div><div id="au_list">Carregando…</div></div>`);
  $("au_go").onclick=loadAudit; $("au_c").onchange=loadAudit; $("au_t").onchange=loadAudit; loadAudit();
}
async function loadAudit(){
  $("au_list").textContent="Carregando…";
  let q=sb.from("audit_logs").select("*").order("at",{ascending:false}).limit(100);
  if($("au_c").value) q=q.eq("company_id",$("au_c").value); if($("au_t").value) q=q.eq("table_name",$("au_t").value);
  const {data:logs,error}=await q; if(error){ $("au_list").textContent="Erro ao carregar: "+error.message; return; }
  if(!logs.length){ $("au_list").textContent="Nenhum evento registrado com esses filtros."; return; }
  const ids=(t)=>logs.filter(l=>l.table_name===t).map(l=>l.record_id);
  const pIds=logs.flatMap(l=>[l.user_id,...(["responsible_id","closed_by","reopened_by","default_responsible"].includes(l.field)?[l.old_value,l.new_value]:[])]);
  const [pf,recs,accs,pers]=await Promise.all([byIds("profiles","id,full_name,email",pIds),
    byIds("monthly_account_records","id,monitored_accounts(description),monthly_periods(year,month)",ids("monthly_account_records")),
    byIds("monitored_accounts","id,description",ids("monitored_accounts")),byIds("monthly_periods","id,year,month",ids("monthly_periods"))]);
  const nm=(id)=>{const p=pf[id]; return p?(p.full_name||p.email):(id?"Usuário removido":"—");};
  const obj=(l)=>{ if(l.table_name==="companies"){const c=state.companies.find(x=>x.id===l.record_id); return c?c.legal_name:"—";}
    if(l.table_name==="monitored_accounts") return accs[l.record_id]?.description||"—";
    if(l.table_name==="monthly_periods"){const p=pers[l.record_id]; return p?String(p.month).padStart(2,"0")+"/"+p.year:"—";}
    if(l.table_name==="monthly_account_records"){const r=recs[l.record_id]; return r?`${r.monitored_accounts?.description||"—"} (${String(r.monthly_periods?.month).padStart(2,"0")}/${r.monthly_periods?.year})`:"—";}
    return "—"; };
  const val=(f,v)=>{ if(v==null) return "vazio"; if(/balance|_value$/.test(f)) return brl(v); if(f==="status") return ST[v]?ST[v][0]:v;
    if(["responsible_id","closed_by","reopened_by","default_responsible"].includes(f)) return nm(v); if(f==="active"||f==="resolved") return v==="true"?"sim":"não";
    if(f.endsWith("_at")&&v.includes("T")) return new Date(v).toLocaleString("pt-BR"); return v; };
  $("au_list").innerHTML=`<table class="mt" style="min-width:900px"><thead><tr><th>Data e hora</th><th>Usuário</th><th>Tipo</th><th>Registro</th><th>Operação</th><th>Campo</th><th>De</th><th>Para</th></tr></thead><tbody>`+
    logs.map(l=>`<tr><td>${new Date(l.at).toLocaleString("pt-BR")}</td><td>${esc(l.user_id?nm(l.user_id):"Sistema")}</td><td>${esc(TB[l.table_name]||l.table_name)}</td><td>${esc(obj(l))}</td><td>${OPN[l.operation]||esc(l.operation)}</td>
    <td>${l.field?esc(FLD[l.field]||l.field):"—"}</td><td>${l.field?esc(val(l.field,l.old_value)):"—"}</td><td>${l.field?esc(val(l.field,l.new_value)):"—"}</td></tr>`).join("")+"</tbody></table>";
}

/* Saldos mensais por tipo de conta (dados do Acompanhamento mensal) */
function typeSeries(base){
  const mo=(r)=>r.monthly_periods.month, lab=(r)=>r.monitored_accounts.account_type||(r.monitored_accounts.account_categories.kind==="cash"?"Caixa":"Sem tipo informado");
  const rows=base.filter(r=>ACC_KINDS.includes(r.monitored_accounts.account_categories.kind)&&r.status!=="nao_aplicavel"&&r.final_balance!=null);
  const ord=(t)=>{const i=ACC_TYPES.indexOf(t); return i<0?99:i;};
  const types=[...new Set(rows.map(lab))].sort((a,b)=>ord(a)-ord(b)||a.localeCompare(b));
  const has=MESES.map((_,i)=>rows.some(r=>mo(r)===i+1));
  const vals=types.map(t=>MESES.map((_,i)=>{ const rs=rows.filter(r=>mo(r)===i+1&&lab(r)===t); return rs.length?rs.reduce((s,r)=>s+cents(r.final_balance),0)/100:null; }));
  return {types,vals,has};
}
function niceStep(span){ const raw=span/4, p=Math.pow(10,Math.floor(Math.log10(raw||1))), n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function lineChart(base){
  const {types,vals,has}=typeSeries(base);
  if(!types.length) return '<span style="color:var(--mut)">Sem saldos informados no Acompanhamento mensal neste ano.</span>';
  const all=vals.flat().filter(v=>v!=null), mx0=Math.max(0,...all), mn0=Math.min(0,...all), st=niceStep((mx0-mn0)||1);
  const mx=Math.ceil(mx0/st)*st||st, mn=Math.floor(mn0/st)*st;
  const W=760,H=290,L=62,R=14,T=16,B=34, pw=W-L-R, ph=H-T-B, X=(i)=>L+pw*(i+.5)/12, Y=(v)=>T+ph*(mx-v)/((mx-mn)||1);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:none;height:auto" role="img" aria-label="Saldo por tipo de conta em cada mês">`;
  for(let v=mn;v<=mx+st/2;v+=st){ const y=Y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line)"${Math.abs(v)<st/1e6?' stroke-width="1.5"':' stroke-dasharray="3 4"'}/><text x="${L-8}" y="${y+4}" font-size="11" text-anchor="end" style="fill:var(--mut)">${Math.abs(v)<st/1e6?"0":kfmt(v)}</text>`; }
  MES_ABR.forEach((m,i)=>{ s+=`<text x="${X(i)}" y="${H-12}" font-size="11" text-anchor="middle" style="fill:${has[i]?"var(--tx)":"var(--mut)"}">${m.charAt(0).toUpperCase()+m.slice(1)}</text>`; });
  types.forEach((t,ti)=>{ const c=TYPE_COLORS[ti%TYPE_COLORS.length], v=vals[ti]; let seg=[];
    const flush=()=>{ if(seg.length>1) s+=`<polyline points="${seg.join(" ")}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`; seg=[]; };
    v.forEach((x,i)=>{ if(x==null) flush(); else seg.push(`${X(i).toFixed(1)},${Y(x).toFixed(1)}`); }); flush();
    v.forEach((x,i)=>{ if(x!=null) s+=`<circle cx="${X(i)}" cy="${Y(x)}" r="4" fill="${c}" stroke="var(--card)" stroke-width="1.5"><title>${esc(t)} · ${MESES[i]}: ${brl(x)}</title></circle>`; }); });
  s+="</svg>";
  const legend=`<div class="lg">`+types.map((t,i)=>`<span><i style="background:${TYPE_COLORS[i%TYPE_COLORS.length]}"></i>${esc(t)}</span>`).join("")+`</div>`;
  const tot=(i)=>vals.reduce((a,v)=>a+(v[i]||0),0);
  const tbl=`<table class="mt" style="min-width:900px;font-size:12px"><thead><tr><th>Tipo de conta</th>${MES_ABR.map(m=>`<th class="r">${m}</th>`).join("")}</tr></thead><tbody>`+
    types.map((t,ti)=>`<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:${TYPE_COLORS[ti%TYPE_COLORS.length]}"></i>${esc(t)}</td>${vals[ti].map(x=>`<td class="r">${x==null?"—":fmtNum(x)}</td>`).join("")}</tr>`).join("")+
    `<tr class="catrow"><td>Total do mês</td>${MESES.map((_,i)=>`<td class="r">${has[i]?fmtNum(tot(i)):"—"}</td>`).join("")}</tr></tbody></table>`;
  return s+legend+`<div style="overflow-x:auto">${tbl}</div>`;
}

function parseCSV(text){
  text=text.replace(/^\uFEFF/,""); const sample=text.slice(0,4000);
  const cnt=(ch)=>{let q=false,n=0; for(const c of sample){ if(c==='"') q=!q; else if(!q&&c===ch) n++; } return n;};
  const best=[",",";","\t"].map(c=>[c,cnt(c)]).sort((a,b)=>b[1]-a[1])[0], d=best[1]?best[0]:",";
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===d){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";} else if(c!=="\r") cell+=c; }
  if(cell!==""||row.length){row.push(cell);rows.push(row);} return rows;
}
function parseMoney(s){
  s=String(s??"").replace(/R\$|\s/g,""); if(s==="") return {v:null}; if(/^-+$/.test(s)||/^0+$/.test(s)) return {v:0};
  let neg=false; if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);} if(s.startsWith("-")){neg=!neg;s=s.slice(1);}
  if(!/^[\d.,]+$/.test(s)) return {err:"valor inválido"};
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf("."); let n;
  if(lc>=0&&ld>=0) n=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(lc>=0) n=s.replace(/\./g,"").replace(",",".");
  else if(ld>=0) n=/^\d{1,3}(\.\d{3})+$/.test(s)?s.replace(/\./g,""):s; else n=s;
  const v=Number(n); if(!isFinite(v)) return {err:"valor inválido"}; if((n.split(".")[1]||"").length>2) return {err:"mais de 2 casas decimais"};
  return {v:neg?-v:v};
}
const titleCase=(s)=>s.toLowerCase().replace(/(^|\s)\S/g,(c)=>c.toUpperCase());
function guessSection(title){
  const t=nrm(title), kind=/caixa/.test(t)?"cash":/cartao|cartoes/.test(t)?"card":/folha/.test(t)?"payroll":/fiscal/.test(t)?"fiscal":/apropria|agua|energia|telefon|internet/.test(t)?"appropriation":/fornecedor|cliente|adiant/.test(t)?"third_party":"bank";
  let category=kind==="bank"?"Contas Correntes / Aplicações":kind==="cash"?"Caixas":kind==="card"?"Cartões":kind==="payroll"?(/ministro/.test(t)?"Folha - Ministros":/clt/.test(t)?"Folha - CLT":"Folha"):kind==="fiscal"?"Fiscal":kind==="appropriation"?(/agua/.test(t)?"Apropriação - Água":/energia/.test(t)?"Apropriação - Energia":/telefon/.test(t)?"Apropriação - Telefonia":/internet/.test(t)?"Apropriação - Internet":"Apropriação"):/adiant.*fornec/.test(t)?"Adiantamento a fornecedores":/adiant.*client/.test(t)?"Adiantamento a clientes":/fornec/.test(t)?"Fornecedores":"Clientes";
  let inst=""; const m=String(title).match(/\bbanco\s+(.+)$/i);
  if(m&&kind==="bank") inst=/^(do|da|de)\s/i.test(m[1])?"Banco "+m[1].toLowerCase().replace(/^(\S+\s)(.*)$/,(a,p,r)=>p+titleCase(r)):titleCase(m[1].trim());
  return {kind,category,institution:inst};
}

function imBuild(matrix){
  const isHdr=(cells)=>{const n=cells.map(nrm); return n.some(x=>x.startsWith("descri"))&&n.some(x=>x.includes("saldo"));};
  IM.sections=[]; IM.rows=[]; IM.counts={blank:0,header:0,total:0}; IM.statusMap={}; IM.respMap={}; let first=null,cur=-1;
  matrix.forEach((cells,li)=>{
    const ne=cells.map((c,i)=>[i,c.trim()]).filter(x=>x[1]);
    if(!ne.length){ IM.counts.blank++; return; }
    if(isHdr(cells)){ IM.counts.header++; if(!first) first=cells; return; }
    if(/^total\b/.test(nrm(ne[0][1]))){ IM.counts.total++; return; }
    if(ne.length===1&&!/^[\d.,\-\sR$()]+$/.test(ne[0][1])){ IM.sections.push({title:ne[0][1],cfg:guessSection(ne[0][1])}); cur=IM.sections.length-1; return; }
    if(cur<0){ IM.sections.push({title:"(sem título)",cfg:guessSection("")}); cur=0; }
    IM.rows.push({line:li+1,sec:cur,cells});
  });
  IM.headers=first||[]; IM.ncol=Math.max(0,...matrix.map(r=>r.length)); IM.colmap={};
  (first||[]).forEach((c,i)=>{ const n=nrm(c), set=(k)=>{ if(IM.colmap[k]==null) IM.colmap[k]=i; };

  imCfg();

function imCfg(){
