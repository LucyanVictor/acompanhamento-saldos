<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Financeiro e Contabilidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2a2e37; --navy-2:#3a404c; --navy-dark:#1a1d23; --gold:#c9a24a; --gold-soft:#f6efdd;
    --bg:#f3f4f7; --card:#ffffff; --line:#e6e8ef;
    --text:#1c2333; --muted:#5d6577; --soft:#9aa1b0;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Lexend',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
  button,select{font-family:inherit;color:inherit}
  .app{display:grid;grid-template-columns:260px 1fr 310px;min-height:100vh}
  .app.no-agenda{grid-template-columns:260px 1fr}
  .app.no-agenda .agenda{display:none}

  /* ---------- Sidebar ---------- */
  .sidebar{background:#fff;border-right:1px solid var(--line);border-left:5px solid var(--gold);display:flex;flex-direction:column;padding:16px 16px 18px;position:sticky;top:0;height:100vh}
  .logo{padding:2px 6px 14px;border-bottom:1px solid var(--line)}
  .logo img{width:200px;display:block}
  .section-label{font-size:11px;letter-spacing:.14em;font-weight:600;color:#a8832f;margin:22px 6px 10px;text-transform:uppercase}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;border:0;background:none;cursor:pointer;font-size:14px;font-weight:500;color:var(--text);text-align:left;transition:background .15s}
  .nav-item svg{width:18px;height:18px;stroke:currentColor;flex-shrink:0;color:#4a5263}
  .nav-item:hover{background:#f1f3f8}
  .nav-item.active{background:var(--navy);color:#fff;box-shadow:0 6px 14px rgba(26,29,35,.25)}
  .nav-item.active svg{color:var(--gold)!important}
  .nav-item.active svg{color:#fff}
  .sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}
  .foot-text{font-size:12px;color:var(--muted);line-height:1.5;padding:0 6px}
  .foot-actions{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding:0 6px}
  .logout{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;font-size:14px;color:var(--muted)}
  .logout svg,.gear svg{width:20px;height:20px;stroke:currentColor}
  .gear{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px;transition:transform .3s,color .15s}
  .gear:hover{color:var(--gold);transform:rotate(45deg)}

  /* ---------- Main ---------- */
  .main{padding:14px 26px 40px;min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;min-height:40px}
  .pill{display:flex;align-items:center;gap:14px;background:#fff;border-radius:10px;padding:0 14px;height:40px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
  .pill label{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:500}
  .pill select{border:0;background:transparent;font-size:14px;font-weight:500;outline:none;cursor:pointer}
  .pill.empresa select{min-width:200px}
  .pill.ano select{min-width:90px;appearance:none}
  .top-actions{margin-left:auto;display:flex;gap:12px}
  .icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,60,.04);transition:background .15s}
  .icon-btn svg{width:19px;height:19px;stroke:var(--text)}
  .icon-btn:hover{background:#e9ecf4}
  .icon-btn.on{background:var(--navy)} .icon-btn.on svg{stroke:var(--gold)}
  h1{font-size:26px;font-weight:600;margin:22px 0 16px;letter-spacing:-.01em}
  .hero{background:linear-gradient(100deg,var(--navy-dark) 0%,var(--navy) 60%,var(--navy-2) 100%);color:#fff;border-radius:var(--radius);padding:24px 26px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,74,.22),transparent 70%)}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
  .hero h2{font-size:20px;font-weight:600;margin-bottom:8px}
  .hero p{font-size:13.5px;line-height:1.6;max-width:560px;opacity:.95}
  .card{background:var(--card);border-radius:var(--radius);padding:20px 18px;margin-top:16px}
  .card h3{font-size:14.5px;font-weight:600;margin-bottom:12px}
  .card p{color:var(--muted);font-size:13.5px}

  /* ---------- Módulo vinculado ---------- */
  .module{display:none;margin-top:4px}
  .module.show{display:block}
  .module-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .module-bar .tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .module-bar .dot{width:8px;height:8px;border-radius:50%;background:#2fa36b}
  .btn-ext{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text);text-decoration:none;cursor:pointer}
  .btn-ext:hover{border-color:var(--gold);color:#8a6a22}
  .btn-ext svg{width:14px;height:14px;stroke:currentColor}
  .frame-wrap{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(20,30,60,.05);height:calc(100vh - 150px);min-height:520px}
  .frame-wrap iframe{width:100%;height:100%;border:0;display:block}
  .placeholder.hide{display:none}

  /* ---------- Agenda ---------- */
  .agenda{background:#fff;border-left:1px solid var(--line);padding:16px 20px;position:sticky;top:0;height:100vh;overflow:auto}
  .user{display:flex;align-items:center;gap:12px}
  .user img{width:46px;height:46px;border-radius:50%;object-fit:cover}
  .user strong{display:block;font-size:14px;font-weight:600}
  .user span{font-size:12px;color:var(--muted)}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 14px}
  .cal-head h4{font-size:14px;font-weight:600}
  .cal-nav{width:30px;height:30px;border-radius:8px;border:0;background:#f1f3f8;cursor:pointer;font-size:15px;font-weight:600}
  .cal-nav:hover{background:#e3e7f0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
  .cal-grid .dow{font-size:11px;color:var(--muted);padding-bottom:8px}
  .cal-grid button{border:0;background:none;height:34px;border-radius:9px;font-size:13px;cursor:pointer;transition:background .12s}
  .cal-grid button:hover{background:#eef1f7}
  .cal-grid button.out{color:var(--soft)}
  .cal-grid button.today{outline:1.5px solid var(--gold);outline-offset:-1.5px}
  .cal-grid button.sel{background:var(--navy);color:#fff;font-weight:600}
  .today-row{display:flex;justify-content:flex-end;margin-top:10px}
  .btn-light{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .btn-dark{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;margin-top:14px}
  .btn-dark:hover{background:var(--navy-2)}
  .day-title{font-size:13.5px;font-weight:600;margin:26px 0 8px;text-transform:capitalize}
  .day-note{font-size:13px;color:var(--muted);line-height:1.5}

  /* ---------- Privacidade (olho) ---------- */
  .sens{transition:filter .2s}
  body.private .sens{filter:blur(7px);user-select:none}

  /* ---------- Modal Configurações ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,22,45,.35);display:none;place-items:center;z-index:50}
  .overlay.open{display:grid}
  .modal{background:#fff;border-radius:var(--radius);width:min(440px,92vw);padding:22px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .modal-head h3{font-size:16px;font-weight:600}
  .modal p{color:var(--muted);font-size:13.5px;line-height:1.55}
  .x{border:0;background:#f1f3f8;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media (max-width:1100px){.app{grid-template-columns:240px 1fr}.agenda{display:none}.app.show-agenda .agenda{display:block;position:fixed;right:0;top:0;width:300px;z-index:40;box-shadow:-10px 0 30px rgba(0,0,0,.1)}}
  @media (max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.sidebar-foot{display:none}}
</style>
</head>

<script>
(function(){
  // ---------- Abas ----------
  const tabs = {
    contabilidade: { title:'Contabilidade', card:'Contabilidade',
      url:'index.html#dashboard',
      text:'Acompanhamento contábil das empresas: caixas e bancos, cartões, folha, fiscal, apropriações, empréstimos e declarações.' },
    relatorio: { title:'Relatório Financeiro', card:'Relatório Financeiro',
      text:'Relatórios financeiros consolidados: saldos, receitas, despesas e evolução mensal das empresas.' },
    manual: { title:'Manual', card:'Manual',
      text:'Orientações e procedimentos de uso do sistema financeiro e contábil.' }
  };
  const nav = document.getElementById('nav');
  const frames = {};   // cada sistema é carregado uma vez e mantido ao trocar de aba
  function showModule(key){
    const url = tabs[key].url;
    document.getElementById('placeholder').classList.toggle('hide', !!url);
    document.getElementById('module').classList.toggle('show', !!url);
    Object.values(frames).forEach(f => f.style.display = 'none');
    if(!url) return;
    document.getElementById('btnExt').href = url;
    if(!frames[key]){
      const f = document.createElement('iframe');
      f.src = url; f.title = tabs[key].title; f.loading = 'eager';
      f.setAttribute('allow', 'clipboard-write');
      document.getElementById('frameWrap').appendChild(f);
      frames[key] = f;
    }
    frames[key].style.display = 'block';
  }
  function openTab(key){
    if(!tabs[key]) key = 'contabilidade';
    nav.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
    document.getElementById('pageTitle').textContent = tabs[key].title;
    document.getElementById('cardTitle').textContent = tabs[key].card;
    document.getElementById('heroText').textContent = tabs[key].text;
    showModule(key);
    if(location.hash.slice(1) !== key) history.replaceState(null,'','#'+key);
  }
  nav.addEventListener('click', e => { const b = e.target.closest('.nav-item'); if(b) openTab(b.dataset.tab); });
  window.addEventListener('hashchange', () => openTab(location.hash.slice(1)));
  openTab(location.hash.slice(1));

  // ---------- Toast ----------
  const toast = document.getElementById('toast'); let tt;
  function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>toast.classList.remove('show'), 2200); }

  // ---------- Olho (ocultar informações) ----------
  const eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>';
  const eyeOff  = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>';
  let priv = false;
  try { priv = localStorage.getItem('hub_private') === '1'; } catch(e){}
  const btnEye = document.getElementById('btnEye'), eyeIcon = document.getElementById('eyeIcon');
  function applyPriv(){
    document.body.classList.toggle('private', priv);
    eyeIcon.innerHTML = priv ? eyeOff : eyeOpen;
    btnEye.title = priv ? 'Mostrar informações' : 'Ocultar informações';
  }
  btnEye.addEventListener('click', () => { priv = !priv; try{localStorage.setItem('hub_private', priv?'1':'0');}catch(e){} applyPriv(); });
  applyPriv();

  // ---------- Telegram ----------
  document.getElementById('btnTelegram').addEventListener('click', () => showToast('Atalho do Telegram: vincular link do bot/grupo.'));

  // ---------- Agenda (mostrar/ocultar) ----------
  const app = document.getElementById('app'), btnAgenda = document.getElementById('btnAgenda');
  btnAgenda.addEventListener('click', () => {
    const small = window.matchMedia('(max-width:1100px)').matches;
    if(small){ app.classList.toggle('show-agenda'); btnAgenda.classList.toggle('on', app.classList.contains('show-agenda')); }
    else { app.classList.toggle('no-agenda'); btnAgenda.classList.toggle('on', !app.classList.contains('no-agenda')); }
  });

  // ---------- Calendário ----------
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dias  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const diasLongo = ['Domingo','Segunda-Feira','Terça-Feira','Quarta-Feira','Quinta-Feira','Sexta-Feira','Sábado'];
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  let sel = new Date(hoje), view = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const grid = document.getElementById('calGrid');
  const same = (a,b) => a.getTime() === b.getTime();
  function render(){
    document.getElementById('calTitle').textContent = meses[view.getMonth()] + ' De ' + view.getFullYear();
    grid.innerHTML = dias.map(d => '<div class="dow">'+d+'</div>').join('');
    const start = new Date(view); start.setDate(1 - view.getDay());
    for(let i = 0; i < 42; i++){
      const d = new Date(start); d.setDate(start.getDate() + i);
      if(i === 35 && d.getMonth() !== view.getMonth()) break;
      const b = document.createElement('button');
      b.textContent = d.getDate();
      if(d.getMonth() !== view.getMonth()) b.classList.add('out');
      if(same(d, hoje)) b.classList.add('today');
      if(same(d, sel)) b.classList.add('sel');
      b.addEventListener('click', () => { sel = d; if(d.getMonth() !== view.getMonth()) view = new Date(d.getFullYear(), d.getMonth(), 1); render(); });
      grid.appendChild(b);
    }
    document.getElementById('dayTitle').textContent = diasLongo[sel.getDay()] + ', ' + sel.getDate() + ' De ' + meses[sel.getMonth()];
  }
  document.getElementById('calPrev').onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
  document.getElementById('calNext').onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
  document.getElementById('calToday').onclick = () => { sel = new Date(hoje); view = new Date(hoje.getFullYear(), hoje.getMonth(), 1); render(); };
  render();

  document.getElementById('btnGoogle').addEventListener('click', () => showToast('Integração com Google Agenda: a configurar.'));

  // ---------- Configurações ----------
  const ov = document.getElementById('cfgOverlay');
  document.getElementById('btnConfig').onclick = () => ov.classList.add('open');
  document.getElementById('cfgClose').onclick = () => ov.classList.remove('open');
  ov.addEventListener('click', e => { if(e.target === ov) ov.classList.remove('open'); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') ov.classList.remove('open'); });

  document.getElementById('btnSair').onclick = () => showToast('Sair: vincular ao logout do sistema.');
})();
</script>
</body>
</html>
